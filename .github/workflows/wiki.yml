name: Wiki

# Mirrors docs/ into the GitHub wiki; docs/ is the source, edits made in the wiki web UI are overwritten.
on:
  push:
    branches: [main]
    paths: [docs/**]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push docs/ to the wiki
        run: |
          git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git" wiki
          git -C wiki rm -rq --ignore-unmatch .
          cp docs/*.md wiki/
          # Wiki pages are addressed without the .md extension
          sed -i -E 's/\]\(([A-Za-z0-9_-]+)\.md(#[^)]*)?\)/](\1\2)/g' wiki/*.md
          cd wiki
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898699+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Sync docs/ from ${{ github.sha }}"
          git push
seta cg_popupBigFilter "0"  // Filter promotion popups
seta cg_popupFilter "11"  // LEGACY:Filter message popups
//Value Effect
// 0 Filter Disabled
// 1 Filter connect
// 2 Filter team join
// 4 Filter mission
// 8 Filter pickup
// 16 Filter death
seta cg_popupMessageFilter "206" // UNKNOWN MOD: This filters out all the following (sum of numbers to enable):
// 0 Filter disabled
// 1 Filter out objective messages (planted at ..., capture flags, etc.)
// 2 Filter out pick-up messages (Picked up a health/ammo packs, weapons)
// 4 Filter out team joining message
// 8 Filter out player connect/disconnect messages
// 16 Filter out all map script messages (command post constructed, tank damaged, etc.)
// 64 Filter out all obituaries caused by your own team
// 128 Filter out all obituaries for self kills (of all players)
// The result is that you only see obituaries of people in your own team getting killed by people in the other team. It is a perfect way to have quick reflexes when people dont expect it. Lets say you-re running around and you cross teammate X and you see him going into a hallway. A few seconds later you see his obituary. You can now prepare yourself for an enemy coming from that direction.




//Obituaries Now this is where my config comes to shine. Obituaries are a great source of information and are often overlooked. I use the following (NQ-specific) settings:
seta cg_fontScaleSP "0.18"  // legacy only - Font scale for side prints  // does not work?
//seta cg_fontScaleCN
//seta cg_fontScaleCP
//seta cg_fontScaleTP

// com_maxfps, maxFpsNormal: personal values in profiles/user.cfg, these are the ET: Legacy defaults
seta com_maxfps "125"  // 76, 125, 250, 333 jump higher without server pmove_fixed (velocity is rounded every pmove step)
set maxFpsNormal "com_maxfps 125"
set maxFpsLow "com_maxfps 71"  // sniper FPS: vanilla recoil code adds a fixed kick per frame, least at 66-71 FPS; overridden in mod_general.cfg by mods that scale it by frame time

//---[ MOUSE ]-------------------------------------------------//
// - Personal values in profiles/user.cfg (all but m_filter, cl_mouseAccel), these are the ET: Legacy defaults
// - pitchLow/Higher/Sniper keep their ratio to pitchNormal (x0.625, x1.125, x2.5)
seta sensitivity "5" // Mouse sensitivity
set sensitivityNormal "sensitivity 5"
seta m_pitch "0.022" // Mouse pitch sensitivity
set pitchNormal "m_pitch 0.022"
set pitchLow "m_pitch 0.014"  // for lower fov
set pitchHigher "m_pitch 0.025"  // MOUSE5
set pitchSniper "m_pitch 0.055"  // Sniping
seta cg_scopedSensitivityScaler "0.6" // Set scoped mouse sensitivity. The value is a scalar used to calculate the sensitivity depending on field of view when scoped(zoom value). This makes it possible to have an other sensitivity while scoped.
seta m_yaw "0.022" // Mouse yaw sensitivity
seta m_filter "0" // Mouse filter
seta cl_mouseAccel "0" // Mouse acceleration



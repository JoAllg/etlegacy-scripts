//---[ SERVER SETTINGS ]----------------------------------------//
//---[ skill settings ]----------------------------------------//
seta skill_lightweapons "20 50 90 140"
seta skill_battlesense "20 50 90 140"
seta skill_covertops "20 50 90 140"
seta skill_engineer "20 50 90 140"
seta skill_fieldops "20 50 90 140"
seta skill_medic "20 50 90 140"
seta skill_soldier "20 50 90 140"
//---[ omni-bot ]----------------------------------------------//
seta omnibot_flags "0"
seta omnibot_enable "1"
// omnibot_path: set in profiles/user.cfg (absolute path, see user.example.cfg)
//---[ server ]------------------------------------------------//
seta sv_hostname "TESTSERVER"
seta g_countryflags "1"
seta g_autoFireteams "0"
seta g_fixedphysics "1"  // same gravity rounding (jump height) for every client fps (g_fixedphysicsfps)
//---[ spawn & warmup ]----------------------------------------//
// - g_user*RespawnTime: reinforcement time in seconds, 0 = the map script's time, so 1 is the shortest
//   (nitmod: g_instantSpawn below)
seta g_userAlliedRespawnTime "1"
seta g_userAxisRespawnTime "1"
// - ui_user*RespawnTime: the host game menu copies them over g_user*RespawnTime when it starts the map (0 there = 0 here)
seta ui_userAlliedRespawnTime "1"
seta ui_userAxisRespawnTime "1"
seta g_bluelimbotime "1" // Overwritten by map script
seta g_redlimbotime "1" // Overwritten by map script
seta g_warmup "0"  // Warmup time; legacy still counts down a second, nitmod 10 s (/map_restart 0 skips it, mods/nitmod/README.md)
//---[ flood protection off ]----------------------------------//
// - g_voiceChatsAllowed: vsays per 30 s before "Spam Protection: VoiceChat ignored" (each one costs 30000/N ms of that budget,
//   nitmod 34000/N); 0 would block every vsay, a value above 34000 costs nothing per vsay, so there is no limit
seta g_voiceChatsAllowed "100000"
seta sv_floodProtect "1"  // engine: one client command per 800 ms; only checked on a dedicated server
seta sv_userInfoFloodProtect "0"  // engine: delays name/class (userinfo) changes
//---[ mod specific ]------------------------------------------//
// - Without effect in the other mods
// - set, not seta: an archived value would stay in the shared etconfig.cfg of all mods
set g_instantSpawn "1"  // nitmod - respawn instantly, respawn times are ignored
set g_floodprotect "0"  // nitmod - chat/vsay/command flood protection (threshold: g_floodthreshold)
set g_floodProtection "0"  // legacy - chat/vsay/command flood protection (g_floodLimit commands, then g_floodWait ms)


echo "^5    *** SERVER SETTINGS LOADED!"

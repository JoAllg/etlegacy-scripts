// Execs all definitions (aliases, binds, cvars),              //
// re-exec'd by F3                                             //
/////////////////////////////////////////////////////////////////

// Definitions: everything that is safe to re-exec.
// - Exec'd by mods/<mod>/autoexec.cfg (game start, mod switch) and by F3 (reloadDefinitions)
// - Start values of state belong in profiles/<profile>/state.cfg instead
set reloadDefinitions "exec profile/definitions.cfg; exec profiles/user.cfg; vstr resetToggles; vstr serverForce"  // F3 (scripts.cfg); user.cfg after the definitions, the server's settings last, as in autoexec.cfg; resetToggles: the definitions and user.cfg reset only part of a class toggle (sniper mode keeps its FPS)

// Settings of the server the game is on (serverconfigs/): current.cfg is written by tools/serverconfig.py and applies them once per server
set serverCheck "execq profile/serverconfigs/current.cfg"  // run on map load (autoexec_mod.cfg, every server change loads a map) and by the class keys (jaymod runs no autoexecs; a tool that wrote late); execq: a key press runs it
set serverForce "set serverLast vstr serverApply; vstr serverCheck"  // applies them again: the definitions overwrote the server's values

exec profile/scripts/common.cfg  // shared primitives (sounds, null) first
exec profile/cvars.cfg
exec profile/binds_default.cfg
exec profile/binds_custom.cfg
exec profile/scripts/scripts.cfg
exec profile/scripts/movement.cfg
exec profile/scripts/display.cfg
exec profile/scripts/classcript.cfg
exec profile/scripts/spawnscript.cfg
exec profile/scripts/voicechat.cfg
exec profile/server/server.cfg
exec profile/scripts/servermenu.cfg
exec profile/scripts/devmode.cfg

exec mod_general.cfg  // mod folder (symlink), mod differences overwrite the general values
exec mod_classcommands.cfg  // mod folder (symlink), mod specific weapon IDs

echo "^5  *** DEFINITIONS LOADED!"

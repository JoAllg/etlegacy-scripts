//--- [ EXPLANATION ] ---//


//Special Keys
// ß = US_MINUS
// "'" = US_EQUALS
// ü = US_LEFTBRACKET
// ä = US_APOSTROPHE
// ö = US_SE MICOLON
// POS1 = HOME
// ENDE = END
// BildUP = PGUP
// BildDOWN = PGDN


//--- [ CUSTOM BINDS / BASIC OVERRIDES ] ---//

bind x "kill; forcetapout; vstr resetTemporary; vstr resetWeapon"  // forcetapout: all installed mods (legacy, nitmod, jaymod, silEnT, etjump); resets (scripts/scripts.cfg): the next life starts with the default script state
bind n "playdead"  // nitmod and silEnT only, "unknown command" elsewhere
bind KP_PLUS "messagemode2"  // message team
bind KP_ENTER "messagemode"  // message all

// TAB start bind: profiles/<profile>/state.cfg (the voicechat layer rebinds it)
set bindTabScores "bind TAB +scores"
// MWHEELUP start bind: profiles/<profile>/state.cfg (cs_default rebinds it)


// Voting/Ready keybinds
bind LEFTARROW		"notready; echo ^wPlayer^f.^wisReady(^jfalse^w)"
bind RIGHTARROW 	"ready; echo ^wPlayer^f.^wisReady(^htrue^w)"
bind UPARROW		  "vote yes"
bind DOWNARROW		"vote no"


// Weapon binds with customs settings per weapon
// - Pistols do not autoreload and set FPS to 71
// - SMG with autosprint while shooting (and autoreload on
// - Sets the next weaponSwitch for the EASY WEAPONSWITCH (TOGGLE) depending on the current weapon
// - Pistols or SMG without any ammo left: the key selects the other one instead (bankPistol/bankSMGSelect). Disadvantage: the settings of the pressed key stay active
// - cg_drawgun COULD be set for each weapon

// Bank with a fallback: the wanted bank first, its switch starts cg_weaponCycleDelay, which blocks the fallback in the same frame; an empty bank
// starts no delay, so the fallback runs (legacy cg_weapons.c CG_WeaponBank_f). Mods that start the delay on an empty bank too override these
// aliases in mods/<mod>/mod_general.cfg
// bankSMG is the form the SMG key runs: bankSMGSelect from another bank (set by the other weapon keys), bankSMGCycle while bank 3 is in hand
// (set by resetWeapon: SMG key, new life), for mods whose fallback form can't step to the next weapon of bank 3. Start value: profiles/<profile>/state.cfg
set bankPistol "weaponbank 2; weaponbank 3"
set bankSMGSelect "weaponbank 3; weaponbank 2"
set bankSMGCycle "vstr bankSMGSelect"

set bindWeapons "bind 1 vstr weapon1; bind 2 vstr weapon2; bind 3 vstr weapon3; bind 4 vstr weapon4; bind 5 vstr weapon5; bind 6 vstr weapon6; bind 7 vstr weapon7"
// Number row start binds (vstr bindWeapons): profiles/<profile>/state.cfg (spawn/chat layers rebind them)
// Restores every key the menu layers (spawnscript.cfg, voicechat.cfg) bind: 1-0, US_MINUS, US_EQUALS, TAB
set reBindNumbers "vstr bindWeapons; vstr bindTabScores; unbind 8; unbind 9; unbind 0; unbind US_MINUS; unbind US_EQUALS"
// Free the layer keys before a menu binds its own, so no key keeps the action of the page or map before
// - unbindNumberRow: spawn menu (autoexec_axis/allies.cfg), TAB stays on the scores
// - unbindNumbers: voice chat and server menu pages, which use TAB as well
set unbindNumberRow "unbind 1; unbind 2; unbind 3; unbind 4; unbind 5; unbind 6; unbind 7; unbind 8; unbind 9; unbind 0; unbind US_MINUS; unbind US_EQUALS"
set unbindNumbers "vstr unbindNumberRow; unbind TAB"
set setWeapon3Normal "vstr maxFpsNormal; vstr bindMouse1Sprint"
set setWeapon3 "vstr setWeapon3Normal"  // weapon3 settings, switched by sniper mode (class/cs_classcripts.cfg)
set resetWeapon "vstr setWeapon3; vstr autoReloadNormal; set weaponSwitch vstr switchAlt; vstr resetGrenade; set bankSMG vstr bankSMGCycle"  // weapon3 settings without the switch: the weapon held after a respawn (kill key)
set weapon1  "weaponbank 1; vstr maxFpsNormal; vstr bindMouse1Attack; set weaponSwitch vstr switchSMG; vstr resetGrenade; set bankSMG vstr bankSMGSelect"
set weapon2  "vstr bankPistol; vstr maxFpsLow; vstr bindMouse1Attack; cg_autoreload 0; set weaponSwitch vstr switchSMG; vstr resetGrenade; set bankSMG vstr bankSMGSelect"
set weapon3  "vstr bankSMG; vstr resetWeapon"
set weapon4  "weaponbank 4; vstr maxFpsNormal; vstr bindMouse1Grenade; set weaponSwitch vstr switchSMG; set bankSMG vstr bankSMGSelect"
set weapon5  "weaponbank 5; vstr maxFpsNormal; vstr bindMouse1Attack; set weaponSwitch vstr switchSMG; vstr resetGrenade; set bankSMG vstr bankSMGSelect"
set weapon6  "weaponbank 6; vstr maxFpsNormal; vstr bindMouse1Attack; set weaponSwitch vstr switchSMG; vstr resetGrenade; set bankSMG vstr bankSMGSelect"
set weapon7  "weaponbank 7; vstr maxFpsNormal; vstr bindMouse1Attack; set weaponSwitch vstr switchSMG; vstr resetGrenade; set bankSMG vstr bankSMGSelect"

echo "^5    *** CUSTOM BINDS LOADED!"

//--- [ EXPLANATION ] ---//


//Special Keys
// ß = US_MINUS
// "'" = US_EQUALS
// ü = US_LEFTBRACKET
// ä = US_APOSTROPHE
// ö = US_SE MICOLON
// POS1 = HOME
// ENDE = END
// BildUP = PGUP
// BildDOWN = PGDN


//--- [ CUSTOM BINDS / BASIC OVERRIDES ] ---//

bind x "kill; forcetapout; vstr resetTemporary"  // forcetapout: all installed mods (legacy, nitmod, jaymod, silEnT, etjump); resetTemporary (scripts/scripts.cfg): the next life starts with the default script state
bind n "playdead"  // nitmod and silEnT only, "unknown command" elsewhere
bind KP_PLUS "messagemode2"  // message team
bind KP_ENTER "messagemode"  // message all

// TAB start bind: profiles/<profile>/state.cfg (the voicechat layer rebinds it)
set bindTabScores "bind TAB +scores"
// MWHEELUP start bind: profiles/<profile>/state.cfg (cs_default rebinds it)


// Voting/Ready keybinds
bind LEFTARROW		"notready; echo ^wPlayer^f.^wisReady(^jfalse^w)"
bind RIGHTARROW 	"ready; echo ^wPlayer^f.^wisReady(^htrue^w)"
bind UPARROW		  "vote yes"
bind DOWNARROW		"vote no"


// Weapon binds with customs settings per weapon
// - Pistols do not autoreload and set FPS to 71
// - SMG with autosprint while shooting (and autoreload on
// - Sets the next weaponSwitch for the EASY WEAPONSWITCH (TOGGLE) depending on the current weapon
// TODO: broken on a nitmod server! - When pistols or SMG is choosen and they are empty (no ammo left at all) then it will automatically switch to SMG or Pistols respectivley. Disadvantage is, that the custom settings for the other weapon are still active
// - cg_drawgun COULD be set for each weapon

set bindWeapons "bind 1 vstr weapon1; bind 2 vstr weapon2; bind 3 vstr weapon3; bind 4 vstr weapon4; bind 5 vstr weapon5; bind 6 vstr weapon6; bind 7 vstr weapon7"
// Number row start binds (vstr bindWeapons): profiles/<profile>/state.cfg (spawn/chat layers rebind them)
// Restores every key the menu layers (spawnscript.cfg, voicechat.cfg) bind: 1-0, US_MINUS, US_EQUALS, TAB
set reBindNumbers "vstr bindWeapons; vstr bindTabScores; unbind 8; unbind 9; unbind 0; unbind US_MINUS; unbind US_EQUALS"
// Frees every layer key; each voice chat page runs it before its binds, so no key keeps the action of the page before
set unbindNumbers "unbind 1; unbind 2; unbind 3; unbind 4; unbind 5; unbind 6; unbind 7; unbind 8; unbind 9; unbind 0; unbind US_MINUS; unbind US_EQUALS; unbind TAB"
set setWeapon3Normal "vstr maxFpsNormal; vstr bindMouse1Sprint"
set setWeapon3 "vstr setWeapon3Normal"  // weapon3 settings, switched by sniper mode (class/cs_classcripts.cfg)
set resetWeapon "vstr setWeapon3; vstr autoReloadNormal; set weaponSwitch vstr switchAlt; vstr resetGrenade"  // weapon3 settings without the switch: the weapon held after a respawn (resetTemporary, scripts/scripts.cfg)
set weapon1  "weaponbank 1; vstr maxFpsNormal; vstr bindMouse1Attack; set weaponSwitch vstr switchSMG; vstr resetGrenade"
set weapon2  "weaponbank 2; weaponbank 3; vstr maxFpsLow; vstr bindMouse1Attack; cg_autoreload 0; set weaponSwitch vstr switchSMG; vstr resetGrenade"
set weapon3  "weaponbank 3; weaponbank 2; vstr resetWeapon"
set weapon4  "weaponbank 4; vstr maxFpsNormal; vstr bindMouse1Grenade; set weaponSwitch vstr switchSMG"
set weapon5  "weaponbank 5; vstr maxFpsNormal; vstr bindMouse1Attack; set weaponSwitch vstr switchSMG; vstr resetGrenade"
set weapon6  "weaponbank 6; vstr maxFpsNormal; vstr bindMouse1Attack; set weaponSwitch vstr switchSMG; vstr resetGrenade"
set weapon7  "weaponbank 7; vstr maxFpsNormal; vstr bindMouse1Attack; set weaponSwitch vstr switchSMG; vstr resetGrenade"

echo "^5    *** CUSTOM BINDS LOADED!"

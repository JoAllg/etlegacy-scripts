// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
// - spawnpsr/-psb bind only this map's keys: spawnpoints left over from the previous map are on no key
set spawnpsr    "vstr echospr; bind 1 vstr spawnp0r; bind 2 vstr spawnp1r; bind 3 vstr spawnp2r; bind 4 vstr spawnp3r; bind 5 vstr spawnp4r"
set spawnpsb    "vstr echospb; bind 1 vstr spawnp0b; bind 2 vstr spawnp1b; bind 3 vstr spawnp2b; bind 4 vstr spawnp3b; bind 5 vstr spawnp4b"

set spawnp0r    "setspawnpt 0; set spawnsay vstr spawnsay0; vstr spawnChosen"
set spawnp1r    "setspawnpt 1; set spawnsay vstr spawnsay1; vstr spawnChosen"
set spawnp2r    "setspawnpt 4; set spawnsay vstr spawnsay2; vstr spawnChosen"
set spawnp3r    "setspawnpt 5; set spawnsay vstr spawnsay3; vstr spawnChosen"
set spawnp4r    "setspawnpt 6; set spawnsay vstr spawnsay3; vstr spawnChosen"

set spawnp0b    "setspawnpt 0; set spawnsay vstr spawnsay0; vstr spawnChosen"
set spawnp1b    "setspawnpt 2; set spawnsay vstr spawnsay4; vstr spawnChosen"
set spawnp2b    "setspawnpt 3; set spawnsay vstr spawnsay5; vstr spawnChosen"
set spawnp3b    "setspawnpt 5; set spawnsay vstr spawnsay3; vstr spawnChosen"
set spawnp4b    "setspawnpt 6; set spawnsay vstr spawnsay3; vstr spawnChosen"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r; vstr echosp2r; vstr echosp3r; vstr echosp4r"
set echosp0r    "echo ^31. ^7Default Spawn"
set echosp1r    "echo ^32. ^iThe Bridge"
set echosp2r    "echo ^33. ^iSouth Arch"
set echosp3r    "echo ^34. ^iForward Deployment - Forward Deployment Area"
set echosp4r    "echo ^35. ^iForward Deployment - Forward Deployment Overlook"
// not selectable while the rooms above are active: The Bridge - Bridge

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b; vstr echosp1b; vstr echosp2b; vstr echosp3b; vstr echosp4b"
set echosp0b    "echo ^31. ^7Default Spawn"
set echosp1b    "echo ^32. ^dCommand Center"
set echosp2b    "echo ^33. ^dBanner Room"
set echosp3b    "echo ^34. ^dForward Deployment - Forward Deployment Area"
set echosp4b    "echo ^35. ^dForward Deployment - Forward Deployment Overlook"
// not selectable while the rooms above are active: Command Center - Outside the Mansion

// Announce spawnpoints
set spawnsay0   "vstr playFilter; say_teamnl ^9I will spawn at ^xDefault Spawn"
set spawnsay1   "vstr playFilter; say_teamnl ^9I will spawn at ^xThe Bridge"
set spawnsay2   "vstr playFilter; say_teamnl ^9I will spawn at ^xSouth Arch"
set spawnsay3   "vstr playFilter; say_teamnl ^9I will spawn at ^xForward Deployment"
set spawnsay4   "vstr playFilter; say_teamnl ^9I will spawn at ^xCommand Center"
set spawnsay5   "vstr playFilter; say_teamnl ^9I will spawn at ^xBanner Room"

echo ^5>>> AUTOEXEC_MAP LOADED!

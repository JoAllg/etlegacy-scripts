///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
// - spawnpsr/-psb bind only this map's keys: spawnpoints left over from the previous map are on no key
set spawnpsr    "vstr echospr; bind 1 vstr spawnp0r; bind 2 vstr spawnp1r; bind 3 vstr spawnp2r; bind 4 vstr spawnp3r; bind 5 vstr spawnp4r; bind 6 vstr spawnp5r"
set spawnpsb    "vstr echospb; bind 1 vstr spawnp0b; bind 2 vstr spawnp1b; bind 3 vstr spawnp2b; bind 4 vstr spawnp3b; bind 5 vstr spawnp4b"

set spawnp0r    "setspawnpt 0; set spawnsay vstr spawnsay0; vstr spawnChosen"
set spawnp1r    "setspawnpt 2; set spawnsay vstr spawnsay1; vstr spawnChosen"
set spawnp2r    "setspawnpt 3; set spawnsay vstr spawnsay1; vstr spawnChosen"
set spawnp3r    "setspawnpt 4; set spawnsay vstr spawnsay2; vstr spawnChosen"
set spawnp4r    "setspawnpt 5; set spawnsay vstr spawnsay3; vstr spawnChosen"
set spawnp5r    "setspawnpt 6; set spawnsay vstr spawnsay4; vstr spawnChosen"

set spawnp0b    "setspawnpt 0; set spawnsay vstr spawnsay0; vstr spawnChosen"
set spawnp1b    "setspawnpt 1; set spawnsay vstr spawnsay5; vstr spawnChosen"
set spawnp2b    "setspawnpt 2; set spawnsay vstr spawnsay6; vstr spawnChosen"
set spawnp3b    "setspawnpt 3; set spawnsay vstr spawnsay1; vstr spawnChosen"
set spawnp4b    "setspawnpt 6; set spawnsay vstr spawnsay1; vstr spawnChosen"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r; vstr echosp2r; vstr echosp3r; vstr echosp4r; vstr echosp5r"
set echosp0r    "echo ^31. ^7Default Spawn"
set echosp1r    "echo ^32. ^iForward Bunker - Forward Bunker Flag (north)"
set echosp2r    "echo ^33. ^iForward Bunker - Forward Bunker Flag (south)"
set echosp3r    "echo ^34. ^iForward Hut"
set echosp4r    "echo ^35. ^iLower Warehouse"
set echosp5r    "echo ^36. ^iRoad Hut"
// not selectable while the rooms above are active: Road Hut - Road Hut Bed

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b; vstr echosp1b; vstr echosp2b; vstr echosp3b; vstr echosp4b"
set echosp0b    "echo ^31. ^7Default Spawn"
set echosp1b    "echo ^32. ^dSide Entrance Bunker"
set echosp2b    "echo ^33. ^dAbandoned Villa"
set echosp3b    "echo ^34. ^dForward Bunker - Forward Bunker Flag (south)"
set echosp4b    "echo ^35. ^dForward Bunker - Forward Bunker Flag (north)"
// not selectable while the rooms above are active: Abandoned Villa - Villa South West Bedroom; Abandoned Villa - Villa Office

// Announce spawnpoints
set spawnsay0   "vstr playFilter; say_teamnl ^9I will spawn at ^xDefault Spawn"
set spawnsay1   "vstr playFilter; say_teamnl ^9I will spawn at ^xForward Bunker"
set spawnsay2   "vstr playFilter; say_teamnl ^9I will spawn at ^xForward Hut"
set spawnsay3   "vstr playFilter; say_teamnl ^9I will spawn at ^xLower Warehouse"
set spawnsay4   "vstr playFilter; say_teamnl ^9I will spawn at ^xRoad Hut"
set spawnsay5   "vstr playFilter; say_teamnl ^9I will spawn at ^xSide Entrance Bunker"
set spawnsay6   "vstr playFilter; say_teamnl ^9I will spawn at ^xAbandoned Villa"

echo ^5>>> AUTOEXEC_MAP LOADED!

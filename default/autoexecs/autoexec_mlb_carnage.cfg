// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
// - spawnpsr/-psb bind only this map's keys: spawnpoints left over from the previous map are on no key
set spawnpsr    "vstr echospr; bind 1 vstr spawnp0r; bind 2 vstr spawnp1r; bind 3 vstr spawnp2r; bind 4 vstr spawnp3r; bind 5 vstr spawnp4r; bind 6 vstr spawnp5r; bind 7 vstr spawnp6r"
set spawnpsb    "vstr echospb; bind 1 vstr spawnp0b; bind 2 vstr spawnp1b; bind 3 vstr spawnp2b; bind 4 vstr spawnp3b; bind 5 vstr spawnp4b; bind 6 vstr spawnp5b"

set spawnp0r    "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect; vstr spawnReport"
set spawnp1r    "setspawnpt 1; vstr resetSpawnSelector; set spawnsay vstr spawnsay1; vstr playSelect; vstr spawnReport"
set spawnp2r    "setspawnpt 3; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect; vstr spawnReport"
set spawnp3r    "setspawnpt 4; vstr resetSpawnSelector; set spawnsay vstr spawnsay3; vstr playSelect; vstr spawnReport"
set spawnp4r    "setspawnpt 2; vstr resetSpawnSelector; set spawnsay vstr spawnsay4; vstr playSelect; vstr spawnReport"
set spawnp5r    "setspawnpt 5; vstr resetSpawnSelector; set spawnsay vstr spawnsay4; vstr playSelect; vstr spawnReport"
set spawnp6r    "setspawnpt 6; vstr resetSpawnSelector; set spawnsay vstr spawnsay5; vstr playSelect; vstr spawnReport"

set spawnp0b    "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect; vstr spawnReport"
set spawnp1b    "setspawnpt 1; vstr resetSpawnSelector; set spawnsay vstr spawnsay1; vstr playSelect; vstr spawnReport"
set spawnp2b    "setspawnpt 3; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect; vstr spawnReport"
set spawnp3b    "setspawnpt 4; vstr resetSpawnSelector; set spawnsay vstr spawnsay3; vstr playSelect; vstr spawnReport"
set spawnp4b    "setspawnpt 5; vstr resetSpawnSelector; set spawnsay vstr spawnsay4; vstr playSelect; vstr spawnReport"
set spawnp5b    "setspawnpt 6; vstr resetSpawnSelector; set spawnsay vstr spawnsay5; vstr playSelect; vstr spawnReport"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r; vstr echosp2r; vstr echosp3r; vstr echosp4r; vstr echosp5r; vstr echosp6r"
set echosp0r    "echo ^31. ^7Default Spawn"
set echosp1r    "echo ^32. ^iAxis base"
set echosp2r    "echo ^33. ^iTrenches Flag"
set echosp3r    "echo ^34. ^iAxis battery"
set echosp4r    "echo ^35. ^iAxis start - Main Beach Bunker"
set echosp5r    "echo ^36. ^iAxis start - Beach"
set echosp6r    "echo ^37. ^iCanyon Bunker"
// not selectable while the rooms above are active: Canyon Bunker - Axis Base South Corridor; Axis base - Axis Base; Axis start - Canyon Bunker; Trenches Flag - Canyon Bunker MG42; Canyon Bunker - Main Bunker; Axis battery - Battery Spawn

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b; vstr echosp1b; vstr echosp2b; vstr echosp3b; vstr echosp4b; vstr echosp5b"
set echosp0b    "echo ^31. ^7Default Spawn"
set echosp1b    "echo ^32. ^dAxis base"
set echosp2b    "echo ^33. ^dTrenches Flag"
set echosp3b    "echo ^34. ^dAxis battery"
set echosp4b    "echo ^35. ^dAxis start"
set echosp5b    "echo ^36. ^dCanyon Bunker"
// not selectable while the rooms above are active: Axis battery - Ocean; Axis battery - Beach; Trenches Flag - Trenches Flag Bunker; Axis base - Axis Base; Canyon Bunker - Main Bunker

// Announce spawnpoints
set spawnsay0   "vstr playFilter; say_teamnl ^5will spawn at ^0Default Spawn"
set spawnsay1   "vstr playFilter; say_teamnl ^5will spawn at ^wAxis base"
set spawnsay2   "vstr playFilter; say_teamnl ^5will spawn at ^wTrenches Flag"
set spawnsay3   "vstr playFilter; say_teamnl ^5will spawn at ^wAxis battery"
set spawnsay4   "vstr playFilter; say_teamnl ^5will spawn at ^wAxis start"
set spawnsay5   "vstr playFilter; say_teamnl ^5will spawn at ^wCanyon Bunker"

echo ^5>>> AUTOEXEC_MAP LOADED!

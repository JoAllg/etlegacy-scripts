// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
exec profile/scripts/spawn/generic_spawnpoints.cfg  // generic list first, so the previous map's spawnpoints are gone
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
set spawnp0r    "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect;"
set spawnp1r    "setspawnpt 2; vstr resetSpawnSelector; set spawnsay vstr spawnsay1; vstr playSelect;"
set spawnp2r    "setspawnpt 3; vstr resetSpawnSelector; set spawnsay vstr spawnsay1; vstr playSelect;"
set spawnp3r    "setspawnpt 4; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect;"
set spawnp4r    "setspawnpt 5; vstr resetSpawnSelector; set spawnsay vstr spawnsay3; vstr playSelect;"

set spawnp0b    "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect;"
set spawnp1b    "setspawnpt 1; vstr resetSpawnSelector; set spawnsay vstr spawnsay4; vstr playSelect;"
set spawnp2b    "setspawnpt 2; vstr resetSpawnSelector; set spawnsay vstr spawnsay5; vstr playSelect;"
set spawnp3b    "setspawnpt 3; vstr resetSpawnSelector; set spawnsay vstr spawnsay1; vstr playSelect;"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r; vstr echosp2r; vstr echosp3r; vstr echosp4r"
set echosp0r    "echo ^31. ^7Default Spawn"
set echosp1r    "echo ^32. ^iForward Bunker - -594 1860 1328"
set echosp2r    "echo ^33. ^iForward Bunker - -661 1532 1327"
set echosp3r    "echo ^34. ^iForward Hut"
set echosp4r    "echo ^35. ^iLower Warehouse"

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b; vstr echosp1b; vstr echosp2b; vstr echosp3b"
set echosp0b    "echo ^31. ^7Default Spawn"
set echosp1b    "echo ^32. ^dSide Entrance Bunker"
set echosp2b    "echo ^33. ^dAbandoned Villa"
set echosp3b    "echo ^34. ^dForward Bunker"
// not selectable while the rooms above are active: Abandoned Villa - 2505 2884 1524; Abandoned Villa - 2412 3200 1524; Abandoned Villa - 2759 4025 1344; Forward Bunker - -594 1858 1328

// Announce spawnpoints
set spawnsay0   "vstr playFilter; say_teamnl ^5will spawn at ^0Default Spawn"
set spawnsay1   "vstr playFilter; say_teamnl ^5will spawn at ^wForward Bunker"
set spawnsay2   "vstr playFilter; say_teamnl ^5will spawn at ^wForward Hut"
set spawnsay3   "vstr playFilter; say_teamnl ^5will spawn at ^wLower Warehouse"
set spawnsay4   "vstr playFilter; say_teamnl ^5will spawn at ^wSide Entrance Bunker"
set spawnsay5   "vstr playFilter; say_teamnl ^5will spawn at ^wAbandoned Villa"

echo ^5>>> AUTOEXEC_MAP LOADED!

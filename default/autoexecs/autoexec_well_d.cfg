// Map name       The Well Of Youth                                                                                  //
// Generated by   Taranis with https://github.com/JoAllg/etlegacy-scripts/blob/main/tools/spawnpoints/spawnpoints.py //
// From           well_d.pk3                                                                                         //
// Last edited    10.10.2026                                                                                         //
///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
// - spawnpsr/-psb bind only this map's keys: spawnpoints left over from the previous map are on no key
set spawnpsr    "vstr echospr; bind 1 vstr spawnp0r; bind 2 vstr spawnp1r; bind 3 vstr spawnp2r"
set spawnpsb    "vstr echospb; bind 1 vstr spawnp0b; bind 2 vstr spawnp1b; bind 3 vstr spawnp2b"

set spawnp0r    "setspawnpt 0; set spawnsay vstr spawnsay0; vstr spawnChosen"
set spawnp1r    "setspawnpt 1; set spawnsay vstr spawnsay1; vstr spawnChosen"
set spawnp2r    "setspawnpt 2; set spawnsay vstr spawnsay1; vstr spawnChosen"

set spawnp0b    "setspawnpt 0; set spawnsay vstr spawnsay0; vstr spawnChosen"
set spawnp1b    "setspawnpt 1; set spawnsay vstr spawnsay2; vstr spawnChosen"
set spawnp2b    "setspawnpt 2; set spawnsay vstr spawnsay2; vstr spawnChosen"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r; vstr echosp2r"
set echosp0r    "echo ^31. ^7Default Spawn"
set echosp1r    "echo ^32. ^iAxis Spawn - -1264 864 1000"
set echosp2r    "echo ^33. ^iAxis Spawn - -1784 176 1080"
// not selectable while the rooms above are active: Axis Spawn - -1432 1464 1080; Axis Spawn - -1776 1568 1080; Axis Spawn - -1440 280 1080; Axis Spawn - -1624 808 1000

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b; vstr echosp1b; vstr echosp2b"
set echosp0b    "echo ^31. ^7Default Spawn"
set echosp1b    "echo ^32. ^dSpawn 2 - -11392 -1200 936"
set echosp2b    "echo ^33. ^dSpawn 2 - -11800 -888 936"
// not selectable while the rooms above are active: Spawn 2 - -11560 -496 936; Spawn 2 - -11672 -1168 936; Spawn 2 - -11496 -728 936; Spawn 2 - -12200 -664 976; Spawn 2 - -12208 -1168 976

// Announce spawnpoints
set spawnsay0   "vstr playFilter; say_teamnl ^9I will spawn at ^xDefault Spawn"
set spawnsay1   "vstr playFilter; say_teamnl ^9I will spawn at ^xAxis Spawn"
set spawnsay2   "vstr playFilter; say_teamnl ^9I will spawn at ^xSpawn 2"

echo ^5>>> AUTOEXEC_MAP LOADED!

///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
// - spawnpsr/-psb bind only this map's keys: spawnpoints left over from the previous map are on no key
set spawnpsr    "vstr echospr; bind 1 vstr spawnp0r; bind 2 vstr spawnp1r; bind 3 vstr spawnp2r; bind 4 vstr spawnp3r; bind 5 vstr spawnp4r"
set spawnpsb    "vstr echospb; bind 1 vstr spawnp0b; bind 2 vstr spawnp1b; bind 3 vstr spawnp2b; bind 4 vstr spawnp3b; bind 5 vstr spawnp4b; bind 6 vstr spawnp5b; bind 7 vstr spawnp6b"

set spawnp0r    "setspawnpt 0; set spawnsay vstr spawnsay0; vstr spawnChosen"
set spawnp1r    "setspawnpt 1; set spawnsay vstr spawnsay1; vstr spawnChosen"
set spawnp2r    "setspawnpt 3; set spawnsay vstr spawnsay2; vstr spawnChosen"
set spawnp3r    "setspawnpt 5; set spawnsay vstr spawnsay3; vstr spawnChosen"
set spawnp4r    "setspawnpt 6; set spawnsay vstr spawnsay4; vstr spawnChosen"

set spawnp0b    "setspawnpt 0; set spawnsay vstr spawnsay0; vstr spawnChosen"
set spawnp1b    "setspawnpt 2; set spawnsay vstr spawnsay3; vstr spawnChosen"
set spawnp2b    "setspawnpt 4; set spawnsay vstr spawnsay4; vstr spawnChosen"
set spawnp3b    "setspawnpt 7; set spawnsay vstr spawnsay5; vstr spawnChosen"
set spawnp4b    "setspawnpt 8; set spawnsay vstr spawnsay6; vstr spawnChosen"
set spawnp5b    "setspawnpt 1; set spawnsay vstr spawnsay7; vstr spawnChosen"
set spawnp6b    "setspawnpt 9; set spawnsay vstr spawnsay7; vstr spawnChosen"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r; vstr echosp2r; vstr echosp3r; vstr echosp4r"
set echosp0r    "echo ^31. ^7Default Spawn"
set echosp1r    "echo ^32. ^iAxis Guardpost"
set echosp2r    "echo ^33. ^iThe Old Shed"
set echosp3r    "echo ^34. ^iRadio Bunker"
set echosp4r    "echo ^35. ^iGenerator Room"
// not selectable while the rooms above are active: Axis Guardpost - Axis Guardpost; The Old Shed - Desert Hills

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b; vstr echosp1b; vstr echosp2b; vstr echosp3b; vstr echosp4b; vstr echosp5b; vstr echosp6b"
set echosp0b    "echo ^31. ^7Default Spawn"
set echosp1b    "echo ^32. ^dRadio Bunker"
set echosp2b    "echo ^33. ^dGenerator Room"
set echosp3b    "echo ^34. ^dBeach Bunker"
set echosp4b    "echo ^35. ^dBeach"
set echosp5b    "echo ^36. ^dOpen Beach - Open Beach (north)"
set echosp6b    "echo ^37. ^dOpen Beach - Open Beach (south)"
// not selectable while the rooms above are active: Open Beach - Open Beach

// Announce spawnpoints
set spawnsay0   "vstr playFilter; say_teamnl ^9I will spawn at ^xDefault Spawn"
set spawnsay1   "vstr playFilter; say_teamnl ^9I will spawn at ^xAxis Guardpost"
set spawnsay2   "vstr playFilter; say_teamnl ^9I will spawn at ^xThe Old Shed"
set spawnsay3   "vstr playFilter; say_teamnl ^9I will spawn at ^xRadio Bunker"
set spawnsay4   "vstr playFilter; say_teamnl ^9I will spawn at ^xGenerator Room"
set spawnsay5   "vstr playFilter; say_teamnl ^9I will spawn at ^xBeach Bunker"
set spawnsay6   "vstr playFilter; say_teamnl ^9I will spawn at ^xBeach"
set spawnsay7   "vstr playFilter; say_teamnl ^9I will spawn at ^xOpen Beach"

echo ^5>>> AUTOEXEC_MAP LOADED!

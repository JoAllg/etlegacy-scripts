// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
// - spawnpsr/-psb bind only this map's keys: spawnpoints left over from the previous map are on no key
set spawnpsr    "vstr echospr; bind 1 vstr spawnp0r; bind 2 vstr spawnp1r; bind 3 vstr spawnp2r; bind 4 vstr spawnp3r; bind 5 vstr spawnp4r; bind 6 vstr spawnp5r; bind 7 vstr spawnp6r"
set spawnpsb    "vstr echospb; bind 1 vstr spawnp0b; bind 2 vstr spawnp1b; bind 3 vstr spawnp2b; bind 4 vstr spawnp3b; bind 5 vstr spawnp4b; bind 6 vstr spawnp5b; bind 7 vstr spawnp6b"

set spawnp0r    "setspawnpt 0; set spawnsay vstr spawnsay0; vstr spawnChosen"
set spawnp1r    "setspawnpt 1; set spawnsay vstr spawnsay1; vstr spawnChosen"
set spawnp2r    "setspawnpt 3; set spawnsay vstr spawnsay2; vstr spawnChosen"
set spawnp3r    "setspawnpt 4; set spawnsay vstr spawnsay2; vstr spawnChosen"
set spawnp4r    "setspawnpt 7; set spawnsay vstr spawnsay3; vstr spawnChosen"
set spawnp5r    "setspawnpt 6; set spawnsay vstr spawnsay4; vstr spawnChosen"
set spawnp6r    "setspawnpt 8; set spawnsay vstr spawnsay4; vstr spawnChosen"

set spawnp0b    "setspawnpt 0; set spawnsay vstr spawnsay0; vstr spawnChosen"
set spawnp1b    "setspawnpt 1; set spawnsay vstr spawnsay5; vstr spawnChosen"
set spawnp2b    "setspawnpt 2; set spawnsay vstr spawnsay5; vstr spawnChosen"
set spawnp3b    "setspawnpt 3; set spawnsay vstr spawnsay6; vstr spawnChosen"
set spawnp4b    "setspawnpt 5; set spawnsay vstr spawnsay7; vstr spawnChosen"
set spawnp5b    "setspawnpt 6; set spawnsay vstr spawnsay8; vstr spawnChosen"
set spawnp6b    "setspawnpt 7; set spawnsay vstr spawnsay3; vstr spawnChosen"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r; vstr echosp2r; vstr echosp3r; vstr echosp4r; vstr echosp5r; vstr echosp6r"
set echosp0r    "echo ^31. ^7Default Spawn"
set echosp1r    "echo ^32. ^iAxis 2"
set echosp2r    "echo ^33. ^iAxis 3 - Airfield Tower"
set echosp3r    "echo ^34. ^iAxis 3 - Airfield Spawn"
set echosp4r    "echo ^35. ^iAllied 2"
set echosp5r    "echo ^36. ^iAxis 1 - Axis Forward Town Spawn (north)"
set echosp6r    "echo ^37. ^iAxis 1 - Axis Forward Town Spawn (south)"
// not selectable while the rooms above are active: Axis 1 - Werfen Village; Axis 2 - Castle Front Yard Roofs; Axis 3 - Airfield Corridor Access; Axis 2 - Castle Spawn

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b; vstr echosp1b; vstr echosp2b; vstr echosp3b; vstr echosp4b; vstr echosp5b; vstr echosp6b"
set echosp0b    "echo ^31. ^7Default Spawn"
set echosp1b    "echo ^32. ^dAllied 3 - Castle Cellars"
set echosp2b    "echo ^33. ^dAllied 3 - Castle Tram Station"
set echosp3b    "echo ^34. ^dAllied 5"
set echosp4b    "echo ^35. ^dAllied 4"
set echosp5b    "echo ^36. ^dAllied 1"
set echosp6b    "echo ^37. ^dAllied 2"
// not selectable while the rooms above are active: Allied 1 - Hill Spawn; Allied 1 - Hill House; Allied 2 - Town Tram Station; Allied 5 - Fuel Spawn; Allied 5 - Krankenhaus; Allied 3 - Castle Tram Station; Allied 3 - Bus Garage; Allied 1 - Hills; Allied 2 - Werfen Village; Allied 4 - Bus Garage Guard Post; Allied 5 - Near the Krankenhaus

// Announce spawnpoints
set spawnsay0   "vstr playFilter; say_teamnl ^9I will spawn at ^xDefault Spawn"
set spawnsay1   "vstr playFilter; say_teamnl ^9I will spawn at ^xAxis 2"
set spawnsay2   "vstr playFilter; say_teamnl ^9I will spawn at ^xAxis 3"
set spawnsay3   "vstr playFilter; say_teamnl ^9I will spawn at ^xAllied 2"
set spawnsay4   "vstr playFilter; say_teamnl ^9I will spawn at ^xAxis 1"
set spawnsay5   "vstr playFilter; say_teamnl ^9I will spawn at ^xAllied 3"
set spawnsay6   "vstr playFilter; say_teamnl ^9I will spawn at ^xAllied 5"
set spawnsay7   "vstr playFilter; say_teamnl ^9I will spawn at ^xAllied 4"
set spawnsay8   "vstr playFilter; say_teamnl ^9I will spawn at ^xAllied 1"

echo ^5>>> AUTOEXEC_MAP LOADED!

// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
// - spawnpsr/-psb bind only this map's keys: spawnpoints left over from the previous map are on no key
set spawnpsr    "vstr echospr; bind 1 vstr spawnp0r; bind 2 vstr spawnp1r; bind 3 vstr spawnp2r"
set spawnpsb    "vstr echospb; bind 1 vstr spawnp0b; bind 2 vstr spawnp1b; bind 3 vstr spawnp2b; bind 4 vstr spawnp3b"

set spawnp0r     "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect; vstr spawnReport"
set spawnp1r     "setspawnpt 3; vstr resetSpawnSelector; set spawnsay vstr spawnsay3; vstr playSelect; vstr spawnReport"
set spawnp2r     "setspawnpt 5; vstr resetSpawnSelector; set spawnsay vstr spawnsay5; vstr playSelect; vstr spawnReport"

set spawnp0b     "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect; vstr spawnReport"
set spawnp1b     "setspawnpt 1; vstr resetSpawnSelector; set spawnsay vstr spawnsay1; vstr playSelect; vstr spawnReport"
set spawnp2b     "setspawnpt 2; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect; vstr spawnReport"
set spawnp3b     "setspawnpt 4; vstr resetSpawnSelector; set spawnsay vstr spawnsay4; vstr playSelect; vstr spawnReport"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r; vstr echosp2r;"
set echosp0r     "echo ^31. ^7Default Spawn"
set echosp1r     "echo ^32. ^iMine Spawn;"
set echosp2r     "echo ^33. ^iVillage Spawn;"

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b; vstr echosp1b; vstr echosp2b; vstr echosp3b;"
set echosp0b     "echo ^31. ^7Default Spawn"
set echosp1b     "echo ^32. ^dRoad Spawn"
set echosp2b     "echo ^33. ^dSouth Bunker Spawn"
set echosp3b     "echo ^34. ^dNorth Bunker Spawn"

// Announce spawnpoints
set spawnsay0    "vstr playFilter; say_teamnl ^9I will spawn at ^xDefault Spawn"
set spawnsay1    "vstr playFilter; say_teamnl ^9I will spawn at ^xRoad Spawn"
set spawnsay2    "vstr playFilter; say_teamnl ^9I will spawn at ^xSouth Bunker Spawn"
set spawnsay3    "vstr playFilter; say_teamnl ^9I will spawn at ^xMine Spawn"
set spawnsay4    "vstr playFilter; say_teamnl ^9I will spawn at ^xNorth Bunker Spawn"
set spawnsay5    "vstr playFilter; say_teamnl ^9I will spawn at ^xVillage Spawn"

echo ^5>>> AUTOEXEC_MAP LOADED!

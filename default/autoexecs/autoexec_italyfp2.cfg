// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
// - spawnpsr/-psb bind only this map's keys: spawnpoints left over from the previous map are on no key
set spawnpsr    "vstr echospr; bind 1 vstr spawnp0r; bind 2 vstr spawnp1r; bind 3 vstr spawnp2r; bind 4 vstr spawnp3r; bind 5 vstr spawnp4r"
set spawnpsb    "vstr echospb; bind 1 vstr spawnp0b; bind 2 vstr spawnp1b; bind 3 vstr spawnp2b; bind 4 vstr spawnp3b"

set spawnp0r    "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect; vstr spawnReport"
set spawnp1r    "setspawnpt 1; vstr resetSpawnSelector; set spawnsay vstr spawnsay1; vstr playSelect; vstr spawnReport"
set spawnp2r    "setspawnpt 2; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect; vstr spawnReport"
set spawnp3r    "setspawnpt 3; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect; vstr spawnReport"
set spawnp4r    "setspawnpt 5; vstr resetSpawnSelector; set spawnsay vstr spawnsay3; vstr playSelect; vstr spawnReport"

set spawnp0b    "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect; vstr spawnReport"
set spawnp1b    "setspawnpt 2; vstr resetSpawnSelector; set spawnsay vstr spawnsay4; vstr playSelect; vstr spawnReport"
set spawnp2b    "setspawnpt 4; vstr resetSpawnSelector; set spawnsay vstr spawnsay5; vstr playSelect; vstr spawnReport"
set spawnp3b    "setspawnpt 6; vstr resetSpawnSelector; set spawnsay vstr spawnsay6; vstr playSelect; vstr spawnReport"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r; vstr echosp2r; vstr echosp3r; vstr echosp4r"
set echosp0r    "echo ^31. ^7Default Spawn"
set echosp1r    "echo ^32. ^iAxis Spawn"
set echosp2r    "echo ^33. ^iAxis Forward Spawn - 417 -737 -186"
set echosp3r    "echo ^34. ^iAxis Forward Spawn - 914 -486 -186"
set echosp4r    "echo ^35. ^iAxis CP Spawn"
// not selectable while the rooms above are active: Axis Spawn - 1250 3111 32; Axis Spawn - 885 3200 32

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b; vstr echosp1b; vstr echosp2b; vstr echosp3b"
set echosp0b    "echo ^31. ^7Default Spawn"
set echosp1b    "echo ^32. ^dAllied Spawn"
set echosp2b    "echo ^33. ^dAllied Forward Spawn"
set echosp3b    "echo ^34. ^dAllied CP Spawn"
// not selectable while the rooms above are active: Allied Spawn - -878 -1883 -291; Allied Forward Spawn - 614 -720 -186; Allied Spawn - -927 -2696 -291

// Announce spawnpoints
set spawnsay0   "vstr playFilter; say_teamnl ^9I will spawn at ^xDefault Spawn"
set spawnsay1   "vstr playFilter; say_teamnl ^9I will spawn at ^xAxis Spawn"
set spawnsay2   "vstr playFilter; say_teamnl ^9I will spawn at ^xAxis Forward Spawn"
set spawnsay3   "vstr playFilter; say_teamnl ^9I will spawn at ^xAxis CP Spawn"
set spawnsay4   "vstr playFilter; say_teamnl ^9I will spawn at ^xAllied Spawn"
set spawnsay5   "vstr playFilter; say_teamnl ^9I will spawn at ^xAllied Forward Spawn"
set spawnsay6   "vstr playFilter; say_teamnl ^9I will spawn at ^xAllied CP Spawn"

echo ^5>>> AUTOEXEC_MAP LOADED!

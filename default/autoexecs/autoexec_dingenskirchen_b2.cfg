// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
// - spawnpsr/-psb bind only this map's keys: spawnpoints left over from the previous map are on no key
set spawnpsr    "vstr echospr; bind 1 vstr spawnp0r; bind 2 vstr spawnp1r; bind 3 vstr spawnp2r; bind 4 vstr spawnp3r; bind 5 vstr spawnp4r"
set spawnpsb    "vstr echospb; bind 1 vstr spawnp0b; bind 2 vstr spawnp1b; bind 3 vstr spawnp2b; bind 4 vstr spawnp3b; bind 5 vstr spawnp4b; bind 6 vstr spawnp5b; bind 7 vstr spawnp6b; bind 8 vstr spawnp7b"

set spawnp0r    "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect; vstr spawnReport"
set spawnp1r    "setspawnpt 3; vstr resetSpawnSelector; set spawnsay vstr spawnsay1; vstr playSelect; vstr spawnReport"
set spawnp2r    "setspawnpt 4; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect; vstr spawnReport"
set spawnp3r    "setspawnpt 5; vstr resetSpawnSelector; set spawnsay vstr spawnsay3; vstr playSelect; vstr spawnReport"
set spawnp4r    "setspawnpt 7; vstr resetSpawnSelector; set spawnsay vstr spawnsay4; vstr playSelect; vstr spawnReport"

set spawnp0b    "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect; vstr spawnReport"
set spawnp1b    "setspawnpt 1; vstr resetSpawnSelector; set spawnsay vstr spawnsay5; vstr playSelect; vstr spawnReport"
set spawnp2b    "setspawnpt 4; vstr resetSpawnSelector; set spawnsay vstr spawnsay5; vstr playSelect; vstr spawnReport"
set spawnp3b    "setspawnpt 2; vstr resetSpawnSelector; set spawnsay vstr spawnsay6; vstr playSelect; vstr spawnReport"
set spawnp4b    "setspawnpt 3; vstr resetSpawnSelector; set spawnsay vstr spawnsay1; vstr playSelect; vstr spawnReport"
set spawnp5b    "setspawnpt 5; vstr resetSpawnSelector; set spawnsay vstr spawnsay3; vstr playSelect; vstr spawnReport"
set spawnp6b    "setspawnpt 6; vstr resetSpawnSelector; set spawnsay vstr spawnsay7; vstr playSelect; vstr spawnReport"
set spawnp7b    "setspawnpt 7; vstr resetSpawnSelector; set spawnsay vstr spawnsay4; vstr playSelect; vstr spawnReport"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r; vstr echosp2r; vstr echosp3r; vstr echosp4r"
set echosp0r    "echo ^31. ^7Default Spawn"
set echosp1r    "echo ^32. ^iVillage"
set echosp2r    "echo ^33. ^iCastle"
set echosp3r    "echo ^34. ^iCastle Hill"
set echosp4r    "echo ^35. ^iRoad Hut"
// not selectable while the rooms above are active: Village - Tavern; Road Hut - Main Road; Road Hut - River Cabinet House

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b; vstr echosp1b; vstr echosp2b; vstr echosp3b; vstr echosp4b; vstr echosp5b; vstr echosp6b; vstr echosp7b"
set echosp0b    "echo ^31. ^7Default Spawn"
set echosp1b    "echo ^32. ^dWestern Lake - Western Lake Hut (upper)"
set echosp2b    "echo ^33. ^dWestern Lake - Western Lake Hut (lower)"
set echosp3b    "echo ^34. ^dEastern Lake"
set echosp4b    "echo ^35. ^dVillage"
set echosp5b    "echo ^36. ^dCastle Hill"
set echosp6b    "echo ^37. ^dCommand Post"
set echosp7b    "echo ^38. ^dRoad Hut"
// not selectable while the rooms above are active: Eastern Lake - Lake Boathouse; Village - Tavern; Road Hut - Main Road; Road Hut - River Cabinet House

// Announce spawnpoints
set spawnsay0   "vstr playFilter; say_teamnl ^9I will spawn at ^xDefault Spawn"
set spawnsay1   "vstr playFilter; say_teamnl ^9I will spawn at ^xVillage"
set spawnsay2   "vstr playFilter; say_teamnl ^9I will spawn at ^xCastle"
set spawnsay3   "vstr playFilter; say_teamnl ^9I will spawn at ^xCastle Hill"
set spawnsay4   "vstr playFilter; say_teamnl ^9I will spawn at ^xRoad Hut"
set spawnsay5   "vstr playFilter; say_teamnl ^9I will spawn at ^xWestern Lake"
set spawnsay6   "vstr playFilter; say_teamnl ^9I will spawn at ^xEastern Lake"
set spawnsay7   "vstr playFilter; say_teamnl ^9I will spawn at ^xCommand Post"

echo ^5>>> AUTOEXEC_MAP LOADED!

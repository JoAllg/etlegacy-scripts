///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
// - spawnpsr/-psb bind only this map's keys: spawnpoints left over from the previous map are on no key
set spawnpsr    "vstr echospr; bind 1 vstr spawnp0r; bind 2 vstr spawnp1r; bind 3 vstr spawnp2r; bind 4 vstr spawnp3r; bind 5 vstr spawnp4r; bind 6 vstr spawnp5r; bind 7 vstr spawnp6r"
set spawnpsb    "vstr echospb; bind 1 vstr spawnp0b; bind 2 vstr spawnp1b; bind 3 vstr spawnp2b; bind 4 vstr spawnp3b; bind 5 vstr spawnp4b; bind 6 vstr spawnp5b"

set spawnp0r    "setspawnpt 0; set spawnsay vstr spawnsay0; vstr spawnChosen"
set spawnp1r    "setspawnpt 1; set spawnsay vstr spawnsay1; vstr spawnChosen"
set spawnp2r    "setspawnpt 6; set spawnsay vstr spawnsay1; vstr spawnChosen"
set spawnp3r    "setspawnpt 2; set spawnsay vstr spawnsay2; vstr spawnChosen"
set spawnp4r    "setspawnpt 3; set spawnsay vstr spawnsay3; vstr spawnChosen"
set spawnp5r    "setspawnpt 4; set spawnsay vstr spawnsay4; vstr spawnChosen"
set spawnp6r    "setspawnpt 5; set spawnsay vstr spawnsay5; vstr spawnChosen"

set spawnp0b    "setspawnpt 0; set spawnsay vstr spawnsay0; vstr spawnChosen"
set spawnp1b    "setspawnpt 1; set spawnsay vstr spawnsay1; vstr spawnChosen"
set spawnp2b    "setspawnpt 3; set spawnsay vstr spawnsay3; vstr spawnChosen"
set spawnp3b    "setspawnpt 4; set spawnsay vstr spawnsay4; vstr spawnChosen"
set spawnp4b    "setspawnpt 5; set spawnsay vstr spawnsay5; vstr spawnChosen"
set spawnp5b    "setspawnpt 6; set spawnsay vstr spawnsay6; vstr spawnChosen"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r; vstr echosp2r; vstr echosp3r; vstr echosp4r; vstr echosp5r; vstr echosp6r"
set echosp0r    "echo ^31. ^7Default Spawn"
set echosp1r    "echo ^32. ^iFortress Towers - Fortress Towers (south)"
set echosp2r    "echo ^33. ^iFortress Towers - Fortress Towers (north)"
set echosp3r    "echo ^34. ^iAxis Beach"
set echosp4r    "echo ^35. ^iPalace Garden"
set echosp5r    "echo ^36. ^iPalace Spawn"
set echosp6r    "echo ^37. ^iOld Village"
// not selectable while the rooms above are active: Fortress Towers - Fortress Towers

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b; vstr echosp1b; vstr echosp2b; vstr echosp3b; vstr echosp4b; vstr echosp5b"
set echosp0b    "echo ^31. ^7Default Spawn"
set echosp1b    "echo ^32. ^dFortress Towers"
set echosp2b    "echo ^33. ^dPalace Garden"
set echosp3b    "echo ^34. ^dPalace Spawn"
set echosp4b    "echo ^35. ^dOld Village"
set echosp5b    "echo ^36. ^dAllied Base"
// not selectable while the rooms above are active: Fortress Towers - Fortress Towers; Allied Base - Allied Base

// Announce spawnpoints
set spawnsay0   "vstr playFilter; say_teamnl ^9I will spawn at ^xDefault Spawn"
set spawnsay1   "vstr playFilter; say_teamnl ^9I will spawn at ^xFortress Towers"
set spawnsay2   "vstr playFilter; say_teamnl ^9I will spawn at ^xAxis Beach"
set spawnsay3   "vstr playFilter; say_teamnl ^9I will spawn at ^xPalace Garden"
set spawnsay4   "vstr playFilter; say_teamnl ^9I will spawn at ^xPalace Spawn"
set spawnsay5   "vstr playFilter; say_teamnl ^9I will spawn at ^xOld Village"
set spawnsay6   "vstr playFilter; say_teamnl ^9I will spawn at ^xAllied Base"

echo ^5>>> AUTOEXEC_MAP LOADED!

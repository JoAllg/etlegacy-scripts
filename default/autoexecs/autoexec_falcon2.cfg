// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
// - spawnpsr/-psb bind only this map's keys: spawnpoints left over from the previous map are on no key
set spawnpsr    "vstr echospr; bind 1 vstr spawnp0r; bind 2 vstr spawnp1r; bind 3 vstr spawnp2r; bind 4 vstr spawnp3r"
set spawnpsb    "vstr echospb; bind 1 vstr spawnp0b; bind 2 vstr spawnp1b; bind 3 vstr spawnp2b"

set spawnp0r    "setspawnpt 0; set spawnsay vstr spawnsay0; vstr spawnChosen"
set spawnp1r    "setspawnpt 1; set spawnsay vstr spawnsay1; vstr spawnChosen"
set spawnp2r    "setspawnpt 2; set spawnsay vstr spawnsay1; vstr spawnChosen"
set spawnp3r    "setspawnpt 3; set spawnsay vstr spawnsay1; vstr spawnChosen"

set spawnp0b    "setspawnpt 0; set spawnsay vstr spawnsay0; vstr spawnChosen"
set spawnp1b    "setspawnpt 2; set spawnsay vstr spawnsay2; vstr spawnChosen"
set spawnp2b    "setspawnpt 3; set spawnsay vstr spawnsay3; vstr spawnChosen"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r; vstr echosp2r; vstr echosp3r"
set echosp0r    "echo ^31. ^7Default Spawn"
set echosp1r    "echo ^32. ^iAxis HQ - -1288 6680 320"
set echosp2r    "echo ^33. ^iAxis HQ - -932 6682 216"
set echosp3r    "echo ^34. ^iAxis HQ - -1252 6404 216"
// not selectable while the rooms above are active: Axis HQ - -1020 7000 576

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b; vstr echosp1b; vstr echosp2b"
set echosp0b    "echo ^31. ^7Default Spawn"
set echosp1b    "echo ^32. ^dAllies HQ"
set echosp2b    "echo ^33. ^dAllied forward position"
// not selectable while the rooms above are active: Allied forward position - 96 2928 -128

// Announce spawnpoints
set spawnsay0   "vstr playFilter; say_teamnl ^9I will spawn at ^xDefault Spawn"
set spawnsay1   "vstr playFilter; say_teamnl ^9I will spawn at ^xAxis HQ"
set spawnsay2   "vstr playFilter; say_teamnl ^9I will spawn at ^xAllies HQ"
set spawnsay3   "vstr playFilter; say_teamnl ^9I will spawn at ^xAllied forward position"

echo ^5>>> AUTOEXEC_MAP LOADED!

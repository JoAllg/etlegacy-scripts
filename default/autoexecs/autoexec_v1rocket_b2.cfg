// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
// - spawnpsr/-psb bind only this map's keys: spawnpoints left over from the previous map are on no key
set spawnpsr    "vstr echospr; bind 1 vstr spawnp0r; bind 2 vstr spawnp1r; bind 3 vstr spawnp2r; bind 4 vstr spawnp3r; bind 5 vstr spawnp4r"
set spawnpsb    "vstr echospb; bind 1 vstr spawnp0b; bind 2 vstr spawnp1b; bind 3 vstr spawnp2b; bind 4 vstr spawnp3b"

set spawnp0r     "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect; vstr spawnReport"
set spawnp1r     "setspawnpt 2; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect; vstr spawnReport"
set spawnp2r     "setspawnpt 3; vstr resetSpawnSelector; set spawnsay vstr spawnsay3; vstr playSelect; vstr spawnReport"
set spawnp3r     "setspawnpt 4; vstr resetSpawnSelector; set spawnsay vstr spawnsay4; vstr playSelect; vstr spawnReport"
set spawnp4r     "setspawnpt 5; vstr resetSpawnSelector; set spawnsay vstr spawnsay5; vstr playSelect; vstr spawnReport"

set spawnp0b     "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect; vstr spawnReport"
set spawnp1b     "setspawnpt 1; vstr resetSpawnSelector; set spawnsay vstr spawnsay1; vstr playSelect; vstr spawnReport"
set spawnp2b     "setspawnpt 2; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect; vstr spawnReport"
set spawnp3b     "setspawnpt 3; vstr resetSpawnSelector; set spawnsay vstr spawnsay3; vstr playSelect; vstr spawnReport"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r; vstr echosp2r; vstr echosp3r; vstr echosp4r;"
set echosp0r     "echo ^31. ^7Default Spawn"
set echosp1r     "echo ^32. ^iMain Entrance;"
set echosp2r     "echo ^33. ^iDepot Yard;"
set echosp3r     "echo ^34. ^iRadar 1"
set echosp4r     "echo ^35. ^iRadar 2"

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b; vstr echosp1b; vstr echosp2b; vstr echosp3b;"
set echosp0b     "echo ^31. ^7Default Spawn"
set echosp1b     "echo ^32. ^dAllied Entrance"
set echosp2b     "echo ^33. ^dMain Entrance"
set echosp3b     "echo ^34. ^dDepot Yard"

// Announce spawnpoints
set spawnsay0    "vstr playFilter; say_teamnl ^5will spawn at ^0Default Spawn"
set spawnsay1    "vstr playFilter; say_teamnl ^5will spawn at ^wAllied Entrance"
set spawnsay2    "vstr playFilter; say_teamnl ^5will spawn at ^wMain Entrance"
set spawnsay3    "vstr playFilter; say_teamnl ^5will spawn at ^wDepot Yard"
set spawnsay4    "vstr playFilter; say_teamnl ^5will spawn at ^wRadar 1"
set spawnsay5    "vstr playFilter; say_teamnl ^5will spawn at ^wRadar 2"

echo ^5>>> AUTOEXEC_MAP LOADED!

set spawnp0r    "setspawnpt 0; set spawnsay vstr spawnsay0; vstr spawnChosen"
set spawnp1r    "setspawnpt 1; set spawnsay vstr spawnsay1; vstr spawnChosen"
set spawnp2r    "setspawnpt 2; set spawnsay vstr spawnsay1; vstr spawnChosen"
set spawnp3r    "setspawnpt 3; set spawnsay vstr spawnsay2; vstr spawnChosen"
set spawnp4r    "setspawnpt 4; set spawnsay vstr spawnsay3; vstr spawnChosen"
set spawnp5r    "setspawnpt 5; set spawnsay vstr spawnsay4; vstr spawnChosen"
set spawnp6r    "setspawnpt 9; set spawnsay vstr spawnsay5; vstr spawnChosen"

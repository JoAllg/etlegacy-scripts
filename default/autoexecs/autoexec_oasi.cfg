// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
exec profile/scripts/spawn/generic_spawnpoints.cfg  // generic list first, so the previous map's spawnpoints are gone
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
set spawnp0r    "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect;"
set spawnp1r    "setspawnpt 1; vstr resetSpawnSelector; set spawnsay vstr spawnsay1; vstr playSelect;"
set spawnp2r    "setspawnpt 2; vstr resetSpawnSelector; set spawnsay vstr spawnsay1; vstr playSelect;"
set spawnp3r    "setspawnpt 3; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect;"
set spawnp4r    "setspawnpt 4; vstr resetSpawnSelector; set spawnsay vstr spawnsay3; vstr playSelect;"
set spawnp5r    "setspawnpt 5; vstr resetSpawnSelector; set spawnsay vstr spawnsay4; vstr playSelect;"
set spawnp6r    "setspawnpt 9; vstr resetSpawnSelector; set spawnsay vstr spawnsay5; vstr playSelect;"
set spawnp7r    "setspawnpt 11; vstr resetSpawnSelector; set spawnsay vstr spawnsay6; vstr playSelect;"

set spawnp0b    "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect;"
set spawnp1b    "setspawnpt 1; vstr resetSpawnSelector; set spawnsay vstr spawnsay7; vstr playSelect;"
set spawnp2b    "setspawnpt 5; vstr resetSpawnSelector; set spawnsay vstr spawnsay7; vstr playSelect;"
set spawnp3b    "setspawnpt 3; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect;"
set spawnp4b    "setspawnpt 4; vstr resetSpawnSelector; set spawnsay vstr spawnsay3; vstr playSelect;"
set spawnp5b    "setspawnpt 6; vstr resetSpawnSelector; set spawnsay vstr spawnsay1; vstr playSelect;"
set spawnp6b    "setspawnpt 10; vstr resetSpawnSelector; set spawnsay vstr spawnsay6; vstr playSelect;"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r; vstr echosp2r; vstr echosp3r; vstr echosp4r; vstr echosp5r; vstr echosp6r; vstr echosp7r"
set echosp0r    "echo ^31. ^7Default Spawn"
set echosp1r    "echo ^32. ^iOld City Spawn - Bedroom"
set echosp2r    "echo ^33. ^iOld City Spawn - Old City Spawn"
set echosp3r    "echo ^34. ^iGarage Spawn"
set echosp4r    "echo ^35. ^iCave Spawn"
set echosp5r    "echo ^36. ^iTemple Spawn"
set echosp6r    "echo ^37. ^iTemple Spawn Front"
set echosp7r    "echo ^38. ^iCity Spawn"
// not selectable while the rooms above are active: Old City Spawn - Old City Spawn; Temple Spawn - Temple Spawn

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b; vstr echosp1b; vstr echosp2b; vstr echosp3b; vstr echosp4b; vstr echosp5b; vstr echosp6b"
set echosp0b    "echo ^31. ^7Default Spawn"
set echosp1b    "echo ^32. ^dAllied Base - Allied Base (upper)"
set echosp2b    "echo ^33. ^dAllied Base - Allied Base (lower)"
set echosp3b    "echo ^34. ^dGarage Spawn"
set echosp4b    "echo ^35. ^dCave Spawn"
set echosp5b    "echo ^36. ^dOld City Spawn"
set echosp6b    "echo ^37. ^dCity Spawn"
// not selectable while the rooms above are active: Allied Base - Allied Base; Old City Spawn - Bedroom

// Announce spawnpoints
set spawnsay0   "vstr playFilter; say_teamnl ^5will spawn at ^0Default Spawn"
set spawnsay1   "vstr playFilter; say_teamnl ^5will spawn at ^wOld City Spawn"
set spawnsay2   "vstr playFilter; say_teamnl ^5will spawn at ^wGarage Spawn"
set spawnsay3   "vstr playFilter; say_teamnl ^5will spawn at ^wCave Spawn"
set spawnsay4   "vstr playFilter; say_teamnl ^5will spawn at ^wTemple Spawn"
set spawnsay5   "vstr playFilter; say_teamnl ^5will spawn at ^wTemple Spawn Front"
set spawnsay6   "vstr playFilter; say_teamnl ^5will spawn at ^wCity Spawn"
set spawnsay7   "vstr playFilter; say_teamnl ^5will spawn at ^wAllied Base"


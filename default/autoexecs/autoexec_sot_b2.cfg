// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
// - spawnpsr/-psb bind only this map's keys: spawnpoints left over from the previous map are on no key
set spawnpsr    "vstr echospr; bind 1 vstr spawnp0r; bind 2 vstr spawnp1r; bind 3 vstr spawnp2r; bind 4 vstr spawnp3r"
set spawnpsb    "vstr echospb; bind 1 vstr spawnp0b; bind 2 vstr spawnp1b; bind 3 vstr spawnp2b; bind 4 vstr spawnp3b; bind 5 vstr spawnp4b"

set spawnp0r    "setspawnpt 0; set spawnsay vstr spawnsay0; vstr spawnChosen"
set spawnp1r    "setspawnpt 1; set spawnsay vstr spawnsay1; vstr spawnChosen"
set spawnp2r    "setspawnpt 3; set spawnsay vstr spawnsay1; vstr spawnChosen"
set spawnp3r    "setspawnpt 2; set spawnsay vstr spawnsay2; vstr spawnChosen"

set spawnp0b    "setspawnpt 0; set spawnsay vstr spawnsay0; vstr spawnChosen"
set spawnp1b    "setspawnpt 1; set spawnsay vstr spawnsay1; vstr spawnChosen"
set spawnp2b    "setspawnpt 2; set spawnsay vstr spawnsay1; vstr spawnChosen"
set spawnp3b    "setspawnpt 3; set spawnsay vstr spawnsay3; vstr spawnChosen"
set spawnp4b    "setspawnpt 4; set spawnsay vstr spawnsay4; vstr spawnChosen"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r; vstr echosp2r; vstr echosp3r"
set echosp0r    "echo ^31. ^7Default Spawn"
set echosp1r    "echo ^32. ^iForward Spawn - -356 -964 425"
set echosp2r    "echo ^33. ^iForward Spawn - 393 -1106 442"
set echosp3r    "echo ^34. ^iRuin Spawn"
// not selectable while the rooms above are active: Forward Spawn - -281 -1536 442; Forward Spawn - -1430 -1345 425; Forward Spawn - -1632 -2075 425; Forward Spawn - -1106 -2174 425; Forward Spawn - 273 -1747 441

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b; vstr echosp1b; vstr echosp2b; vstr echosp3b; vstr echosp4b"
set echosp0b    "echo ^31. ^7Default Spawn"
set echosp1b    "echo ^32. ^dForward Spawn - -356 -960 429"
set echosp2b    "echo ^33. ^dForward Spawn - 273 -1746 445"
set echosp3b    "echo ^34. ^dTemple Spawn"
set echosp4b    "echo ^35. ^dBasement Temple Spawn"
// not selectable while the rooms above are active: Forward Spawn - -1430 -1341 429; Forward Spawn - -277 -1532 446; Forward Spawn - -1630 -2071 429; Forward Spawn - 395 -1102 446; Forward Spawn - -1098 -2170 429

// Announce spawnpoints
set spawnsay0   "vstr playFilter; say_teamnl ^9I will spawn at ^xDefault Spawn"
set spawnsay1   "vstr playFilter; say_teamnl ^9I will spawn at ^xForward Spawn"
set spawnsay2   "vstr playFilter; say_teamnl ^9I will spawn at ^xRuin Spawn"
set spawnsay3   "vstr playFilter; say_teamnl ^9I will spawn at ^xTemple Spawn"
set spawnsay4   "vstr playFilter; say_teamnl ^9I will spawn at ^xBasement Temple Spawn"

echo ^5>>> AUTOEXEC_MAP LOADED!

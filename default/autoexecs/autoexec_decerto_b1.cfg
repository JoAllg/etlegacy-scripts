// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
exec profile/scripts/spawn/generic_spawnpoints.cfg  // generic list first, so the previous map's spawnpoints are gone
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
set spawnp0r     "setspawnpt 2; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect;"
set spawnp1r     "setspawnpt 4; vstr resetSpawnSelector; set spawnsay vstr spawnsay4; vstr playSelect;"

set spawnp0b     "setspawnpt 1; vstr resetSpawnSelector; set spawnsay vstr spawnsay1; vstr playSelect;"
set spawnp1b     "setspawnpt 3; vstr resetSpawnSelector; set spawnsay vstr spawnsay3; vstr playSelect;"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r;"
set echosp0r     "echo ^31. ^iArenas 1 and 2"
set echosp1r     "echo ^32. ^iArenas 3 and 4;"

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b; vstr echosp1b;"
set echosp0b     "echo ^31. ^dArenas 1 and 2"
set echosp1b     "echo ^32. ^dArenas 3 and 4"

// Announce spawnpoints
set spawnsay0    "vstr playFilter; say_teamnl ^5will spawn at ^0Default Spawn"
set spawnsay1    "vstr playFilter; say_teamnl ^5will spawn at ^wArenas 1 and 2"
set spawnsay2    "vstr playFilter; say_teamnl ^5will spawn at ^wArenas 1 and 2"
set spawnsay3    "vstr playFilter; say_teamnl ^5will spawn at ^wArenas 3 and 4"
set spawnsay4    "vstr playFilter; say_teamnl ^5will spawn at ^wArenas 3 and 4"

echo ^5>>> AUTOEXEC_MAP LOADED!

// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
// - spawnpsr/-psb bind only this map's keys: spawnpoints left over from the previous map are on no key
set spawnpsr    "vstr echospr; bind 1 vstr spawnp0r"
set spawnpsb    "vstr echospb; bind 1 vstr spawnp0b"

set spawnp0r     "setspawnpt 2; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect; vstr spawnReport"

set spawnp0b     "setspawnpt 1; vstr resetSpawnSelector; set spawnsay vstr spawnsay1; vstr playSelect; vstr spawnReport"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r;"
set echosp0r     "echo ^31. ^iRed Flag"

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b;"
set echosp0b     "echo ^31. ^dBlue Flag"

// Announce spawnpoints
set spawnsay1    "vstr playFilter; say_teamnl ^9I will spawn at ^xBlue Flag"
set spawnsay2    "vstr playFilter; say_teamnl ^9I will spawn at ^xRed Flag"

echo ^5>>> AUTOEXEC_MAP LOADED!

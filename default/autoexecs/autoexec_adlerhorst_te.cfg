// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
// - spawnpsr/-psb bind only this map's keys: spawnpoints left over from the previous map are on no key
set spawnpsr    "vstr echospr; bind 1 vstr spawnp0r; bind 2 vstr spawnp1r; bind 3 vstr spawnp2r; bind 4 vstr spawnp3r; bind 5 vstr spawnp4r"
set spawnpsb    "vstr echospb; bind 1 vstr spawnp0b; bind 2 vstr spawnp1b; bind 3 vstr spawnp2b; bind 4 vstr spawnp3b"

set spawnp0r    "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect; vstr spawnReport"
set spawnp1r    "setspawnpt 1; vstr resetSpawnSelector; set spawnsay vstr spawnsay1; vstr playSelect; vstr spawnReport"
set spawnp2r    "setspawnpt 3; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect; vstr spawnReport"
set spawnp3r    "setspawnpt 4; vstr resetSpawnSelector; set spawnsay vstr spawnsay3; vstr playSelect; vstr spawnReport"
set spawnp4r    "setspawnpt 5; vstr resetSpawnSelector; set spawnsay vstr spawnsay4; vstr playSelect; vstr spawnReport"

set spawnp0b    "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect; vstr spawnReport"
set spawnp1b    "setspawnpt 2; vstr resetSpawnSelector; set spawnsay vstr spawnsay5; vstr playSelect; vstr spawnReport"
set spawnp2b    "setspawnpt 3; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect; vstr spawnReport"
set spawnp3b    "setspawnpt 4; vstr resetSpawnSelector; set spawnsay vstr spawnsay3; vstr playSelect; vstr spawnReport"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r; vstr echosp2r; vstr echosp3r; vstr echosp4r"
set echosp0r    "echo ^31. ^7Default Spawn"
set echosp1r    "echo ^32. ^iBarracks"
set echosp2r    "echo ^33. ^iHut"
set echosp3r    "echo ^34. ^iDestroyed Hut"
set echosp4r    "echo ^35. ^iStation"

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b; vstr echosp1b; vstr echosp2b; vstr echosp3b"
set echosp0b    "echo ^31. ^7Default Spawn"
set echosp1b    "echo ^32. ^dTunnel"
set echosp2b    "echo ^33. ^dHut"
set echosp3b    "echo ^34. ^dDestroyed Hut"
// not selectable while the rooms above are active: Hut - 3717 163 1326

// Announce spawnpoints
set spawnsay0   "vstr playFilter; say_teamnl ^5will spawn at ^0Default Spawn"
set spawnsay1   "vstr playFilter; say_teamnl ^5will spawn at ^wBarracks"
set spawnsay2   "vstr playFilter; say_teamnl ^5will spawn at ^wHut"
set spawnsay3   "vstr playFilter; say_teamnl ^5will spawn at ^wDestroyed Hut"
set spawnsay4   "vstr playFilter; say_teamnl ^5will spawn at ^wStation"
set spawnsay5   "vstr playFilter; say_teamnl ^5will spawn at ^wTunnel"

echo ^5>>> AUTOEXEC_MAP LOADED!

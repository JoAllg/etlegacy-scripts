// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
// - spawnpsr/-psb bind only this map's keys: spawnpoints left over from the previous map are on no key
set spawnpsr    "vstr echospr; bind 1 vstr spawnp0r"
set spawnpsb    "vstr echospb; bind 1 vstr spawnp0b; bind 2 vstr spawnp1b; bind 3 vstr spawnp2b; bind 4 vstr spawnp3b; bind 5 vstr spawnp4b; bind 6 vstr spawnp5b; bind 7 vstr spawnp6b; bind 8 vstr spawnp7b; bind 9 vstr spawnp8b; bind 0 vstr spawnp9b; bind US_MINUS vstr spawnp10b; bind US_EQUALS vstr spawnp11b"

set spawnp0r     "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect;"

set spawnp0b     "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect;"
set spawnp1b     "setspawnpt 2; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect;"
set spawnp2b     "setspawnpt 1; vstr resetSpawnSelector; set spawnsay vstr spawnsay1; vstr playSelect;"
set spawnp3b     "setspawnpt 3; vstr resetSpawnSelector; set spawnsay vstr spawnsay3; vstr playSelect;"
set spawnp4b     "setspawnpt 4; vstr resetSpawnSelector; set spawnsay vstr spawnsay4; vstr playSelect;"
set spawnp5b     "setspawnpt 5; vstr resetSpawnSelector; set spawnsay vstr spawnsay5; vstr playSelect;"
set spawnp6b     "setspawnpt 6; vstr resetSpawnSelector; set spawnsay vstr spawnsay6; vstr playSelect;"
set spawnp7b     "setspawnpt 7; vstr resetSpawnSelector; set spawnsay vstr spawnsay7; vstr playSelect;"
set spawnp8b     "setspawnpt 8; vstr resetSpawnSelector; set spawnsay vstr spawnsay8; vstr playSelect;"
set spawnp9b     "setspawnpt 9; vstr resetSpawnSelector; set spawnsay vstr spawnsay9; vstr playSelect;"
set spawnp10b	"setspawnpt 10; vstr resetSpawnSelector; set spawnsay vstr spawnsay10; vstr playSelect;"
set spawnp11b    "setspawnpt 11; vstr resetSpawnSelector; set spawnsay vstr spawnsay11; vstr playSelect;"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r;"
set echosp0r     "echo ^31. ^7Default Spawn"

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b; vstr echosp1b; vstr echosp2b; vstr echosp3b; vstr echosp4b; vstr echosp5b; vstr echosp6b; vstr echosp7b; vstr echosp8b; vstr echosp9b; vstr echosp10b; vstr echosp11b;"
set echosp0b     "echo ^31. ^7Default Spawn"
set echosp1b     "echo ^32. ^dFlag 1"
set echosp2b     "echo ^33. ^dFlag 2"
set echosp3b     "echo ^34. ^dFlag 3"
set echosp4b     "echo ^35. ^dFlag 4"
set echosp5b     "echo ^36. ^dFlag 5"
set echosp6b     "echo ^37. ^dFlag 6"
set echosp7b     "echo ^38. ^dFlag 7"
set echosp8b     "echo ^39. ^dFlag 8"
set echosp9b     "echo ^310. ^dFlag 9"
set echosp10b    "echo ^311. ^dFlag 10"
set echosp11b    "echo ^312. ^dFlag 11"

// Announce spawnpoints
set spawnsay0    "vstr playFilter; say_teamnl ^5will spawn at ^0Default Spawn"
set spawnsay1    "vstr playFilter; say_teamnl ^5will spawn at ^wFlag 2"
set spawnsay2    "vstr playFilter; say_teamnl ^5will spawn at ^wFlag 1"
set spawnsay3    "vstr playFilter; say_teamnl ^5will spawn at ^wFlag 3"
set spawnsay4    "vstr playFilter; say_teamnl ^5will spawn at ^wFlag 4"
set spawnsay5    "vstr playFilter; say_teamnl ^5will spawn at ^wFlag 5"
set spawnsay6    "vstr playFilter; say_teamnl ^5will spawn at ^wFlag 6"
set spawnsay7    "vstr playFilter; say_teamnl ^5will spawn at ^wFlag 7"
set spawnsay8    "vstr playFilter; say_teamnl ^5will spawn at ^wFlag 8"
set spawnsay9    "vstr playFilter; say_teamnl ^5will spawn at ^wFlag 9"
set spawnsay10   "vstr playFilter; say_teamnl ^5will spawn at ^wFlag 10"
set spawnsay11   "vstr playFilter; say_teamnl ^5will spawn at ^wFlag 11"

echo ^5>>> AUTOEXEC_MAP LOADED!

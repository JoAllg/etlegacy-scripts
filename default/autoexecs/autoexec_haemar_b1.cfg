// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
// - spawnpsr/-psb bind only this map's keys: spawnpoints left over from the previous map are on no key
set spawnpsr    "vstr echospr; bind 1 vstr spawnp0r; bind 2 vstr spawnp1r; bind 3 vstr spawnp2r; bind 4 vstr spawnp3r; bind 5 vstr spawnp4r"
set spawnpsb    "vstr echospb; bind 1 vstr spawnp0b; bind 2 vstr spawnp1b; bind 3 vstr spawnp2b"

set spawnp0r    "setspawnpt 0; set spawnsay vstr spawnsay0; vstr spawnChosen"
set spawnp1r    "setspawnpt 2; set spawnsay vstr spawnsay1; vstr spawnChosen"
set spawnp2r    "setspawnpt 4; set spawnsay vstr spawnsay2; vstr spawnChosen"
set spawnp3r    "setspawnpt 5; set spawnsay vstr spawnsay3; vstr spawnChosen"
set spawnp4r    "setspawnpt 6; set spawnsay vstr spawnsay4; vstr spawnChosen"

set spawnp0b    "setspawnpt 0; set spawnsay vstr spawnsay0; vstr spawnChosen"
set spawnp1b    "setspawnpt 1; set spawnsay vstr spawnsay5; vstr spawnChosen"
set spawnp2b    "setspawnpt 3; set spawnsay vstr spawnsay6; vstr spawnChosen"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r; vstr echosp2r; vstr echosp3r; vstr echosp4r"
set echosp0r    "echo ^31. ^7Default Spawn"
set echosp1r    "echo ^32. ^ithe Backyard Down-Floor"
set echosp2r    "echo ^33. ^ithe Cave Spawn"
set echosp3r    "echo ^34. ^ithe City Flag Spawn"
set echosp4r    "echo ^35. ^ithe Forward Spawn"
// not selectable while the rooms above are active: the Backyard Down-Floor - -4952 -1928 604

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b; vstr echosp1b; vstr echosp2b"
set echosp0b    "echo ^31. ^7Default Spawn"
set echosp1b    "echo ^32. ^dthe City Flag"
set echosp2b    "echo ^33. ^dthe Allied Hideout"

// Announce spawnpoints
set spawnsay0   "vstr playFilter; say_teamnl ^9I will spawn at ^xDefault Spawn"
set spawnsay1   "vstr playFilter; say_teamnl ^9I will spawn at ^xthe Backyard Down-Floor"
set spawnsay2   "vstr playFilter; say_teamnl ^9I will spawn at ^xthe Cave Spawn"
set spawnsay3   "vstr playFilter; say_teamnl ^9I will spawn at ^xthe City Flag Spawn"
set spawnsay4   "vstr playFilter; say_teamnl ^9I will spawn at ^xthe Forward Spawn"
set spawnsay5   "vstr playFilter; say_teamnl ^9I will spawn at ^xthe City Flag"
set spawnsay6   "vstr playFilter; say_teamnl ^9I will spawn at ^xthe Allied Hideout"

echo ^5>>> AUTOEXEC_MAP LOADED!

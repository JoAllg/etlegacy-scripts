// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
// - spawnpsr/-psb bind only this map's keys: spawnpoints left over from the previous map are on no key
set spawnpsr    "vstr echospr; bind 1 vstr spawnp0r; bind 2 vstr spawnp1r; bind 3 vstr spawnp2r; bind 4 vstr spawnp3r; bind 5 vstr spawnp4r"
set spawnpsb    "vstr echospb; bind 1 vstr spawnp0b; bind 2 vstr spawnp1b; bind 3 vstr spawnp2b; bind 4 vstr spawnp3b; bind 5 vstr spawnp4b"

set spawnp0r     "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect;"
set spawnp1r     "setspawnpt 5; vstr resetSpawnSelector; set spawnsay vstr spawnsay5; vstr playSelect;"
set spawnp2r     "setspawnpt 2; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect;"
set spawnp3r     "setspawnpt 3; vstr resetSpawnSelector; set spawnsay vstr spawnsay3; vstr playSelect;"
set spawnp4r     "setspawnpt 4; vstr resetSpawnSelector; set spawnsay vstr spawnsay4; vstr playSelect;"

set spawnp0b     "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect;"
set spawnp1b     "setspawnpt 4; vstr resetSpawnSelector; set spawnsay vstr spawnsay4; vstr playSelect;"
set spawnp2b     "setspawnpt 1; vstr resetSpawnSelector; set spawnsay vstr spawnsay1; vstr playSelect;"
set spawnp3b     "setspawnpt 5; vstr resetSpawnSelector; set spawnsay vstr spawnsay5; vstr playSelect;"
set spawnp4b     "setspawnpt 3; vstr resetSpawnSelector; set spawnsay vstr spawnsay3; vstr playSelect;"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r; vstr echosp2r; vstr echosp3r; vstr echosp4r;"
set echosp0r     "echo ^31. ^7Default Spawn"
set echosp1r     "echo ^32. ^iNorth Tunnel;"
set echosp2r     "echo ^33. ^iThe Reservoir;"
set echosp3r     "echo ^34. ^iThe Boathouse"
set echosp4r     "echo ^35. ^iThe Mill Tunnel"

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b; vstr echosp1b; vstr echosp2b; vstr echosp3b; vstr echosp4b;"
set echosp0b     "echo ^31. ^7Default Spawn"
set echosp1b     "echo ^32. ^dThe Mill Tunnel"
set echosp2b     "echo ^33. ^dThe Sawmill"
set echosp3b     "echo ^34. ^dNorth Tunnel"
set echosp4b     "echo ^35. ^dThe Boathouse"

// Announce spawnpoints
set spawnsay0    "vstr playFilter; say_teamnl ^5will spawn at ^0Default Spawn"
set spawnsay1    "vstr playFilter; say_teamnl ^5will spawn at ^wThe Sawmill"
set spawnsay2    "vstr playFilter; say_teamnl ^5will spawn at ^wThe Reservoir"
set spawnsay3    "vstr playFilter; say_teamnl ^5will spawn at ^wThe Boathouse"
set spawnsay4    "vstr playFilter; say_teamnl ^5will spawn at ^wThe Mill Tunnel"
set spawnsay5    "vstr playFilter; say_teamnl ^5will spawn at ^wNorth Tunnel"

echo ^5>>> AUTOEXEC_MAP LOADED!

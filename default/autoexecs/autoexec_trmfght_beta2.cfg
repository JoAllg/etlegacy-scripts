// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
// - spawnpsr/-psb bind only this map's keys: spawnpoints left over from the previous map are on no key
set spawnpsr    "vstr echospr; bind 1 vstr spawnp0r; bind 2 vstr spawnp1r; bind 3 vstr spawnp2r; bind 4 vstr spawnp3r"
set spawnpsb    "vstr echospb; bind 1 vstr spawnp0b; bind 2 vstr spawnp1b; bind 3 vstr spawnp2b; bind 4 vstr spawnp3b"

set spawnp0r    "setspawnpt 0; set spawnsay vstr spawnsay0; vstr spawnChosen"
set spawnp1r    "setspawnpt 2; set spawnsay vstr spawnsay1; vstr spawnChosen"
set spawnp2r    "setspawnpt 3; set spawnsay vstr spawnsay2; vstr spawnChosen"
set spawnp3r    "setspawnpt 5; set spawnsay vstr spawnsay3; vstr spawnChosen"

set spawnp0b    "setspawnpt 0; set spawnsay vstr spawnsay0; vstr spawnChosen"
set spawnp1b    "setspawnpt 1; set spawnsay vstr spawnsay4; vstr spawnChosen"
set spawnp2b    "setspawnpt 4; set spawnsay vstr spawnsay5; vstr spawnChosen"
set spawnp3b    "setspawnpt 5; set spawnsay vstr spawnsay3; vstr spawnChosen"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r; vstr echosp2r; vstr echosp3r"
set echosp0r    "echo ^31. ^7Default Spawn"
set echosp1r    "echo ^32. ^iaxis station1 spawn"
set echosp2r    "echo ^33. ^iaxis station2 spawn"
set echosp3r    "echo ^34. ^iCourt Yard"
// not selectable while the rooms above are active: axis station1 spawn - -3840 3706 820; axis station1 spawn - -4374 3716 808; Court Yard - -3418 -578 314

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b; vstr echosp1b; vstr echosp2b; vstr echosp3b"
set echosp0b    "echo ^31. ^7Default Spawn"
set echosp1b    "echo ^32. ^dallied station1 spawn"
set echosp2b    "echo ^33. ^dallied 2nd spawn"
set echosp3b    "echo ^34. ^dCourt Yard"
// not selectable while the rooms above are active: Court Yard - -4034 -466 332

// Announce spawnpoints
set spawnsay0   "vstr playFilter; say_teamnl ^9I will spawn at ^xDefault Spawn"
set spawnsay1   "vstr playFilter; say_teamnl ^9I will spawn at ^xaxis station1 spawn"
set spawnsay2   "vstr playFilter; say_teamnl ^9I will spawn at ^xaxis station2 spawn"
set spawnsay3   "vstr playFilter; say_teamnl ^9I will spawn at ^xCourt Yard"
set spawnsay4   "vstr playFilter; say_teamnl ^9I will spawn at ^xallied station1 spawn"
set spawnsay5   "vstr playFilter; say_teamnl ^9I will spawn at ^xallied 2nd spawn"

echo ^5>>> AUTOEXEC_MAP LOADED!

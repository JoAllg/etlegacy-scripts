// No spawnpoints here: silEnT runs autoexec_default.cfg after every autoexec_<map>.cfg,
// so the generic one (default/autoexecs/autoexec_default.cfg) would replace each map's spawnpoints with the generic list.
// Downside: maps without autoexec_<map>.cfg keep the previous map's spawnpoints.
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch; maps without autoexec_<map>.cfg run no other guard

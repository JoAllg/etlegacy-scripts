set r_so4 "vstr cs_soldier_mortar; team r 0 51 36; set cycleAxisSoldier vstr r_so5; vstr echo-r_so4; set classSay vstr say-r_so4"
set r_so5 "vstr cs_soldier_mg42; team r 0 57 36; set cycleAxisSoldier vstr r_so6; set classSay say_teamnl ^9Spawning as ^xSoldier ^9[^xVenom^9]; echo ^0[^nCLASS^0] ^nSoldier^1: ^nVenom"
set r_so6 "vstr cs_soldier_mg42; team r 0 59 36; set cycleAxisSoldier vstr r_so1; set classSay say_teamnl ^9Spawning as ^xSoldier ^9[^xStG44^9]; echo ^0[^nCLASS^0] ^nSoldier^1: ^nStG44"
set r_me2 "vstr cs_medic_smg; team r 1 59 36; set cycleAxisMedic vstr r_me1; set classSay say_teamnl ^9Spawning as ^xMedic ^9[^xStG44^9]; echo ^0[^nCLASS^0] ^nMedic^1: ^nStG44"

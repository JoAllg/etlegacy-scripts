//--[ CLASS COMMANDS (ETPS) ]--//
// Weapon IDs differ per mod, so they override the defaults from scripts/class/cs_classcommands.cfg
// etps is built on legacy 2.84 and keeps its IDs up to 55, so these are the legacy ones.
// Verified against src/game/bg_public.h (weapon_t enum) and src/game/bg_classes.c (bg_playerClasses, which
// weapon each team/class may pick). Legacy dropped etmain's WP_TRIPMINE (29) and WP_LOCKPICK (36) and appends
// its own weapons from 48 (Kabar, Browning, Mortar2, Bazooka, MP34), so IDs above 28 differ from etmain.
// Allies
set b_soldier_mg42 "team b 0 49 8"
set b_soldier_fthrower "team b 0 6 8"
set b_soldier_panzer "team b 0 53 8"
set b_soldier_mortar "team b 0 34 8"
set b_medic_smg "team b 1 8 35"
set b_engineer_smg "team b 2 8 35"
set b_engineer_rifle "team b 2 24 35"
set b_fieldops_smg "team b 3 8 35"
set b_covops_sten "team b 4 10 45"
set b_covops_fg42 "team b 4 32 45"
set b_covops_rifle "team b 4 25 45"
// Axis
set r_soldier_mg42 "team r 0 30 3"
set r_soldier_fthrower "team r 0 6 3"
set r_soldier_panzer "team r 0 5 3"
set r_soldier_mortar "team r 0 51 3"
set r_medic_smg "team r 1 3 36"
set r_engineer_smg "team r 2 3 36"
set r_engineer_rifle "team r 2 23 36"
set r_fieldops_smg "team r 3 3 36"
set r_covops_sten "team r 4 54 46"
set r_covops_fg42 "team r 4 32 46"
set r_covops_rifle "team r 4 31 46"


//--[ CLASS STEPS (ETPS) ]--//
// Weapons of etps (IDs from its cgame): 56 Shotgun, 57 Venom, 58 BAR, 59 StG44, 60 Johnson
// - Exec'd after scripts/class/cs_backend.cfg (definitions.cfg): the steps replace its cycle ends (b_so5, b_me2, b_en3, b_fo2, b_co4,
//   r_ alike) and chain further ones, the last step of a class points to its first. A mod switch re-execs the definitions, which
//   restores the general cycles
// - Soldier steps 1-4 are redefined with a pistol as second weapon: bank 3 holds two weapons here, an SMG would be a third
// Allies
set b_so1 "vstr cs_soldier_mg42; team b 0 49 35; set cycleAlliesSoldier vstr b_so2; vstr echo-b_so1; set classSay vstr say-b_so1"
set b_so2 "vstr cs_soldier_fthrower; team b 0 6 35; set cycleAlliesSoldier vstr b_so3; vstr echo-b_so2; set classSay vstr say-b_so2"
set b_so3 "vstr cs_soldier_panzer; team b 0 53 35; set cycleAlliesSoldier vstr b_so4; vstr echo-b_so3; set classSay vstr say-b_so3"
set b_so4 "vstr cs_soldier_mortar; team b 0 34 35; set cycleAlliesSoldier vstr b_so5; vstr echo-b_so4; set classSay vstr say-b_so4"
set b_so5 "vstr cs_soldier_mg42; team b 0 57 35; set cycleAlliesSoldier vstr b_so6; set classSay say_teamnl ^9Spawning as ^xSoldier ^9[^xVenom^9]; echo ^0[^nCLASS^0] ^nSoldier^1: ^nVenom"
set b_so6 "vstr cs_soldier_mg42; team b 0 58 35; set cycleAlliesSoldier vstr b_so1; set classSay say_teamnl ^9Spawning as ^xSoldier ^9[^xBAR^9]; echo ^0[^nCLASS^0] ^nSoldier^1: ^nBAR"
set b_me2 "vstr cs_medic_smg; team b 1 58 35; set cycleAlliesMedic vstr b_me1; set classSay say_teamnl ^9Spawning as ^xMedic ^9[^xBAR^9]; echo ^0[^nCLASS^0] ^nMedic^1: ^nBAR"
set b_en3 "vstr cs_engineer_smg; team b 2 58 35; set cycleAlliesEngineer vstr b_en4; set classSay say_teamnl ^9Spawning as ^xEngineer ^9[^xBAR^9]; echo ^0[^nCLASS^0] ^nEngineer^1: ^nBAR"
set b_en4 "vstr cs_engineer_smg; team b 2 56 35; set cycleAlliesEngineer vstr b_en1; set classSay say_teamnl ^9Spawning as ^xEngineer ^9[^xShotgun^9]; echo ^0[^nCLASS^0] ^nEngineer^1: ^nShotgun"
set b_fo2 "vstr cs_fieldops_smg; team b 3 58 35; set cycleAlliesFieldOps vstr b_fo3; set classSay say_teamnl ^9Spawning as ^xField Ops ^9[^xBAR^9]; echo ^0[^nCLASS^0] ^nField Ops^1: ^nBAR"
set b_fo3 "vstr cs_fieldops_smg; team b 3 56 35; set cycleAlliesFieldOps vstr b_fo1; set classSay say_teamnl ^9Spawning as ^xField Ops ^9[^xShotgun^9]; echo ^0[^nCLASS^0] ^nField Ops^1: ^nShotgun"
set b_co4 "vstr cs_covops_sten; team b 4 60 45; set cycleAlliesCovertOps vstr b_co5; set classSay say_teamnl ^9Spawning as ^xCovert Ops ^9[^xJohnson^9]; echo ^0[^nCLASS^0] ^nCovert Ops^1: ^nJohnson"
set b_co5 "vstr cs_covops_sten; team b 4 58 45; set cycleAlliesCovertOps vstr b_co1; set classSay say_teamnl ^9Spawning as ^xCovert Ops ^9[^xBAR^9]; echo ^0[^nCLASS^0] ^nCovert Ops^1: ^nBAR"
// Axis
set r_so1 "vstr cs_soldier_mg42; team r 0 30 36; set cycleAxisSoldier vstr r_so2; vstr echo-r_so1; set classSay vstr say-r_so1"
set r_so2 "vstr cs_soldier_fthrower; team r 0 6 36; set cycleAxisSoldier vstr r_so3; vstr echo-r_so2; set classSay vstr say-r_so2"

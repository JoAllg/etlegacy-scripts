set r_fo2 "vstr cs_fieldops_smg; team r 3 54 36; set cycleAxisFieldOps vstr r_fo3; set classSay say_teamnl ^9Spawning as ^xField Ops ^9[^xMP34^9]; echo ^0[^nCLASS^0] ^nField Ops^1: ^nMP34"
set r_fo3 "vstr cs_fieldops_smg; team r 3 56 36; set cycleAxisFieldOps vstr r_fo1; set classSay say_teamnl ^9Spawning as ^xField Ops ^9[^xShotgun^9]; echo ^0[^nCLASS^0] ^nField Ops^1: ^nShotgun"

// Weapalt definition
// Setting a alias like "set callWeapalt +attack2" and then doing "bind MOUSE2 vstr callWeapalt" does not work consistently!
// Start binds of MOUSE2/MWHEELDOWN: modState below, applied by profiles/<profile>/state.cfg (the weapon switch toggle and class scripts rebind them)
// etps fires the alternate weapon mode with +attack2: its cgame rebinds weapalt binds to +attack2 on start ("Migrated %i legacy weapalt bind%s to +attack2")
set bindMwheeldownWeapalt "bind MWHEELDOWN +attack2"
set bindMouse2Weapalt "bind MOUSE2 +attack2"
set modState "vstr bindMouse2Weapalt; vstr bindMwheeldownWeapalt"  // start binds of this mod, applied by the state pass


// Alias for fov change scripts
set fovLow "cg_fov 75" // Min FOV values: 75 in etlegacy and etps, 90 in nitmod

// Sniper FPS: legacy scales recoil by frame time (bg_pmove.c PM_HandleRecoil), low FPS gives slightly more recoil
set maxFpsLow "vstr maxFps"

set setTeamSpectator "team spectator" // Command to join spectator


// ECHO MENU POPUPS (voice chat, spawn menu; used by popupsMenu/popupsNormal in scripts/scripts.cfg)
// - editcomponent changes the active HUD in memory only (the HUD file stays, a HUD switch or vid_restart restores it); the only popup cvar is cg_numPopups
// - Clear: an item is removed once time + feedStayTime + feedFadeTime has passed, so both 0 wipe the popups in the next frame (kill messages too)
// - Lines: as many as fit into the height h, at most cg_numPopups (max 8; normal value numPopupsNormal, cvars.cfg). editcomponent sets the absolute
//   position (y = top edge) and lines are drawn upward from the bottom edge, so the menu keeps y + h of the normal values
// - The numbers here fit the built-in HUD (cg_draw_hud.c CG_setDefaultHudValues); deploy.sh redefines both aliases in user.cfg
//   with y, w, h and times of the HUD file (tools/helpers/hudvalues.py: only the numbers change, the commands are taken from here)
set popupmessagesNormal "editcomponent popupmessages y 245 w 422 h 96 feedStayTime 2000 feedFadeTime 2500"
// - Stay: 10 min, in effect until the menu is closed (popupsClose clears it); popups that arrive meanwhile stay as long
// - Width: lines longer than w wrap (cg_popupmessages.c CG_DrawPMItems), which would break the aligned server menu columns; 600 fits about 105 characters (estimated from the font scale, not measured)
set popupmessagesMenu "editcomponent popupmessages y 101 w 600 h 240 feedStayTime 600000 feedFadeTime 300"  // room for about 15 lines, cg_numPopups shows 8
set setPopupsMenu "editcomponent popupmessages feedStayTime 0 feedFadeTime 0; wait 2; cg_numPopups 8; vstr popupmessagesMenu"
set setPopupsNormal "editcomponent popupmessages feedStayTime 0 feedFadeTime 0; wait 2; vstr numPopupsNormal; vstr popupmessagesNormal"

// SERVER MENU: scripts/servermenu.cfg uses the pages of 7 servers (heading + 7 = 8 lines, the cg_numPopups maximum)


// Voicechat with shortcuts in the messages ([H], [P], ...; the etps server expands them), overwrites page openers of the general voicechat (scripts/vsays/chat.cfg)
exec profile/scripts/vsays/chat_shortcuts.cfg

echo "^5    *** ETPS MOD SETTINGS LOADED!"

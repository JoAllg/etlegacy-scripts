// Sniper FPS: keeps 71 from cvars.cfg, tested in game to reduce recoil on servers with pmove_fixed 0 and no g_fixedphysics (so none probably)

// Weapalt definition
// Setting a alias like "set callWeapalt +attack2" and then doing "bind MOUSE2 vstr callWeapalt" does not work consistently!
// Start binds of MOUSE2/MWHEELDOWN: modState below, applied by profiles/<profile>/state.cfg (the weapon switch toggle and class scripts rebind them)
// ALTERNATIVE WEAPALT BINDINGS
set bindMwheeldownWeapalt "bind MWHEELDOWN +attack2"
set bindMouse2Weapalt "bind MOUSE2 +attack2"
set modState "vstr bindMouse2Weapalt; vstr bindMwheeldownWeapalt"  // start binds of this mod, applied by the state pass


// Alias for fov change scripts
set fovLow "cg_fov 90" // Min FOV values: 75 in etlegacy, 90 in nitmod

set setTeamSpectator "team s" // Command to join spectator


// ECHO MENU POPUPS (voice chat, spawn menu; used by popupsMenu/popupsNormal in scripts/scripts.cfg)
// - Stay time is a fixed 1500 ms (cgame code), cg_popupFadeTime the fade after it. A fade of 10 min keeps a menu readable until it is closed
//   (popupsClose clears it); popups that arrive meanwhile stay as long. Not tested in game whether nitmod caps the fade time
// - Clear: an item is removed once time + 1500 + cg_popupFadeTime has passed, so -1500 wipes the popups in the next frame (kill messages too)
// - cg_numPopups is capped at 8
set setPopupsMenu "cg_popupFadeTime -1500; wait 2; cg_numPopups 8; cg_popupFadeTime 600000"
set setPopupsNormal "cg_popupFadeTime -1500; wait 2; vstr numPopupsNormal; vstr popupFadeTimeNormal"


// Voicechat with shortcuts in the messages, overwrites page openers of the general voicechat (scripts/vsays/chat.cfg)
exec profile/scripts/vsays/chat_shortcuts.cfg

echo "^5    *** NITMOD MOD SETTINGS LOADED!"

// Weapalt definition
// Setting a alias like "set callWeapalt +attack2" and then doing "bind MOUSE2 vstr callWeapalt" does not work consistently!
// Start binds of MOUSE2/MWHEELDOWN: modState below, applied by profiles/<profile>/state.cfg (the weapon switch toggle and class scripts rebind them)
// weapalt (not +attack2): the command string is in jaymod's cgame.mp.i386.so, untested in game
set bindMwheeldownWeapalt "bind MWHEELDOWN weapalt"
set bindMouse2Weapalt "bind MOUSE2 weapalt"
set modState "vstr bindMouse2Weapalt; vstr bindMwheeldownWeapalt"  // start binds of this mod, applied by the state pass


// Alias for fov change scripts
set fovLow "cg_fov 90" // Min FOV values: 75 in etlegacy, 90 in nitmod; 90 here is etmain's clamp, untested on jaymod

set setTeamSpectator "team s" // Command to join spectator


// ECHO MENU POPUPS (voice chat, spawn menu; used by popupsMenu/popupsNormal in scripts/scripts.cfg)
// - Jaymod runs only with the 32 bit client (ET: Legacy wiki, Compatible Mods), so these are jaymod's own cvars
// - Jaymod source (github.com/budjb/jaymod, cg_popupmessages.cpp): items are removed after cg_popupTime + cg_popupWaitTime + cg_popupFadeTime,
//   so wait and fade 0 clear them in the next frame (cg_popupTime stays 0 from cvars.cfg; kill messages too). Untested in game
// - Stay: jaymod caps cg_popupWaitTime at 4000 and cg_popupFadeTime at 5000 (same file), so a menu can't stay until it is closed: 4 s + 5 s fade
set setPopupsMenu "cg_popupWaitTime 0; cg_popupFadeTime 0; wait 2; cg_numPopups 15; cg_popupWaitTime 4000; cg_popupFadeTime 5000"  // 9 s
set setPopupsNormal "cg_popupWaitTime 0; cg_popupFadeTime 0; wait 2; vstr numPopupsNormal; vstr popupWaitTimeNormal; vstr popupFadeTimeNormal"

// SERVER MENU (scripts/servermenu.cfg): heading + 12 servers fit the 15 popup lines
set serverMenuPage "execq profile/servermenu/p12_0.cfg"


echo "^5    *** JAYMOD MOD SETTINGS LOADED!"

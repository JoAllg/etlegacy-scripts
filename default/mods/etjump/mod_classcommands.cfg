//--[ CLASS COMMANDS (ETJUMP) ]--//
// ETJump inserts WP_PORTAL_GUN (39) into etmain's weapon enum, so every ID from 39 up is one higher; the primaries
// (below 39) keep the general scripts/class/cs_classcommands.cfg values. Only the covert ops pistols differ.
// Source: github.com/etjump/etjump src/game/bg_public.h (weapon_t, master). Not tested in game.
// Allies
set b_covops_sten "team b 4 10 48"
set b_covops_fg42 "team b 4 33 48"
set b_covops_rifle "team b 4 25 48"
// Axis
set r_covops_sten "team r 4 10 49"
set r_covops_fg42 "team r 4 33 49"
set r_covops_rifle "team r 4 32 49"


echo "^5    *** ETJUMP CLASS COMMANDS LOADED!"

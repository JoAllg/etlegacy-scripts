// Default values: nothing here is tested in game on ETJump, adjust after testing

// Weapalt definition
// Setting a alias like "set callWeapalt +attack2" and then doing "bind MOUSE2 vstr callWeapalt" does not work consistently!
// Start binds of MOUSE2/MWHEELDOWN: modState below, applied by profiles/<profile>/state.cfg (the weapon switch toggle and class scripts rebind them)
// weapalt is the etmain command, untested in game
set bindMwheeldownWeapalt "bind MWHEELDOWN weapalt"
set bindMouse2Weapalt "bind MOUSE2 weapalt"
set modState "vstr bindMouse2Weapalt; vstr bindMwheeldownWeapalt"  // start binds of this mod, applied by the state pass

// Kept from the general files: fovLow 90 (etmain's minimum FOV), maxFpsLow 71, setTeamSpectator "team spectator", popups unchanged by the echo menus

// Weapon keys with fallback (bankPistol/bankSMGSelect/bankSMGCycle, binds_custom.cfg): ETJump starts the cycle delay with every weaponbank command, an empty bank included
// (github.com/etjump/etjump, src/cgame/cg_weapons.cpp CG_WeaponBank_f), so the delay would block the second command. Without a delay both
// run and the last bank that has ammo stays selected: fallback first, wanted bank last. Not tested in game
// Limits: no pause between switches by mouse wheel or a held weapon key; with two weapons in bank 3 (soldier with SMG) the pistol key pressed
// while holding one of them makes the other the next one the SMG key selects; weaplastused may return to the fallback weapon (two switches per key)
// bankSMGCycle: the fallback form leaves bank 3 first and so returns to the same weapon; while bank 3 is in hand the SMG key runs the plain
// command, which steps to the next weapon of the bank. Wrong guess (the game switched the weapon itself): one press without fallback or without step
seta cg_weaponCycleDelay "0"
set bankPistol "weaponbank 3; weaponbank 2"
set bankSMGSelect "weaponbank 2; weaponbank 3"
set bankSMGCycle "weaponbank 3"


echo "^5    *** ETJUMP MOD SETTINGS LOADED!"

// Weapalt definition
// Setting a alias like "set callWeapalt +attack2" and then doing "bind MOUSE2 vstr callWeapalt" does not work consistently!
// Start binds of MOUSE2/MWHEELDOWN: modState below, applied by profiles/<profile>/state.cfg (the weapon switch toggle and class scripts rebind them)
set bindMwheeldownWeapalt "bind MWHEELDOWN weapalt"
set bindMouse2Weapalt "bind MOUSE2 weapalt"
set modState "vstr bindMouse2Weapalt; vstr bindMwheeldownWeapalt"  // start binds of this mod, applied by the state pass


// Alias for fov change scripts
set fovLow "cg_fov 75" // Min FOV values: 75 in etlegacy, 90 in nitmod

// Sniper FPS: legacy scales recoil by frame time (bg_pmove.c PM_HandleRecoil), low FPS gives slightly more recoil
set maxFpsLow "vstr maxFpsNormal"

set setTeamSpectator "team spectator" // Command to join spectator


// ECHO MENU POPUPS (voice chat, spawn menu; used by popupsMenu/popupsNormal in scripts/scripts.cfg)
// - No popup cvars: editcomponent changes the active HUD in memory only (hud.dat stays, a HUD switch or vid_restart restores it)
// - Clear: an item is removed once time + feedStayTime + feedFadeTime has passed, so both 0 wipe the popups in the next frame (kill messages too)
// - Lines: as many as fit into the height h. editcomponent sets the absolute position (y = top edge) and lines are drawn upward
//   from the bottom edge, so y + h stays 397 (hud.dat: y 57 below the screen middle 240, h 100)
set popupmessagesNormal "editcomponent popupmessages y 297 w 422 h 100 feedStayTime 2000 feedFadeTime 2500"  // hud.dat position and size, code defaults of the times
// - Stay: 10 min, in effect until the menu is closed (popupsClose clears it); popups that arrive meanwhile stay as long
// - Width: lines longer than w wrap (cg_popupmessages.c CG_DrawPMItems), which would break the aligned server menu columns; 600 fits about 105 characters (estimated from the font scale, not measured)
set setPopupsMenu "editcomponent popupmessages feedStayTime 0 feedFadeTime 0; wait 2; editcomponent popupmessages y 157 w 600 h 240 feedStayTime 600000 feedFadeTime 300"  // about 15 lines
set setPopupsNormal "editcomponent popupmessages feedStayTime 0 feedFadeTime 0; wait 2; vstr popupmessagesNormal"

// SERVER MENU (scripts/servermenu.cfg): heading + 12 servers fit the enlarged popup area
set serverMenuPage "exec profile/servermenu/p12_0.cfg"


echo "^5    *** LEGACY MOD SETTINGS LOADED!"

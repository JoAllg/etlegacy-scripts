// Exec'd by every autoexec_<map>.cfg and autoexec_default.cfg.
// Switching fs_game only re-execs etconfig.cfg, so the previous mod's values (e.g. setTeamSpectator) would stay until F3.
// Guard: modLast holds "vstr modIs_<mod>" of the mod whose autoexec.cfg ran last. Only this mod's alias is disabled here,
// so autoexec.cfg runs once after a mod switch, not on every map load or vid_restart.
set modIs_etpub "vstr null"
vstr modLast
set modIs_etpub "exec autoexec.cfg"
// No crosshair color reset: this mod runs this file again after the map autoexec, which would undo the map's color
vstr serverCheck  // settings of the server the game is on, only after a server change (definitions.cfg)

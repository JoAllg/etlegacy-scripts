// Weapalt definition
// Setting a alias like "set callWeapalt +attack2" and then doing "bind MOUSE2 vstr callWeapalt" does not work consistently!
// Start binds of MOUSE2/MWHEELDOWN: modState below, applied by profiles/<profile>/state.cfg (the weapon switch toggle and class scripts rebind them)
set bindMwheeldownWeapalt "bind MWHEELDOWN weapalt"
set bindMouse2Weapalt "bind MOUSE2 weapalt"
set modState "vstr bindMouse2Weapalt; vstr bindMwheeldownWeapalt"  // start binds of this mod, applied by the state pass


// Alias for fov change scripts
set fovLow "cg_fov 75" // Min FOV values: 75 in etlegacy, 90 in nitmod

// Sniper FPS: only for mods that scale recoil by frame time like legacy, otherwise keep 71 from cvars.cfg
// set maxFpsLow "vstr maxFps"

set setTeamSpectator "team spectator" // Command to join spectator

// Weapon keys with fallback (bankPistol/bankSMG forms, binds_custom.cfg): only for mods that start the cycle delay on an empty bank too
// (etmain's CG_WeaponBank_f, as in nitmod, jaymod, ETJump). Without a delay both commands run and the last bank that has ammo stays selected
// ...Plain: the fallback form switches twice, which can't step to the next weapon of the wanted bank and steps the other bank when that one is
// in hand. While pistol or SMG is in hand both keys run the plain command: an empty bank leaves the weapon in hand
// Limits: no pause between switches by mouse wheel or a held weapon key; from another bank weaplastused may return to the fallback weapon (two
// switches); wrong guess (the game switched the weapon itself): no fallback until another weapon key is pressed, or one press without step
// seta cg_weaponCycleDelay "0"
// set bankPistolSelect "weaponbank 3; weaponbank 2"
// set bankPistolPlain "weaponbank 2"
// set bankSMGSelect "weaponbank 2; weaponbank 3"
// set bankSMGPlain "weaponbank 3"


echo "^5    *** <MOD> MOD SETTINGS LOADED!"

//                                            Wolfenstein:     //
//                                            Enemy Territory  //
//                                            <mod> autoexec   //
//                                                             //
// Game start and mod switch                                   //
/////////////////////////////////////////////////////////////////

unbindall  // only here, so F3 (definitions only) keeps the binds that scripts changed
wait 10  // the rest of the chain runs after the game started: bare cvar commands (state.cfg) need the client's cvars
exec profile/definitions.cfg  // definitions, F3 re-execs these
exec profiles/user.cfg  // personal settings, override the definitions; "couldn't exec" if it is missing
exec profile/state.cfg  // start values of state, skipped by F3; may use aliases of user.cfg
vstr serverForce  // settings of the server the game is on (serverconfigs/), last: they override everything above

set modLast "vstr modIs_<mod>"  // mod switch guard, see autoexec_mod.cfg
set modIs_<mod> "exec autoexec.cfg"  // armed, so switching mods before any map autoexec ran still re-execs

echo "^5>>> AUTOEXEC LOADED!"

// Only for mods that run autoexec_default.cfg (see docs/autoexec.md)
// Runs on maps without autoexec_<map>.cfg, also after every vid_restart: keep it safe to re-run (no hook resets; mod cfgs only via the guarded autoexec_mod.cfg)
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
set spawnSelectorMap "vstr spawnSelector3"  // spawn menu on maps without autoexec_<map>.cfg; use the mod's own menu command if it has one (legacy: spawnmenu)

echo ^5>>> AUTOEXEC_DEFAULT LOADED!

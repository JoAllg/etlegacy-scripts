// Spawnpoint selection menu                                   //
/////////////////////////////////////////////////////////////////

// This is a simple spawnscript that allows selecting the spawnpoints in a similar way as the games voicechat.
// The spawnscript shines the most with legacy or etpub mods if autoexec_<map>.cfg for the current map exists.
// In legacy the mods "spawnmenu" is used if no autoexec_<map>.cfg for the current map is available.

// - A maximum of 12 Spawns can be used (Keys 0-9, US_MINUS and US_EQUALS)
// - Above keys are reset to their previous bindings once a spawnpoint is selected or if the ENTER is pressed again
// - Make sure to modify alias "reBindNumbers" (binds_custom.cfg) if you have customized the bindings of the keys above

// Possible enhancements:
// - Modify spawnsays to report the class as well

//--- [ SPAWNPOINT SELECTION ] ---//
// - Press ENTER to see possible spawnpoints in the chat
// - Press the number keys to select the spawnpoint or press ENTER to cancel
// - Press BACKSPACE to announce your class and, 1 s later, the selected spawnpoint to the (fire?)team: the server drops a second chat
//   command within 800 ms (sv_floodProtect). The delay runs on the timer (scripts/common.cfg): a grenade, dynamite or class report started
//   meanwhile takes it over and the spawnpoint line is lost (makes only sense if autoexec_<map>.cfg exists and spawnsays are defined there)
// - Press KP_STAR to announce every spawnpoint you choose by itself (off by default, start value: profiles/<profile>/state.cfg)
// - Press KP_DEL to list all spawnpoints in the chat (Legacy only)
bind ENTER "vstr spawnSelector"  // Spawn selector (different modis, depending if the mod is legacy or if autoexec_<map>.cfg exists and a compatible mod is used)
bind BACKSPACE "vstr classSay; set timerDone vstr spawnsay; vstr timer1000"  // Announce class, then spawnpoint to team (classSay: class/cs_backend.cfg)
bind KP_STAR "vstr spawnReportToggle"  // Announce every chosen spawnpoint by itself
bind KP_DEL "listspawnpt"  // List spawnpoints in console (Legacy only)



//---[ SPAWNSELECTION LOGIC ] ---//

// Spawnselector overrides hierachy:
// Multiple consecutive aliases are used that can have a different state compared to the default below
// - spawnSelector: "Select team" message if not in a team, "Select class" message until a class is chosen (the class pick joins the team), then spawnSelectorMap
// - spawnSelectorMap: Menu of the current map: own menu or legacy spawnmenu. Set only by autoexecs, so re-execing the cfgs keeps it
// - spawnSelector3: Rest Number keys (after spawnselection)
// - spawnSelector4: Team specific spawnpoints. Set only by autoexec_axis/allies.cfg, so re-execing the cfgs keeps it
// spawnSelector/spawnSelectorTeam start values: profiles/<profile>/state.cfg (team and class choices change them, so they must survive F3)
// spawnSelectorTeam: run by the team keys (class/cs_backend.cfg teamAllies/teamAxis), only acts while still spectator
set setSpawnSelectorSpectator "set spawnSelector vstr noSpawnTeam; set spawnSelectorTeam vstr setSpawnSelectorNoClass"  // class/cs_backend.cfg teamSpectator
set setSpawnSelectorNoClass "set spawnSelector vstr noSpawnClass"
set setSpawnSelectorClass "set spawnSelector vstr spawnSelectorMap; set spawnSelectorTeam vstr null"  // class/cs_backend.cfg classHook
set spawnSelector3 "vstr resetLayers; vstr popupsMenu; vstr spawnSelector4; vstr playSelect; set spawnSelector3 vstr spawnSelector3OFF"  // resetLayers: an open voice chat would keep its binds and toggle state
set spawnSelector3OFF "vstr resetLayers; vstr playCancel"
// spawnSelector4 is not defined here: an undefined alias does nothing on vstr, and defining it would drop the team list on F3

// What every spawnp* does after setspawnpt and spawnsay (map autoexecs, generated by tools/spawnpoints/spawnpoints.py): one place instead of every file
set spawnChosen "vstr resetLayers; vstr playSelect; vstr spawnReport"
// Spawn report: run by spawnChosen, after spawnp* set spawnsay to the chosen spawnpoint
set spawnReportON "set spawnReport vstr spawnsay; set spawnReportToggle vstr spawnReportOFF; set connectSaySpawn vstr connectSayText; echo ^8SPAWN REPORT ^2ON; vstr playSelect"
set spawnReportOFF "set spawnReport vstr null; set spawnReportToggle vstr spawnReportON; set connectSaySpawn vstr null; echo ^8SPAWN REPORT ^1OFF; vstr playCancel"

// No team / no class messages
set noSpawnTeam "echo ^1! ^8SPAWNPOINT ^7Choose a team first; vstr playError"
set noSpawnClass "echo ^1! ^8SPAWNPOINT ^7Choose a class first; vstr playError"

// Spawnpoints (spawnp*, echosp*, spawnsay*) and the menu itself (spawnpsr/-psb: echo list + binds)
// - Defined by autoexecs only: autoexec_<map>.cfg, or scripts/spawn/generic_spawnpoints.cfg via autoexec_default.cfg. Defining them here would let F3 overwrite the current map's spawnpoints
// - spawnpsr/-psb bind only the keys their map has; spawnSelector4 unbinds the number row first (unbindNumberRow, binds_custom.cfg),
//   so a spawnpoint alias left over from the previous map is on no key

echo "^5    *** SPAWNSCRIPT LOADED!"

// HUD TOGGLE
// - Enable desired hud element in hudON
// - If default values are included as a alias it would be easierto change the default
// - Does not work together with etlegacy custom hud
bind F9 "vstr hudToggle"
set hudToggle "vstr hudON"
set hudON "cg_drawFPS 1; cg_drawPing 1; cg_drawTime 1; cg_lagometer 1; cg_drawspeed 0; cg_drawHUDStats 1; echo ^8HUD ^2ON; set hudToggle vstr hudOFF; vstr playSelect"
set hudOFF "cg_drawFPS 1; cg_drawPing 0; cg_drawTime 1; cg_lagometer 1; cg_drawspeed 0; vstr drawHUDStatsNormal; echo ^8HUD ^1OFF; set hudToggle vstr hudON; vstr playCancel"



// CROSSHAIR COLOR CYCLE
// - tools/serverconfig.py reads the echo and saves the step in the map's autoexec ("vstr crosshairColor<Name>"):
//   the echoed name must match the alias name
bind HOME "vstr cycleCrosshairColor"
set cycleCrosshairColor "vstr crosshairColorWhite"
set crosshairColorWhite "cg_crosshaircolor white; cg_crosshaircoloralt white; set cycleCrosshairColor vstr crosshairColorYellow; vstr playSelect; echo ^8CROSSHAIR COLOR ^2white"
set crosshairColorYellow "cg_crosshaircolor yellow; cg_crosshaircoloralt yellow; set cycleCrosshairColor vstr crosshairColorCyan; vstr playSelect; echo ^8CROSSHAIR COLOR ^2yellow"
set crosshairColorCyan "cg_crosshaircolor cyan; cg_crosshaircoloralt cyan; set cycleCrosshairColor vstr crosshairColorGreen; vstr playSelect; echo ^8CROSSHAIR COLOR ^2cyan"
set crosshairColorGreen "cg_crosshaircolor green; cg_crosshaircoloralt green; set cycleCrosshairColor vstr crosshairColorOrange; vstr playSelect; echo ^8CROSSHAIR COLOR ^2green"
set crosshairColorOrange "cg_crosshaircolor orange; cg_crosshaircoloralt orange; set cycleCrosshairColor vstr crosshairColorRed; vstr playSelect; echo ^8CROSSHAIR COLOR ^2orange"
set crosshairColorRed "cg_crosshaircolor red; cg_crosshaircoloralt red; set cycleCrosshairColor vstr crosshairColorBlack; vstr playSelect; echo ^8CROSSHAIR COLOR ^2red"
set crosshairColorBlack "cg_crosshaircolor black; cg_crosshaircoloralt black; set cycleCrosshairColor vstr crosshairColorWhite; vstr playSelect; echo ^8CROSSHAIR COLOR ^2black"

// CROSSHAIR SIZE CYCLE (both directions if enabled)
// - in five steps from 15 to 75
bind + "vstr cycleCrosshairSizeUp"
bind - "vstr cycleCrosshairSizeDown"
set cycleCrosshairSizeUp "vstr crosshairSize15"
set cycleCrosshairSizeDown "vstr crosshairSize60" 
set crosshairSize15 "cg_crosshairsize 15; set cycleCrosshairSizeDown vstr crosshairSize60; set cycleCrosshairSizeUp vstr crosshairSize20; vstr playSelect; echo ^8CROSSHAIR SIZE ^215"
set crosshairSize20 "cg_crosshairsize 20; set cycleCrosshairSizeDown vstr crosshairSize15; set cycleCrosshairSizeUp vstr crosshairSize25; vstr playSelect; echo ^8CROSSHAIR SIZE ^220"
set crosshairSize25 "cg_crosshairsize 25; set cycleCrosshairSizeDown vstr crosshairSize20; set cycleCrosshairSizeUp vstr crosshairSize30; vstr playSelect; echo ^8CROSSHAIR SIZE ^225"
set crosshairSize30 "cg_crosshairsize 30; set cycleCrosshairSizeDown vstr crosshairSize25; set cycleCrosshairSizeUp vstr crosshairSize35; vstr playSelect; echo ^8CROSSHAIR SIZE ^230"
set crosshairSize35 "cg_crosshairsize 35; set cycleCrosshairSizeDown vstr crosshairSize30; set cycleCrosshairSizeUp vstr crosshairSize40; vstr playSelect; echo ^8CROSSHAIR SIZE ^235"
set crosshairSize40 "cg_crosshairsize 40; set cycleCrosshairSizeDown vstr crosshairSize35; set cycleCrosshairSizeUp vstr crosshairSize45; vstr playSelect; echo ^8CROSSHAIR SIZE ^240"
set crosshairSize45 "cg_crosshairsize 45; set cycleCrosshairSizeDown vstr crosshairSize40; set cycleCrosshairSizeUp vstr crosshairSize50; vstr playSelect; echo ^8CROSSHAIR SIZE ^245"
set crosshairSize50 "cg_crosshairsize 50; set cycleCrosshairSizeDown vstr crosshairSize45; set cycleCrosshairSizeUp vstr crosshairSize55; vstr playSelect; echo ^8CROSSHAIR SIZE ^250"
set crosshairSize55 "cg_crosshairsize 55; set cycleCrosshairSizeDown vstr crosshairSize50; set cycleCrosshairSizeUp vstr crosshairSize60; vstr playSelect; echo ^8CROSSHAIR SIZE ^255"
set crosshairSize60 "cg_crosshairsize 60; set cycleCrosshairSizeDown vstr crosshairSize55; set cycleCrosshairSizeUp vstr crosshairSize15; vstr playSelect; echo ^8CROSSHAIR SIZE ^260"


// FPS CYCLE
// - temporarily overwrites maxFpsNormal alias
bind END "vstr cycleFPS"
set cycleFPS "vstr fps71"
set fps71  "seta com_maxfps 71; cl_maxpackets 71; set maxFpsNormal com_maxfps 71; set cycleFPS vstr fps76; vstr playSelect; echo ^8FPS ^271;"
set fps76  "seta com_maxfps 76; cl_maxpackets 76; set maxFpsNormal com_maxfps 76; set cycleFPS vstr fps125; vstr playSelect; echo ^8FPS ^276;"
set fps125 "seta com_maxfps 125; cl_maxpackets 125; set maxFpsNormal com_maxfps 125; set cycleFPS vstr fps200; vstr playSelect; echo ^8FPS ^2125;"
set fps200 "seta com_maxfps 200; cl_maxpackets 100; set maxFpsNormal com_maxfps 200; set cycleFPS vstr fps250; vstr playSelect; echo ^8FPS ^2200;"
set fps250 "seta com_maxfps 250; cl_maxpackets 125; set maxFpsNormal com_maxfps 250; set cycleFPS vstr fps333; vstr playSelect; echo ^8FPS ^2250;"
set fps333 "seta com_maxfps 333; cl_maxpackets 111; set maxFpsNormal com_maxfps 333; set cycleFPS vstr fps500; vstr playSelect; echo ^8FPS ^2333;"
set fps500 "seta com_maxfps 500; cl_maxpackets 125; set maxFpsNormal com_maxfps 500; set cycleFPS vstr fps71; vstr playSelect; echo ^8FPS ^2500;"

// GAMMA CYCLE (general brightness)
bind PGUP "vstr cycleGamma"
set cycleGamma "vstr gamma150"
set gamma150 "r_gamma 1.5; set cycleGamma vstr gamma175; vstr playSelect; echo ^8GAMMA ^21.5;"
set gamma175 "r_gamma 1.75; set cycleGamma vstr gamma200; vstr playSelect; echo ^8GAMMA ^21.75;"
set gamma200 "r_gamma 2; set cycleGamma vstr gamma250; vstr playSelect; echo ^8GAMMA ^22;"
set gamma250 "r_gamma 2.5; set cycleGamma vstr gamma275; vstr playSelect; echo ^8GAMMA ^22.5;"
set gamma275 "r_gamma 2.75; set cycleGamma vstr gamma300; vstr playSelect; echo ^8GAMMA ^22.75;"
set gamma300 "r_gamma 3; set cycleGamma vstr gamma150; vstr playSelect; echo ^8GAMMA ^23;"

// WINDOW MODE TOGGLE
// - Fullscreen at fullscreenResolution <-> borderless window at desktop resolution (easier Alt+Tab)
// - The window cvars are latched, so the switch needs vid_restart (re-runs the map autoexec). Alt+Enter toggles r_fullscreen live but keeps the resolution
// - r_customwidth/-height are set again, because resizing a window overwrites them
bind INS "vstr windowToggle"
// windowToggle start value + setWindowFullscreen: profiles/<profile>/state.cfg (survive F3)
set fullscreenResolution "r_customwidth 1280; r_customheight 720"  // ET: Legacy default, personal value: profiles/user.cfg
set setWindowFullscreen "r_mode -1; vstr fullscreenResolution; r_fullscreen 1; r_noborder 0"
set setWindowBorderless "r_mode -2; r_fullscreen 0; r_noborder 1"
set windowBorderless "vstr setWindowBorderless; set windowToggle vstr windowFullscreen; vstr playSelect; echo ^8WINDOW ^2borderless; vid_restart"
set windowFullscreen "vstr setWindowFullscreen; set windowToggle vstr windowBorderless; vstr playCancel; echo ^8WINDOW ^1fullscreen; vid_restart"

// NETWORK CYCLE (anti-lag)
// - Normal: full rates for a good connection
// - Unstable (packet loss, jitter): packetdup resends the inputs of the last 3 packets; extrapolationMargin and interpolation buffer late snapshots (few ms more delay)
//   - cl_interpolation only works on servers with sv_fps >= 40, the engine resets it to 0 otherwise
// - Slow (low bandwidth): less download (rate, snaps) and upload (maxpackets)
//   - cl_maxpackets 63 = every 2nd frame at 125 FPS (packets go out on frames only); the FPS cycle (END) sets cl_maxpackets as well
// - Not used: negative cl_timeNudge (more extrapolation = more warping on a bad connection, servers can restrict it), cl_nodelta (full snapshots = more bandwidth)
// - snaps is capped by the server's sv_fps, rate by 90000 and sv_maxRate
// - Judge a setting with the lagometer (cg_lagometer, HUD), not cl_showTimeDelta (prints to the console only, the on-screen notify lines are cheat-protected)
//   - Upper graph (timing buffer): blue = interpolating (ok), yellow = extrapolating (warping)
//   - Lower graph (snapshots): green = latency, yellow = delayed by rate, red = lost packets
bind DEL "vstr cycleNet"
// cycleNet start value + setNetNormal: profiles/<profile>/state.cfg (survive F3)
set netNormalRates "snaps 20; rate 25000; cl_maxpackets 125"  // ET: Legacy default, personal value: profiles/user.cfg
set setNetNormal "vstr netNormalRates; cl_packetdup 1; cl_interpolation 0; cl_extrapolationMargin 1"
set setNetUnstable "vstr netNormalRates; cl_packetdup 3; cl_interpolation 1; cl_extrapolationMargin 5"
set setNetSlow "snaps 20; rate 25000; cl_maxpackets 63; cl_packetdup 1; cl_interpolation 0; cl_extrapolationMargin 1"
set netNormal "vstr setNetNormal; set cycleNet vstr netUnstable; vstr playCancel; echo ^8NETWORK ^2normal"
set netUnstable "vstr setNetUnstable; set cycleNet vstr netSlow; vstr playSelect; echo ^8NETWORK ^2unstable"
set netSlow "vstr setNetSlow; set cycleNet vstr netNormal; vstr playSelect; echo ^8NETWORK ^2slow"


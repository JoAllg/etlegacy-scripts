// Shared primitives used by every other script, so exec'd first by definitions.cfg

//--- [ SOUNDS ] ---//
set playSelect "play sound/menu/select.wav"
set playCancel "play sound/menu/cancel.wav"
set playFilter "play sound/menu/filter.wav"
set playError "play sound/weapons/misc/fire_dry.wav"
set playReload "play sound/misc/am_pkup.wav"
set playRecord "play sound/misc/referee.wav"

//--- [ NULL ] ---//
// Empty target for disabled pointers and hooks ("set <hook> vstr null")
set null ""

//--- [ TIMER ] ---//
// Runs an alias after a time without blocking the keys: "set timerDone vstr <alias>; vstr timer<ms>"
// - wait stops the whole command buffer, key presses and releases included. So the countdown waits one tick, then re-queues itself via +vstr,
//   which appends behind pending key commands (vstr would insert before them). A key command lags up to one tick
// - One timer for all scripts: a start replaces a running countdown, timerStop cancels it
// - One loop only: a start during a countdown just sets the counter (timerRun is empty while the loop lives), a second loop would count
//   twice as fast. The loop re-arms timerRun when it ends or dies (timerDead). Defined here, not in state.cfg: F3 revives a lost loop
// - A tick is wait 5: the buffer runs twice per frame, so 2.5 frames = 20 ms at com_maxfps 125 only; lower FPS makes it longer
// - Nested counter (ticks � rounds of 15 ticks = 300 ms) instead of one alias per tick: nitmod is close to MAX_CVARS
// - A new duration timer<ms>: <rounds> � 15 + <ticks> ticks (timerRound 0 to 9, timerTick 1 to 15)
set timer160  "set timerRound vstr timerRound0; set timerTick vstr timerTick8; vstr timerRun"
set timer400  "set timerRound vstr timerRound1; set timerTick vstr timerTick5; vstr timerRun"
set timer1000 "set timerRound vstr timerRound3; set timerTick vstr timerTick5; vstr timerRun"
set timer2900 "set timerRound vstr timerRound9; set timerTick vstr timerTick10; vstr timerRun"
set timerStop "set timerTick vstr timerDead"
set timerRun "vstr timerRunGo"
set timerRunGo "set timerRun vstr null; vstr timerWait"
set timerDead "set timerRun vstr timerRunGo"
set timerWait "wait 5; +vstr timerLoop null 0 0"  // +vstr needs 5 args (key code and time are dummies)
set timerLoop "vstr timerTick"
set timerTick15 "set timerTick vstr timerTick14; vstr timerWait"
set timerTick14 "set timerTick vstr timerTick13; vstr timerWait"
set timerTick13 "set timerTick vstr timerTick12; vstr timerWait"
set timerTick12 "set timerTick vstr timerTick11; vstr timerWait"
set timerTick11 "set timerTick vstr timerTick10; vstr timerWait"
set timerTick10 "set timerTick vstr timerTick9; vstr timerWait"
set timerTick9 "set timerTick vstr timerTick8; vstr timerWait"
set timerTick8 "set timerTick vstr timerTick7; vstr timerWait"
set timerTick7 "set timerTick vstr timerTick6; vstr timerWait"
set timerTick6 "set timerTick vstr timerTick5; vstr timerWait"
set timerTick5 "set timerTick vstr timerTick4; vstr timerWait"
set timerTick4 "set timerTick vstr timerTick3; vstr timerWait"
set timerTick3 "set timerTick vstr timerTick2; vstr timerWait"
set timerTick2 "set timerTick vstr timerTick1; vstr timerWait"
set timerTick1 "vstr timerRound"
set timerRound9 "set timerRound vstr timerRound8; set timerTick vstr timerTick15; vstr timerWait"
set timerRound8 "set timerRound vstr timerRound7; set timerTick vstr timerTick15; vstr timerWait"
set timerRound7 "set timerRound vstr timerRound6; set timerTick vstr timerTick15; vstr timerWait"
set timerRound6 "set timerRound vstr timerRound5; set timerTick vstr timerTick15; vstr timerWait"
set timerRound5 "set timerRound vstr timerRound4; set timerTick vstr timerTick15; vstr timerWait"
set timerRound4 "set timerRound vstr timerRound3; set timerTick vstr timerTick15; vstr timerWait"
set timerRound3 "set timerRound vstr timerRound2; set timerTick vstr timerTick15; vstr timerWait"
set timerRound2 "set timerRound vstr timerRound1; set timerTick vstr timerTick15; vstr timerWait"
set timerRound1 "set timerRound vstr timerRound0; set timerTick vstr timerTick15; vstr timerWait"
set timerRound0 "set timerRun vstr timerRunGo; vstr timerDone"

echo "^5    *** COMMON LOADED!"

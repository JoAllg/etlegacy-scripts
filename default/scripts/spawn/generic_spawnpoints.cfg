// Generic spawnpoint list for scripts/spawnscript.cfg.
// - Exec'd only by autoexecs (top of every autoexec_<map>.cfg and by autoexec_default.cfg): cvars survive map and mod changes,
//   so every map starts from this list and the previous map's spawnpoints are gone. The map's own values follow and override it.
// - Not exec'd by the cfg chain, because F3 would overwrite the current map's spawnpoints.
// - Must cover every key bindNumbersSpawnpsr/-psb binds (spawnp0-11), otherwise unused keys keep the previous map's spawnpoints.

set spawnpsr    "vstr echospr; vstr bindNumbersSpawnpsr"
set spawnpsb    "vstr echospb; vstr bindNumbersSpawnpsb"

// Spawnpoints
set spawnp0r    "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect;"
set spawnp1r    "setspawnpt 1; vstr resetSpawnSelector; set spawnsay vstr spawnsay1; vstr playSelect;"
set spawnp2r    "setspawnpt 2; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect;"
set spawnp3r    "setspawnpt 3; vstr resetSpawnSelector; set spawnsay vstr spawnsay3; vstr playSelect;"
set spawnp4r    "setspawnpt 4; vstr resetSpawnSelector; set spawnsay vstr spawnsay4; vstr playSelect;"
set spawnp5r    "setspawnpt 5; vstr resetSpawnSelector; set spawnsay vstr spawnsay5; vstr playSelect;"
set spawnp6r    "setspawnpt 6; vstr resetSpawnSelector; set spawnsay vstr spawnsay6; vstr playSelect;"
set spawnp7r    ""
set spawnp8r    ""
set spawnp9r    ""
set spawnp10r   ""
set spawnp11r   ""

// Spawn IDs are not team specific
set spawnp0b    "vstr spawnp0r"
set spawnp1b    "vstr spawnp1r"
set spawnp2b    "vstr spawnp2r"
set spawnp3b    "vstr spawnp3r"
set spawnp4b    "vstr spawnp4r"
set spawnp5b    "vstr spawnp5r"
set spawnp6b    "vstr spawnp6r"
set spawnp7b    ""
set spawnp8b    ""
set spawnp9b    ""
set spawnp10b   ""
set spawnp11b   ""

// Echo spawnpoints
set echospr     "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r; vstr echosp2r; vstr echosp3r; vstr echosp4r; vstr echosp5r; vstr echosp6r"
set echospb     "vstr echospr"
set echosp0r    "echo ^31. ^7Default Spawn"
set echosp1r    "echo ^32. ^7Spawnpoint 1"
set echosp2r    "echo ^33. ^7Spawnpoint 2"
set echosp3r    "echo ^34. ^7Spawnpoint 3"
set echosp4r    "echo ^35. ^7Spawnpoint 4"
set echosp5r    "echo ^36. ^7Spawnpoint 5"
set echosp6r    "echo ^37. ^7Spawnpoint 6"

// Announce spawnpoints
set spawnsay0   "vstr playFilter; say_teamnl ^5will spawn at ^0Default Spawn"
set spawnsay1   "vstr playFilter; say_teamnl ^5will spawn at ^wSpawnpoint 1"
set spawnsay2   "vstr playFilter; say_teamnl ^5will spawn at ^wSpawnpoint 2"
set spawnsay3   "vstr playFilter; say_teamnl ^5will spawn at ^wSpawnpoint 3"
set spawnsay4   "vstr playFilter; say_teamnl ^5will spawn at ^wSpawnpoint 4"
set spawnsay5   "vstr playFilter; say_teamnl ^5will spawn at ^wSpawnpoint 5"
set spawnsay6   "vstr playFilter; say_teamnl ^5will spawn at ^wSpawnpoint 6"

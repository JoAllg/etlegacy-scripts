// Generic spawnpoint list for scripts/spawnscript.cfg, for maps without autoexec_<map>.cfg.
// - Exec'd only by autoexec_default.cfg: aliases survive map and mod changes, so it replaces the menu of the previous map.
//   A map autoexec defines its own menu (spawnpsr/-psb) instead.
// - Not exec'd by the cfg chain, because F3 would overwrite the current map's spawnpoints.

// Menu: echo list + binds of the keys in use (spawnSelector4 unbinds the number row first)
set spawnpsr    "vstr echospr; bind 1 vstr spawnp0r; bind 2 vstr spawnp1r; bind 3 vstr spawnp2r; bind 4 vstr spawnp3r; bind 5 vstr spawnp4r; bind 6 vstr spawnp5r; bind 7 vstr spawnp6r"
set spawnpsb    "vstr spawnpsr"  // spawn IDs are not team specific

// Spawnpoints
set spawnp0r    "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect; vstr spawnReport"
set spawnp1r    "setspawnpt 1; vstr resetSpawnSelector; set spawnsay vstr spawnsay1; vstr playSelect; vstr spawnReport"
set spawnp2r    "setspawnpt 2; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect; vstr spawnReport"
set spawnp3r    "setspawnpt 3; vstr resetSpawnSelector; set spawnsay vstr spawnsay3; vstr playSelect; vstr spawnReport"
set spawnp4r    "setspawnpt 4; vstr resetSpawnSelector; set spawnsay vstr spawnsay4; vstr playSelect; vstr spawnReport"
set spawnp5r    "setspawnpt 5; vstr resetSpawnSelector; set spawnsay vstr spawnsay5; vstr playSelect; vstr spawnReport"
set spawnp6r    "setspawnpt 6; vstr resetSpawnSelector; set spawnsay vstr spawnsay6; vstr playSelect; vstr spawnReport"

// Echo spawnpoints
set echospr     "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r; vstr echosp2r; vstr echosp3r; vstr echosp4r; vstr echosp5r; vstr echosp6r"
set echosp0r    "echo ^31. ^7Default Spawn"
set echosp1r    "echo ^32. ^7Spawnpoint 1"
set echosp2r    "echo ^33. ^7Spawnpoint 2"
set echosp3r    "echo ^34. ^7Spawnpoint 3"
set echosp4r    "echo ^35. ^7Spawnpoint 4"
set echosp5r    "echo ^36. ^7Spawnpoint 5"
set echosp6r    "echo ^37. ^7Spawnpoint 6"

// Announce spawnpoints
set spawnsay0   "vstr playFilter; say_teamnl ^5will spawn at ^0Default Spawn"
set spawnsay1   "vstr playFilter; say_teamnl ^5will spawn at ^wSpawnpoint 1"
set spawnsay2   "vstr playFilter; say_teamnl ^5will spawn at ^wSpawnpoint 2"
set spawnsay3   "vstr playFilter; say_teamnl ^5will spawn at ^wSpawnpoint 3"
set spawnsay4   "vstr playFilter; say_teamnl ^5will spawn at ^wSpawnpoint 4"
set spawnsay5   "vstr playFilter; say_teamnl ^5will spawn at ^wSpawnpoint 5"
set spawnsay6   "vstr playFilter; say_teamnl ^5will spawn at ^wSpawnpoint 6"

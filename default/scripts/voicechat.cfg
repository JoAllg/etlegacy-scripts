// Echo voice chat menu with styled vsay texts                 //
/////////////////////////////////////////////////////////////////

// This is replacement for the ingame voicechat which allows to style the sent text
// The voiche chat menu is replicated via echos.

// - A maximum of 12 vsays can be bound at once (Keys 0-9, US_MINUS and US_EQUALS)
// - Above keys are reset to their previous bindings once a vsay is sent or if V is pressed again
// - Make sure to modify alias "reBindNumbers" (binds_custom.cfg) if you have customized the bindings of the keys above

// To include more vsays in the same category, the TAB key is used

// Additional Features
// - vsays/chat_shortcuts.cfg: Overwrites some vsays with shortcut text (works on some mods)
// - vsays/chat_function.cfg: Funny text cycles for announcing the class function
// - vsays/chat/: One file per voicechat page, exec'd when opened
// - vsays/servers/<clan>/: Voice chat of a server (tools/voicemenu.py), on TAB of the first page while the game is on that server
//   (serverconfigs/current_vsay.cfg, written by tools/serverconfig.py)
// - vsays/vsays_custom.cfg: More custom vsays that are used in other scripts (e.g. class script)

// Possible enhancements:
// - Add fireteam chat via "vsay_budy"
// - Addd fireteam chat as TAB to other fitting categories
// - Overwrite default vsays with server related sounds, or whole voicechat categories: from the server's cfg (serverconfigs/<id>.cfg)
// - Cycles for custom vsays that switch different vsays of the same kind (e.g. taunts, different greetings, etc.)
// TODO: Use shortcuts where applicable and on servers where it works
// - Add Fireteam Chats for other uses
// - Taunts when choosing a class. E.g. "Gonna burn you with my little FLAMETHROWER!!", "Cold feet? \n Let me warm you up with my FLAMETHROWER!" / 
//     - Or for team mates: "Don't worry about your health, I am a medic <3"
//     - The last one also for Function vsay
//     - Todo: Thos should be verxy short sentences
// - TODO: Own color scheme (auch für Nickname!)
// - TODO: Use say_teamnl where location not necessary

//--- [ VOICE CHAT ] ---//
// - Press V to see possible voice chat categories in the popup area
// - Press the number keys to select the voice chat category or press V to cancel
bind v "vstr voiceChatSelector"

bind y "mp_quickmessage"



//---[ VOICE CHAT SELECTION LOGIC ] ---//
set voiceChatSelector "vstr serverCheck; vstr resetLayers; vstr chatCategories; vstr playSelect; set voiceChatSelector vstr voiceChatSelectorOFF"  // resetLayers: an open spawn menu would keep its binds and toggle state
set voiceChatSelectorOFF "vstr resetVoiceChat; vstr playCancel"

// Resets
set resetVoiceChat "wait 10; vstr reBindNumbers; vstr popupsClose; reset voiceChatSelector"  // also used by resetLayers (scripts.cfg)


//-------------------------------------------
exec profile/scripts/vsays/chat.cfg  // Voicechat page openers (pages: vsays/chat/)
exec profile/scripts/vsays/vsays_custom.cfg  // Custom vsays of the class scripts, only used while the F7 toggle is on (class/cs_classcripts.cfg)
// Other files
//profiles/<profile>/scripts/vsays/chat_shortcuts.cfg  // Mod specific vsays, exec'd by mods/<mod>/mod_general.cfg
//-------------------------------------------


echo "^5    *** VOICECHAT LOADED!"

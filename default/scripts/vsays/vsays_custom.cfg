// One plain team vsay per task, sent by the class scripts (classVsay<Action>, class/cs_classcripts.cfg)
// - nitmod, etps: vsays/chat_shortcuts.cfg redefines the syringe vsay with the name of the teammate pointed at

// All classes
set vsayGrenade "vsay_team FireInTheHole ^1Grenade ^9out^3!"

// Medic
set vsaySyringe "vsay_team IamMedic ^9Let me ^xrevive ^9you^3!"

// Engineer
set vsayDynamiteCoverMe "vsay_team FTCoverMe ^9I am setting ^1dynamite^3. ^9Cover me^3!"

// Covert Ops
set vsayGoingUndercover "vsay_team FTGoUndercover ^9I am ^xundercover^3."



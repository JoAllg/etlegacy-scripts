// Voice Chat binds


//---[ CHAT CATEGORIES ] ---//
// Binds
set chatCategories "vstr popupsMenu; vstr echoCategories; vstr unbindNumbers; vstr bindNumbersCategories"
set bindNumbersCategories "bind 1 vstr cCat1; bind 2 vstr cCat2; bind 3 vstr cCat3; bind 4 vstr cCat4; bind 5 vstr cCat5; bind 6 vstr cCat6; bind 7 vstr cCat7; bind TAB vstr cCat8;"
set cCat1 "vstr chatStatements";
set cCat2 "vstr chatRequests";
set cCat3 "vstr chatCommands";
set cCat4 "vstr chatTalk";
set cCat5 "vstr chatGlobal";
set cCat6 "vstr chatFunction";
set cCat7 "vstr chatObjectives";
set cCat8 "vstr chatCustomCategories";  // Custom, server-related chats

// Echos
set echoCategories "echo ^8VOICE CHAT:; vstr echoCat1; vstr echoCat2; vstr echoCat3; vstr echoCat4; vstr echoCat5; vstr echoCat6; vstr echoCat7; vstr echoCatNext"
set echoCat1    "echo ^31. ^7Statements"
set echoCat2    "echo ^32. ^7Requests"
set echoCat3    "echo ^33. ^7Commands"
set echoCat4    "echo ^34. ^7Talk"
set echoCat5    "echo ^35. ^6Global"
set echoCat6    "echo ^36. ^7Function"
set echoCat7    "echo ^37. ^7Objectives"

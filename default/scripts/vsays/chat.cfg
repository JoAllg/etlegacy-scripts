// Voice chat menu with the stock vsay categories              //
/////////////////////////////////////////////////////////////////

// One page file per category in vsays/chat/, exec'd when opened (execq: a key press prints no "execing" line):
// - A page defines its texts in the aliases vsay1..vsay0, prints the menu and binds the keys to them
// - All pages share these aliases (server pages too, serverconfigs/vsays/), each page redefines them:
//   an alias per vsay, key and echo would exceed MAX_CVARS (2048)
// - chatServer<Page> runs after the page: on a server with own sounds (serverconfigs/<id>.cfg) it execs
//   serverconfigs/vsays/<id>/override/<page>.cfg, which redefines some vsay<key> with them; default.cfg resets it


//---[ PAGES ] ---//
set chatCategories       "execq profile/scripts/vsays/chat/categories.cfg"
set chatStatements       "execq profile/scripts/vsays/chat/statements.cfg; vstr chatServerStatements"
set chatRequests         "execq profile/scripts/vsays/chat/requests.cfg; vstr chatServerRequests"
set chatCommands         "execq profile/scripts/vsays/chat/commands.cfg; vstr chatServerCommands"
set chatTalk             "execq profile/scripts/vsays/chat/talk.cfg; vstr chatServerTalk"
set chatGlobal           "execq profile/scripts/vsays/chat/global.cfg; vstr chatServerGlobal"
set chatGlobalN2         "execq profile/scripts/vsays/chat/global2.cfg; vstr chatServerGlobalN2"
// chatFunction: 6. FUNCTION below
set chatObjectives       "execq profile/scripts/vsays/chat/objectives.cfg; vstr chatServerObjectives"
set chatFireteam         "execq profile/scripts/vsays/chat/fireteam.cfg; vstr chatServerFireteam"
set chatFireteamN2       "execq profile/scripts/vsays/chat/fireteam2.cfg; vstr chatServerFireteamN2"
set chatFireteamN3       "execq profile/scripts/vsays/chat/fireteam3.cfg; vstr chatServerFireteamN3"

// Server sound hooks: nothing without a server cfg (also when tools/serverconfig.py doesn't run)
set chatServerStatements "vstr null"
set chatServerRequests   "vstr null"
set chatServerCommands   "vstr null"
set chatServerTalk       "vstr null"
set chatServerGlobal     "vstr null"
set chatServerGlobalN2   "vstr null"
set chatServerObjectives "vstr null"
set chatServerFireteam   "vstr null"
set chatServerFireteamN2 "vstr null"
set chatServerFireteamN3 "vstr null"


//---[ CYCLES ] ---//
// Vsays that alternate between two texts: the steps vsay<n>a / vsay<n>b are on the page,
// the pointer lives here because a page restarts everything it defines each time it is opened
set cycleVsayCoverMe "vstr vsay5a"  // requests.cfg: CoverMe / FTCoverMe
set cycleVsayAttack  "vstr vsay2a"  // commands.cfg: LetsGo / FTAttack
set cycleVsayMines   "vstr vsay7a"  // commands.cfg: ClearMines / FTCheckLandmines



//--[ 6. FUNCTION ] ---//
// Depends on the classscript which overwrites 'chatFunction' with the correct class vsay

// Vsays
set vsaySoldier   "vsay_team IamSoldier ^9I'm a ^xsoldier^3."
set vsayMedic    "vsay_team IamMedic ^9I'm a ^xmedic^3."
set vsayEngineer  "vsay_team IamEngineer ^9I'm an ^xengineer^3."
set vsayFieldOps "vsay_team IamFieldOps ^9I'm a ^xfield ops^3."
set vsayCovertOps "vsay_team IamCovertOps ^9I'm a ^xcovert ops^3."
//exec profile/scripts/vsays/chat_function.cfg

// Binds
// chatFunction start value: profiles/<profile>/state.cfg (the class selection sets it)
set cFunSoldier    "vstr vsaySoldier; vstr resetLayers"
set cFunMedic      "vstr vsayMedic; vstr resetLayers"
set cFunEngineer   "vstr vsayEngineer; vstr resetLayers"
set cFunFieldOps   "vstr vsayFieldOps; vstr resetLayers"
set cFunCovertOps  "vstr vsayCovertOps; vstr resetLayers"


echo "^5      *** CHAT LOADED!"

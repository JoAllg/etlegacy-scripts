// Custom voice chat menu (TAB), mostly server vsays           //
/////////////////////////////////////////////////////////////////

// Expands the default voicechat messages with custom vsays.
// - After opening the voicechat press TAB to open the custom chat menu
// - Mostly server related vsays
//   - Can contain shortcuts that are not compatible with all mods

//---[ CUSTOM CATEGORIES ] ---//
// Binds
set chatCustomCategories "vstr popupsMenu; vstr echoCustomCategories; vstr unbindNumbers; vstr bindNumbersCustomCategories"
set bindNumbersCustomCategories "bind 1 vstr cCus1; bind 2 vstr cCus2; bind 3 vstr cCus3; bind 4 vstr cCus4; bind 5 vstr cCus5; bind 6 vstr cCus6; bind 7 vstr cCus7;"
// Server voice chats: copies of the servers' own quick chat menu (V), with their custom vsays; the sounds only play on those servers
// - servers/<clan>/*.cfg, one file per page, generated by tools/voicemenu.py from the server's pk3 (rerun after a new pack);
//   TAB on the entry page: the server's custom vsays its own menu leaves out
// - Each page is exec'd when opened and binds the keys directly instead of defining aliases: the ~300 server vsays
//   would exceed MAX_CVARS (2048, nitmod already uses ~1900)
set cCus1 "exec profile/scripts/vsays/servers/eg/eg.cfg"  // eG (nitmod): tools/voicemenu.py eg ~/.etlegacy/nitmod/z_eg_s57.pk3 "^9[^7eG^9]"
set cCus2 "exec profile/scripts/vsays/servers/etc/etc.cfg"  // ETc (nitmod): tools/voicemenu.py etc ~/.etlegacy/nitmod/``````````_pak_etc8.8.pk3 "^1[^7ETc^1]"
set cCus3 "exec profile/scripts/vsays/servers/ps/ps.cfg"  // Polskie Swiry (nitmod): tools/voicemenu.py ps ~/.etlegacy/nitmod/~~~~~~~~~~{PolskieSwiry}.pk3 "^7[^1PS^7]"
set cCus4 "";
set cCus5 "";
set cCus6 "";
set cCus7 "";

// Echos
set echoCustomCategories "echo ^8CUSTOM CHAT:; vstr echoCus1; vstr echoCus2; vstr echoCus3; vstr echoCus4; vstr echoCus5; vstr echoCus6; vstr echoCus7"
set echoCus1    "echo ^31. ^7eg-clan"
set echoCus2    "echo ^32. ^7etc-clan"
set echoCus3    "echo ^33. ^7ps-clan"
set echoCus4    "-"
set echoCus5    "-"
set echoCus6    "-"
set echoCus7    "-"

echo "^5      *** CHAT CUSTOM LOADED!"

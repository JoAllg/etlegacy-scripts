/////////////////////////////////////////////////////////////////

// Integration of shortcuts into vsays. Overwrites vsays of the voice chat pages (vsays/chat/).
// This should work in most mods, except legacy.
// Exec'd by mods/<mod>/mod_general.cfg of the mods that support shortcuts

//| `[A]` | Past person who gave you ammo |
//| `[H]` | Last person who gave you health |
//| `[R]` | Last person who revived you |
//| `[D]` | Last person who killed you |
//| `[K]` | Last person you killed |
//| `[L]` | Your current location (Coordinates) |
//| `[N]` | Your nickname |
//| `[P]` | Teammate you are pointing at |
//| `[S]` | Your health (HP) |
//| `[T]` | Ammo you have in current weapon |
//| `[W]` | Weapon you are currently holding |


//---[ Voice Chat ]---//
// The pages with shortcut texts are followed by their override file (vsays/chat/<page>_shortcuts.cfg)
// - execq: no "execing" line below the menu that the page has just printed
set chatRequests "exec profile/scripts/vsays/chat/requests.cfg; execq profile/scripts/vsays/chat/requests_shortcuts.cfg"
set chatGlobal   "exec profile/scripts/vsays/chat/global.cfg; execq profile/scripts/vsays/chat/global_shortcuts.cfg"


echo "^5      *** CHAT SHORTCUTS LOADED!"

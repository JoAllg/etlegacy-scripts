// Integration of shortcuts into vsays. Overwrites vsays of the voice chat pages (vsays/chat/).
// This should work in most mods, except legacy.
// Exec'd by mods/<mod>/mod_general.cfg of the mods that support shortcuts

//---[ Voice Chat ]---//
// The pages with shortcut texts are followed by their override file (vsays/chat/<page>_shortcuts.cfg)
// - execq: a key press prints no "execing" line
set chatRequests "execq profile/scripts/vsays/chat/requests.cfg; execq profile/scripts/vsays/chat/requests_shortcuts.cfg"
set chatGlobal   "execq profile/scripts/vsays/chat/global.cfg; execq profile/scripts/vsays/chat/global_shortcuts.cfg"


//---[ Vsays Custom ]---//
// Redefines the syringe vsay of vsays/vsays_custom.cfg: [P] names the teammate pointed at
set vsaySyringe "vsay_team IamMedic ^9Let me ^xrevive ^9you^3, ^x[P]^3!"


echo "^5      *** CHAT SHORTCUTS LOADED!"

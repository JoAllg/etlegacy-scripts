// Integration of shortcuts into vsays. Overwrites the default vsays.
// This should work in most mods, except legacy.
// This file has to be executed in autoexec_<mod>.cfg

//| `[A]` | Past person who gave you ammo |
//| `[H]` | Last person who gave you health |
//| `[R]` | Last person who revived you |
//| `[D]` | Last person who killed you |
//| `[K]` | Last person you killed |
//| `[L]` | Your current location (Coordinates) |
//| `[N]` | Your nickname |
//| `[P]` | Teammate you are pointing at |
//| `[S]` | Your health (HP) |
//| `[T]` | Ammo you have in current weapon |
//| `[W]` | Weapon you are currently holding |


//---[ Voice Chat ]---//
set vsayGlo6     "vsay GreatShot ^xImpressive ^l[D]^3!"

set vsayReq1a    "vsay_team Medic ^9I need a ^1Medic^3! ^9[S] HP remaining^3!; set vsayReq1 vstr vsayReq1b"
set vsayReq1b    "vsay_team FTHealMe ^1Heal me^3! ^9[S] HP left^3!; set vsayReq1 vstr vsayReq1a"




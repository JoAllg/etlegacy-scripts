// CUSTOM CHAT: TAB page of the voice chat, exec'd when opened (chatCustomCategories, vsays/chat.cfg)
// Server voice chats: copies of the servers' own quick chat menu (V), with their custom vsays; the sounds only play on those servers
// - servers/<clan>/*.cfg, one file per page, generated by tools/voicemenu.py from the server's pk3 (rerun after a new pack);
//   TAB on the entry page: the server's custom vsays its own menu leaves out
// - Can contain shortcuts that are not compatible with all mods

// Echos
vstr popupsMenu
echo "^8CUSTOM CHAT:"
echo "^31. ^7eg-clan"
echo "^32. ^7etc-clan"
echo "^33. ^7ps-clan"

// Binds
vstr unbindNumbers
bind 1 "exec profile/scripts/vsays/servers/eg/eg.cfg"  // eG (nitmod): tools/voicemenu.py eg ~/.etlegacy/nitmod/z_eg_s57.pk3 "^9[^7eG^9]"
bind 2 "exec profile/scripts/vsays/servers/etc/etc.cfg"  // ETc (nitmod): tools/voicemenu.py etc ~/.etlegacy/nitmod/``````````_pak_etc8.8.pk3 "^1[^7ETc^1]"
bind 3 "exec profile/scripts/vsays/servers/ps/ps.cfg"  // Polskie Swiry (nitmod): tools/voicemenu.py ps ~/.etlegacy/nitmod/~~~~~~~~~~{PolskieSwiry}.pk3 "^7[^1PS^7]"

// 8.3 FT OBJECTIVES: voice chat page, exec'd when opened (chatFireteamN3, vsays/chat.cfg)

// Vsays
set vsay1 "vsay_team FTDestroyObjective ^xDestroy ^9the objective^3!"
set vsay2 "vsay_team FTSatchelObjective ^xDestroy ^9the objective^3!"
set vsay3 "vsay_team FTRepairObjective ^xRepair ^9objective^3!"
set vsay4 "vsay_team FTConstructObjective ^xConstruct ^9objective^3!"
set vsay5 "vsay_team FTDisarmDynamite ^1Disarm ^9the ^1dynamite^3!"
set vsay6 "vsay_team FTDeployLandmines ^9Deploy ^xlandmines^3!"
set vsay7 "vsay_team FTDisarmLandmines ^xDisarm landmines^3!"
set vsay8 "vsay_team FTCheckLandmines ^9Check for ^xlandmines^3!"

// Echos
vstr popupsMenu
echo "^88.3 FT OBJECTIVES:"
echo "^31. ^7Destroy the objective!"
echo "^32. ^7Destroy the objective! (satchel)"
echo "^33. ^7Repair objective!"
echo "^34. ^7Construct objective!"
echo "^35. ^7Disarm the dynamite!"
echo "^36. ^7Deploy landmines!"
echo "^37. ^7Disarm landmines!"
echo "^38. ^7Check for landmines!"
echo "^2TAB FIRST PAGE"

// Binds
vstr unbindNumbers
bind 1 "vstr vsay1; vstr resetLayers"
bind 2 "vstr vsay2; vstr resetLayers"
bind 3 "vstr vsay3; vstr resetLayers"
bind 4 "vstr vsay4; vstr resetLayers"
bind 5 "vstr vsay5; vstr resetLayers"
bind 6 "vstr vsay6; vstr resetLayers"
bind 7 "vstr vsay7; vstr resetLayers"
bind 8 "vstr vsay8; vstr resetLayers"
bind TAB "vstr chatFireteam"
bind CAPSLOCK "vstr chatCategories"

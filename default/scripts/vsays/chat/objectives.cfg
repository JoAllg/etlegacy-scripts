// 7. OBJECTIVES: voice chat page, exec'd when opened (chatObjectives, vsays/chat.cfg)

// Vsays
set vsay1 "vsay_team CommandAcknowledged ^9Command ^xacknowledged^3!"
set vsay2 "vsay_team CommandDeclined ^9Command ^xdeclined^3!"
set vsay3 "vsay_team CommandCompleted ^9Command ^xcompleted^3!"
set vsay4 "vsay_team DestroyPrimary ^9Destroy the ^xprimary objective^3!"
set vsay5 "vsay_team DestroySecondary ^9Destroy the ^xsecondary objective^3!"
set vsay6 "vsay_team DestroyConstruction ^9Destroy the ^xconstruction^3!"
set vsay7 "vsay_team ConstructionCommencing ^9I'm ^xconstructing^3!"
set vsay8 "vsay_team RepairVehicle ^xRepair ^9the vehicle^3!"
set vsay9 "vsay_team DestroyVehicle ^xDisable ^9the vehicle^3!"
set vsay0 "vsay_team EscortVehicle ^xEscort ^9the vehicle^3!"

// Echos
vstr popupsMenu
echo "^87. OBJECTIVES:"
echo "^31. ^7Command acknowledged!"
echo "^32. ^7Command declined!"
echo "^33. ^7Command completed!"
echo "^34. ^7Destroy the primary objective!"
echo "^35. ^7Destroy the secondary objective!"
echo "^36. ^7Destroy the construction!"
echo "^37. ^7Construction underway!"
echo "^38. ^7Repair the vehicle!"
echo "^39. ^7Disable the vehicle!"
echo "^30. ^7Escort the vehicle!"

// Binds
vstr unbindNumbers
bind 1 "vstr vsay1; vstr resetVoiceChat"
bind 2 "vstr vsay2; vstr resetVoiceChat"
bind 3 "vstr vsay3; vstr resetVoiceChat"
bind 4 "vstr vsay4; vstr resetVoiceChat"
bind 5 "vstr vsay5; vstr resetVoiceChat"
bind 6 "vstr vsay6; vstr resetVoiceChat"
bind 7 "vstr vsay7; vstr resetVoiceChat"
bind 8 "vstr vsay8; vstr resetVoiceChat"
bind 9 "vstr vsay9; vstr resetVoiceChat"
bind 0 "vstr vsay0; vstr resetVoiceChat"

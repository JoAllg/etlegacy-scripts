// 2. REQUESTS: voice chat page, exec'd when opened (chatRequests, vsays/chat.cfg)

// Vsays
set vsay1  "vstr cycleVsayMedic"
set vsay1a "vsay_team Medic ^9I need a ^1Medic^3!; set cycleVsayMedic vstr vsay1b"
set vsay1b "vsay_team FTHealMe ^1Heal me^3!; set cycleVsayMedic vstr vsay1a"
set vsay2  "vsay_team NeedAmmo ^9I need ^1ammo^3!"
set vsay3  "vsay_team NeedBackup ^9I need ^1backup^3!"
set vsay4  "vsay_team NeedEngineer ^9We need an ^1engineer^3!"
set vsay5  "vstr cycleVsayCoverMe"
set vsay5a "vsay_team CoverMe ^1Cover me^3!; set cycleVsayCoverMe vstr vsay5b"
set vsay5b "vsay_team FTCoverMe ^1Cover me^3!; set cycleVsayCoverMe vstr vsay5a"
set vsay6  "vsay_team HoldFire ^1Hold your fire^3!"
set vsay7  "vsay_team WhereTo ^9Where to^3?"
set vsay8  "vsay_team NeedOps ^9We need ^1Covert Ops^3!"

// Echos
vstr popupsMenu
echo "^82. REQUESTS:"
echo "^31. ^7Medic!"
echo "^32. ^7I need ammo!"
echo "^33. ^7I need backup!"
echo "^34. ^7We need an engineer!"
echo "^35. ^7Cover me!"
echo "^36. ^7Hold your fire!"
echo "^37. ^7Where to?"
echo "^38. ^7We need Covert Ops!"

// Binds
vstr unbindNumbers
bind 1 "vstr vsay1; vstr resetLayers"
bind 2 "vstr vsay2; vstr resetLayers"
bind 3 "vstr vsay3; vstr resetLayers"
bind 4 "vstr vsay4; vstr resetLayers"
bind 5 "vstr vsay5; vstr resetLayers"
bind 6 "vstr vsay6; vstr resetLayers"
bind 7 "vstr vsay7; vstr resetLayers"
bind 8 "vstr vsay8; vstr resetLayers"

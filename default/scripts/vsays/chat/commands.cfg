// 3. COMMANDS: voice chat page, exec'd when opened (chatCommands, vsays/chat.cfg)

// Vsays
set vsay1  "vsay_team FollowMe ^xFollow me^3!"
set vsay2  "vstr cycleVsayAttack"
set vsay2a "vsay_team LetsGo ^xLet's go^3!; set cycleVsayAttack vstr vsay2b"
set vsay2b "vsay_team FTAttack ^xAttack^3!; set cycleVsayAttack vstr vsay2a"
set vsay3  "vsay_team Move ^xMove^3!"
set vsay4  "vsay_team ClearPath ^9Clear the ^xpath^3!"
set vsay5  "vsay_team DefendObjective ^xDefend ^9our objective^3!"
set vsay6  "vsay_team DisarmDynamite ^1Disarm ^9the dynamite^3!"
set vsay7  "vstr cycleVsayMines"
set vsay7a "vsay_team ClearMines ^9Clear the ^xmines^3!; set cycleVsayMines vstr vsay7b"
set vsay7b "vsay_team FTCheckLandmines ^9Check for ^xlandmines^3!; set cycleVsayMines vstr vsay7a"
set vsay8  "vsay_team ReinforceOffense ^9Reinforce the ^xoffense^3!"
set vsay9  "vsay_team ReinforceDefense ^9Reinforce the ^xdefense^3!"
set vsay0  "vsay_team FTFallBack ^xFall back^3!"

// Echos
vstr popupsMenu
echo "^83. COMMANDS:"
echo "^31. ^7Follow me!"
echo "^32. ^7Let's go!"
echo "^33. ^7Move!"
echo "^34. ^7Clear the path!"
echo "^35. ^7Defend our objective!"
echo "^36. ^7Disarm the dynamite!"
echo "^37. ^7Clear the mines!"
echo "^38. ^7Reinforce the offense!"
echo "^39. ^7Reinforce the defense!"
echo "^30. ^7Fall back!"

// Binds
vstr unbindNumbers
bind 1 "vstr vsay1; vstr resetLayers"
bind 2 "vstr vsay2; vstr resetLayers"
bind 3 "vstr vsay3; vstr resetLayers"
bind 4 "vstr vsay4; vstr resetLayers"
bind 5 "vstr vsay5; vstr resetLayers"
bind 6 "vstr vsay6; vstr resetLayers"
bind 7 "vstr vsay7; vstr resetLayers"
bind 8 "vstr vsay8; vstr resetLayers"
bind 9 "vstr vsay9; vstr resetLayers"
bind 0 "vstr vsay0; vstr resetLayers"

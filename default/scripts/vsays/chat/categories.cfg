// VOICE CHAT: top page of the voice chat, exec'd when opened (chatCategories, vsays/chat.cfg)

// Echos
vstr popupsMenu
echo "^8VOICE CHAT:"
echo "^31. ^7Statements"
echo "^32. ^7Requests"
echo "^33. ^7Commands"
echo "^34. ^7Talk"
echo "^35. ^6Global"
echo "^36. ^7Function"
echo "^37. ^7Objectives"

// Binds
vstr unbindNumbers
bind 1 "vstr chatStatements"
bind 2 "vstr chatRequests"
bind 3 "vstr chatCommands"
bind 4 "vstr chatTalk"
bind 5 "vstr chatGlobal"
bind 6 "vstr chatFunction"
bind 7 "vstr chatObjectives"
execq profile/serverconfigs/current_vsay.cfg  // TAB line and bind: the voice chat of the server the game is on, if it has one (tools/serverconfig.py)

// 5.2 GLOBAL: voice chat page, exec'd when opened (chatGlobalN2, vsays/chat.cfg)

// Vsays
set vsay1 "vsay Thanks ^lThanks a lot^3!"
set vsay2 "vsay Welcome ^lYou're welcome^3."
set vsay3 "vsay Oops ^lOops^3!"
set vsay4 "vsay Sorry ^lSorry^3!"
set vsay5 "vsay HoldFire ^lHold your fire^3!"
set vsay6 "vsay GoodGame ^lGood game^3!"

// Echos
vstr popupsMenu
echo "^85.2 GLOBAL:"
echo "^31. ^6Thanks a lot!"
echo "^32. ^6You're welcome."
echo "^33. ^6Oops!"
echo "^34. ^6Sorry!"
echo "^35. ^6Hold your fire!"
echo "^36. ^6Good game!"

// Binds
vstr unbindNumbers
bind 1 "vstr vsay1; vstr resetLayers"
bind 2 "vstr vsay2; vstr resetLayers"
bind 3 "vstr vsay3; vstr resetLayers"
bind 4 "vstr vsay4; vstr resetLayers"
bind 5 "vstr vsay5; vstr resetLayers"
bind 6 "vstr vsay6; vstr resetLayers"

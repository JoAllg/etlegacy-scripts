// 8.2 FT SUPPLY: voice chat page, exec'd when opened (chatFireteamN2, vsays/chat.cfg)

// Vsays
set vsay1 "vsay_team FTHealMe ^1Heal me^3!"
set vsay2 "vsay_team FTHealSquad ^xHeal ^9the squad^3!"
set vsay3 "vsay_team FTReviveMe ^1Revive me^3!"
set vsay4 "vsay_team FTReviveTeamMate ^xRevive ^9team mate^3!"
set vsay5 "vsay_team FTResupplyMe ^xResupply me^3!"
set vsay6 "vsay_team FTResupplySquad ^xResupply ^9the squad^3!"
set vsay7 "vsay_team FTMortar ^9Deploy ^xmortar^3!"

// Echos
vstr popupsMenu
echo "^88.2 FT SUPPLY:"
echo "^31. ^7Heal me!"
echo "^32. ^7Heal the squad!"
echo "^33. ^7Revive me!"
echo "^34. ^7Revive team mate!"
echo "^35. ^7Resupply me!"
echo "^36. ^7Resupply the squad!"
echo "^37. ^7Deploy mortar!"
echo "^2TAB THIRD PAGE"

// Binds
vstr unbindNumbers
bind 1 "vstr vsay1; vstr resetLayers"
bind 2 "vstr vsay2; vstr resetLayers"
bind 3 "vstr vsay3; vstr resetLayers"
bind 4 "vstr vsay4; vstr resetLayers"
bind 5 "vstr vsay5; vstr resetLayers"
bind 6 "vstr vsay6; vstr resetLayers"
bind 7 "vstr vsay7; vstr resetLayers"
bind TAB "vstr chatFireteamN3"
bind CAPSLOCK "vstr chatCategories"

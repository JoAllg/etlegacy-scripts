// 5.1 GLOBAL: voice chat page, exec'd when opened (chatGlobal, vsays/chat.cfg)

// Vsays
set vsay1 "vsay Affirmative ^lYes^3!"
set vsay2 "vsay Negative ^lNo^3!"
set vsay3 "vsay EnemyWeak ^lThe enemy is weakened^3."
set vsay4 "vsay Hi ^lHi^3!"
set vsay5 "vsay Bye ^lBye^3."
set vsay6 "vsay GreatShot ^lGreat shot^3!"
set vsay7 "vsay Cheer ^lYeah^3!"

// Echos
vstr popupsMenu
echo "^85.1 GLOBAL:"
echo "^31. ^6Yes!"
echo "^32. ^6No!"
echo "^33. ^6The enemy is weakened."
echo "^34. ^6Hi!"
echo "^35. ^6Bye."
echo "^36. ^6Great shot!"
echo "^37. ^6Yeah!"
echo "^2TAB SECOND PAGE"

// Binds
vstr unbindNumbers
bind 1 "vstr vsay1; vstr resetVoiceChat"
bind 2 "vstr vsay2; vstr resetVoiceChat"
bind 3 "vstr vsay3; vstr resetVoiceChat"
bind 4 "vstr vsay4; vstr resetVoiceChat"
bind 5 "vstr vsay5; vstr resetVoiceChat"
bind 6 "vstr vsay6; vstr resetVoiceChat"
bind 7 "vstr vsay7; vstr resetVoiceChat"
bind 8 "vstr chatGlobalN2"  // default key for the second page in the game's voice chat
bind TAB "vstr chatGlobalN2"

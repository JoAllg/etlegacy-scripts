// 4. TALK: voice chat page, exec'd when opened (chatTalk, vsays/chat.cfg)

// Vsays
set vsay1 "vsay_team Affirmative ^9Yes^3!"
set vsay2 "vsay_team Negative ^9No^3!"
set vsay3 "vsay_team Thanks ^9Thanks a lot^3!"
set vsay4 "vsay_team Welcome ^9You're welcome^3."
set vsay5 "vsay_team Sorry ^9Sorry^3!"
set vsay6 "vsay_team Oops ^9Oops^3!"

// Echos
vstr popupsMenu
echo "^84. TALK:"
echo "^31. ^7Yes!"
echo "^32. ^7No!"
echo "^33. ^7Thanks a lot!"
echo "^34. ^7You're welcome."
echo "^35. ^7Sorry!"
echo "^36. ^7Oops!"

// Binds
vstr unbindNumbers
bind 1 "vstr vsay1; vstr resetVoiceChat"
bind 2 "vstr vsay2; vstr resetVoiceChat"
bind 3 "vstr vsay3; vstr resetVoiceChat"
bind 4 "vstr vsay4; vstr resetVoiceChat"
bind 5 "vstr vsay5; vstr resetVoiceChat"
bind 6 "vstr vsay6; vstr resetVoiceChat"

// 1. STATEMENTS: voice chat page, exec'd when opened (chatStatements, vsays/chat.cfg)

// Vsays
set vsay1 "vsay_team PathCleared ^9Path ^xcleared^3."
set vsay2 "vsay_team EnemyWeak ^9The enemy is ^xweakened^3."
set vsay3 "vsay_team AllClear ^9All ^xclear^3."
set vsay4 "vsay_team Incoming ^1Incoming^3!"
set vsay5 "vsay_team FireInTheHole ^1Fire in the hole^3!"
set vsay6 "vsay_team OnDefense ^9I'm on ^xdefense^3."
set vsay7 "vsay_team OnOffense ^9I'm on ^xoffense^3."
set vsay8 "vsay_team TakingFire ^1Taking fire^3!"
set vsay9 "vsay_team MinesCleared ^9Mines ^xcleared^3."
set vsay0 "vsay_team EnemyDisguised ^9Enemy in ^1disguise^3."

// Echos
vstr popupsMenu
echo "^81. STATEMENTS:"
echo "^31. ^7Path cleared."
echo "^32. ^7The enemy is weakened."
echo "^33. ^7All clear."
echo "^34. ^7Incoming!"
echo "^35. ^7Fire in the hole!"
echo "^36. ^7I'm defending."
echo "^37. ^7I'm attacking."
echo "^38. ^7Taking fire!"
echo "^39. ^7Mines cleared."
echo "^30. ^7Enemy in disguise."

// Binds
vstr unbindNumbers
bind 1 "vstr vsay1; vstr resetLayers"
bind 2 "vstr vsay2; vstr resetLayers"
bind 3 "vstr vsay3; vstr resetLayers"
bind 4 "vstr vsay4; vstr resetLayers"
bind 5 "vstr vsay5; vstr resetLayers"
bind 6 "vstr vsay6; vstr resetLayers"
bind 7 "vstr vsay7; vstr resetLayers"
bind 8 "vstr vsay8; vstr resetLayers"
bind 9 "vstr vsay9; vstr resetLayers"
bind 0 "vstr vsay0; vstr resetLayers"

// Lists the favorite servers of the server browser with playing humans+spectators+bots/slots, map, ping and mod; a number key connects.
// - The pages are written by tools/servermenu.py, which must run next to the game: the game itself
//   can't query servers from a script. Without it the menu is empty or shows the state of its last run (time in the heading)
// - A page is a snapshot of the moment it was opened: TAB opens the next page, or the same one again if there is only one

//--- [ SERVER MENU ] ---//
// - Press RIGHTCTRL to list the servers in the popup area, sorted by playing humans
// - Press the number keys to connect or press RIGHTCTRL to cancel
// - The last entry hosts goldrush locally (disconnect; map): the game leaves the server and hosts in the mod it runs, which needs that
//   mod's server module (qagame) in its folder
// - Press KP_NUMLOCK to toggle the server say: while it is on, a number key sends a vsay with the text "Connecting to <server>."
//   before it connects: Bye, or connectVsayServer of the cfg of the server the game is on (serverconfigs/<id>.cfg, read by
//   tools/servermenu.py). The page sets connectSayText, then runs connectSay (start value: state.cfg).
//   connect follows 400 ms later (timer of scripts/common.cfg): ping + server frame + snapshot, so the own say shows in chat before the switch
bind RIGHTCTRL "vstr serverMenu"
bind KP_NUMLOCK "vstr connectSayToggle"
set connectSayON "set connectSay vstr connectSayText; set connectSayToggle vstr connectSayOFF; echo ^8SERVER SAY ^2ON; vstr playSelect"
set connectSayOFF "set connectSay vstr null; set connectSayToggle vstr connectSayON; echo ^8SERVER SAY ^1OFF; vstr playCancel"

set serverMenu "vstr resetLayers; vstr serverMenuPage; vstr playSelect; set serverMenu vstr serverMenuOFF"  // resetLayers: an open voice chat or spawn menu would keep its binds and toggle state
set serverMenuOFF "vstr resetLayers; vstr playCancel"

// First page: heading + 7 servers fit every mod (nitmod shows 8 popup lines at most);
// mods whose popup area holds 13 lines use the pages of 12 (mods/<mod>/mod_general.cfg)
set serverMenuPage "execq profile/servermenu/p7_0.cfg"

echo "^5    *** SERVER MENU LOADED!"

//--- [ SCRIPTS ] ---//

// EXEC AUTOEXEC
bind F3 "vstr reloadDefinitions; vstr playReload"  // re-execs the definitions (profiles/<profile>/definitions.cfg) and user.cfg only, so state.cfg values survive
bind F1 "exec autoexec.cfg; vstr playReload"  // full reset incl. state.cfg, e.g. after a server switch within the same mod

// SCRIPT BUG FIX
// - Helpful while testing new scripts
// - resetTemporary: everything scripts change for a while and that a new life must not inherit: open menu layers (voicechat, spawn selector),
//   class toggles (resetToggles: sniper mode) and prone. Also run by the kill key (binds_custom.cfg), which adds the weapon settings
//   (resetWeapon): they fit the weapon of a new life, not the one in hand when F4 is pressed
// - F4 additionally releases all +commands
set resetTemporary "vstr resetLayers; vstr resetToggles; vstr resetProne"
bind F4 "vstr resetTemporary; -movedown; -moveup; -attack; -attack2; -reload; -zoom; -sprint; -strafe; -prone; -activate; -speed; -moveright; -moveleft; -back; -forward; -right; -left; echo ^1FIXED; vstr playReload" // exec profile/binds_default.cfg
// Closes every menu layer that rebinds keys; also run by each layer's opener, so only one layer is open at a time
set resetLayers "vstr resetVoiceChat; vstr resetSpawnSelector"
// Echo menu popups: every menu page starts with popupsMenu (clears the previous page, menu values), every layer close runs popupsClose
// - popupsClose restores the popups only after a menu changed them, so openers (resetLayers) don't clear them again
// - popupsClose start value: profiles/<profile>/state.cfg
set popupsMenu "vstr setPopupsMenu; set popupsClose vstr popupsNormal"
set popupsNormal "vstr setPopupsNormal; set popupsClose vstr null"
set setPopupsMenu "vstr null"  // clear + menu values, defined in mods/<mod>/mod_general.cfg; other mods keep the popups as they are
set setPopupsNormal "vstr null"  // clear + normal values, mods/<mod>/mod_general.cfg
// Sound engine restart (fix wrong sound files after server change)
bind F2 "snd_restart; vstr playReload"

wait 10;

// STATS
bind KP_INS "+vstr statisticsON statisticsOFF"
set statisticsON "+topshots; +stats; cg_drawHUDStats 1"
set statisticsOFF "-topshots; -stats; vstr drawHUDStatsNormal"


// VOICE SOUND TOGGLE
bind F8 "vstr soundToggle" 
set soundToggle "vstr soundOFF"
set soundOFF "cg_voiceChats 0; cg_noVoiceChats 1; echo ^8Chat sounds ^1OFF; set soundToggle vstr soundON; vstr playSelect"
set soundON "cg_voiceChats 1; cg_noVoiceChats 0; echo ^8Chat sounds ^2ON; set soundToggle vstr soundOFF; vstr playCancel"

// SCREENSHOT
bind F11 "autoscreenshot; vstr playSelect; echo ^8Screenshot ^2taken"

// DEMO RECORDING
bind F12 "vstr demotoggle"
set demotoggle "vstr demostart"
set demostart "set demotoggle vstr demostop; autorecord; echo ^8Demo recording ^2started; vstr playRecord"
set demostop "set demotoggle vstr demostart; stoprecord; echo ^8Demo recording ^1stopped; vstr playRecord"


//-------------------------------------------
echo "^5    *** SCRIPTS LOADED!"

// CLASS VSAYS TOGGLE
// - The class scripts below announce their action with the vsays of scripts/vsays/vsays_custom.cfg (via classVsay<Action>)
// - Off by default (start value: profiles/<profile>/state.cfg), because the texts are long and spam the team chat
bind F7 "vstr classVsaysToggle"
set setClassVsaysOn "set classVsayUndercover vstr vsayGoingUndercover; set classVsayArtillery vstr vsayFOpArtillery; set classVsayAmmo vstr vsayFOpAmmo; set classVsayDynamite vstr vsayDynamiteCoverMe; set classVsaySyringe vstr vsaySyringe; set classVsayAirstrike vstr vsayFOpAirstrike"
set setClassVsaysOff "set classVsayUndercover vstr null; set classVsayArtillery vstr null; set classVsayAmmo vstr null; set classVsayDynamite vstr null; set classVsaySyringe vstr null; set classVsayAirstrike vstr null"
set classVsaysON "vstr setClassVsaysOn; set classVsaysToggle vstr classVsaysOFF; echo ^8CLASS VSAYS ^2ON; vstr playSelect"
set classVsaysOFF "vstr setClassVsaysOff; set classVsaysToggle vstr classVsaysON; echo ^8CLASS VSAYS ^1OFF; vstr playCancel"


// SNIPER TOGGLE
// - You will see your recoil go down very quickly because higher m_pitch (and sensitivity) values.
// - Only useful with a scope (CovOps FG42/rifle), so the key is bound by those class assignments only
set bindMouse3Sniper "bind MOUSE3 vstr sniperToggle"
set sniperToggle "vstr sniperON"
set sniperON "vstr bindLeftaltCrouchswitch; r_fastsky 0; vstr maxFpsLow; vstr pitchSniper; set setWeapon3 vstr setWeapon3Sniper; set sniperToggle vstr sniperOFF; echo ^8SNIPER CFG ^2ON; vstr playSelect"
set sniperOFF "vstr resetSniper; echo ^8SNIPER CFG ^1OFF; vstr playCancel;"
set resetSniper "vstr bindLeftaltCrouch; set crouchswitch vstr duck; -movedown; r_fastsky 1; vstr maxFpsNormal; vstr pitchNormal; set setWeapon3 vstr setWeapon3Normal; set sniperToggle vstr sniperON"
set setWeapon3Sniper "vstr maxFpsLow; vstr bindMouse1Sprint"  // weapon key 3 keeps the sniper FPS

// STEAL UNIFORM for Covert Ops
set bindMouse5StealUniform "bind MOUSE5 +vstr stealUniformON stealUniformOFF"
set stealUniformON "vstr fovMax; +prone; -prone; +activate;"
set stealUniformOFF "vstr fovNormal; -activate; +prone; -prone; vstr weapon3; vstr classVsayUndercover"


// FAST ARTY (for Fieldops) (press once or hold key to aim first)
set bindMouse5Arty "bind MOUSE5 +vstr fieldopArtyIN fieldopArtyOUT"
set fieldopArtyIN "+zoom"
set fieldopArtyOUT "+attack; -attack; wait 2; -zoom; vstr classVsayArtillery"


// COMMAND MAP TOGGLE (for Mortar Soldier)
// - Used when spotting/sending artillery/mortar fire
// - bindGMode (start value: profiles/<profile>/state.cfg) points to the G bind of the current class
//bind g "vstr mapToggle"
set bindGMap "bind g +mapexpand"
set bindGMaptoggle "bind g vstr mapToggle"
set mapToggle "vstr mapOUT"
set mapOUT "+mapexpand; set mapToggle vstr mapIN"
set mapIN "-mapexpand; set mapToggle vstr mapOUT"
set resetMap "vstr mapIN"  // closes a map left open, run by resetToggles (classcript.cfg)


// FAST weaponbank6 (hold key)
// - Returns to weaponbank 3 when releasing the key
// - "vstr weapon3; vstr weapon2" would switch to the weapon that has ammo left. However it would also overwrite the weaponspecific settings of the first weapon with the second weapon
// - Setting "cg_autoactivate" would prevent picking up Med/Ammo packs oneself
// - Difference of the versions in only the say/vsays executed
// Satchel
set bindMouse4Satchel "bind MOUSE4 +vstr weapon6Satchel_ON weapon6Satchel_OFF"
set weapon6Satchel_ON "wait 2; vstr weapon6; wait 2; +attack"  // First wait is to prevent failing weapon switch (because of uninished previous action), which would cause this script to shoot only 
set weapon6Satchel_OFF "-attack; vstr weapon3;"
// Med packs
set bindMouse4Medpack "bind MOUSE4 +vstr weapon6Medpack_ON weapon6Medpack_OFF"
set weapon6Medpack_ON "wait 2; vstr weapon6; wait 2; +attack"  // First wait is to prevent failing weapon switch (because of uninished previous action), which would cause this script to shoot only 
set weapon6Medpack_OFF "-attack; vstr weapon3;"
// Ammo packs 
set bindMouse4Ammopack "bind MOUSE4 +vstr weapon6Ammopack_ON weapon6Ammopack_OFF"
set weapon6Ammopack_ON "wait 2; vstr weapon6; wait 2; vstr classVsayAmmo; +attack"  // First wait is to prevent failing weapon switch (because of uninished previous action), which would cause this script to shoot only 
set weapon6Ammopack_OFF "-attack; vstr weapon3;"


// FAST weaponbank6: Dynamite (hold key)
// - Hold key until dynamite is armed: plants 160 ms after the weapon switch, lets go after 400 ms, arms after another 400 ms
// - Steps of the timer (scripts/common.cfg) instead of waits: the other keys keep working, and a release stops the sequence at any step (weapon3 runs timerStop)
// - Returns to weaponbank 3 when releasing the key
set bindMouse4Dynamite "bind MOUSE4 +vstr weapon6_dynamite1 weapon6_dynamite2"
set weapon6_dynamite1 "wait 2; vstr weapon6; set timerDone vstr weapon6_dynamitePlant; vstr timer160"
set weapon6_dynamitePlant "+attack; vstr classVsayDynamite; set timerDone vstr weapon6_dynamiteRelease; vstr timer400"
set weapon6_dynamiteRelease "-attack; set timerDone vstr weapon6_dynamiteArm; vstr timer400"
set weapon6_dynamiteArm "+attack"
set weapon6_dynamite2 "-attack; vstr weapon3;"


// FAST weaponbank5: Syringe (hold key + attack)
// - Returns to weaponbank 3 when releasing the key
// - Higher pitch for easier aiming
// - You need to press attack key once when your aiming is ready
set bindMouse5Weapon5 "bind MOUSE5 +vstr weapon5_ON weapon5_OFF"
set weapon5_ON "wait 2; vstr pitchHigher; vstr weapon5" 
set weapon5_OFF "vstr classVsaySyringe; vstr pitchNormal; vstr weapon3"

// FAST weaponbank5: Pliers (hold key)
// - Crouches as well
set bindMouse5Pliers "bind MOUSE5 +vstr weapon5_pliers_ON weapon5_pliers_OFF"
set weapon5_pliers_ON "wait 2; +movedown; vstr pitchHigher; vstr weapon5; wait 2; +attack" 
set weapon5_pliers_OFF "-attack; -movedown; vstr pitchNormal; vstr weapon3"


// QUICK LANDMINES
set bindLessWeapon7 "bind < vstr weapon7"
// QUICK SMOKE GRENADE & 
set bindLessWeapon5 "bind < vstr weapon5"
// QUICKAIR STRIKE
set bindLessAirstrike "bind < +vstr airstrikeON airstrikeOFF; "
set airstrikeON "vstr weapon5"
set airstrikeOFF "vstr classVsayAirstrike; vstr weapon3"

// GRENADE AUTO-THROW (hold MOUSE1 in weaponbank 4)
// - Cooks while held, throws on release or after 2.9 s (fuse 4 s; the game itself throws only 100 ms before the explosion)
// - Countdown: the timer (scripts/common.cfg), so the release is not blocked
// - Weapon binds (binds_custom.cfg) bind it with weapon4 and stop the countdown on every other bank (resetGrenade)
// - After a death without the kill key (resetWeapon) MOUSE1 keeps this bind until a weapon key is pressed: holding fire longer than the countdown with another weapon stops shooting
set bindMouse1Grenade "bind MOUSE1 +vstr grenadeON grenadeOFF"
set grenadeON  "+attack; set timerDone vstr grenadeOFF; vstr timer2900"
set grenadeOFF "vstr resetGrenade; -attack"
set resetGrenade "vstr timerStop"


// QUICK ACTIVATE
set bindMwheelupActivate "bind MWHEELUP +activate"


echo "^5      *** CLASS SCRIPTS LOADED!"

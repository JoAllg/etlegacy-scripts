//--[ CLASS COMMANDS (for etmain) ]--//
// As a class command you can either use the "class" command (legacy/nitmod) or the "team" command (all mods).
// Default is the "team" command. Overwrite for other mods in the mod specific cfg.
// The class command needs a team already: add "team b"/"team r" to ta_Allies/ta_Axis (classcript.cfg) when using it.

// Allies
set b_soldier_mg42 "team b 0 31 8"
set b_soldier_fthrower "team b 0 6 8"
set b_soldier_panzer "team b 0 5 8"
set b_soldier_mortar "team b 0 35 8"
set b_medic_smg "team b 1 8 37"
set b_engineer_smg "team b 2 8 37"
set b_engineer_rifle "team b 2 24 37"
set b_fieldops_smg "team b 3 8 37"
set b_covops_sten "team b 4 10 47"
set b_covops_fg42 "team b 4 33 47"
set b_covops_rifle "team b 4 25 47"
// Axis
set r_soldier_mg42 "team r 0 31 3"
set r_soldier_fthrower "team r 0 6 3"
set r_soldier_panzer "team r 0 5 3"
set r_soldier_mortar "team r 0 35 3"
set r_medic_smg "team r 1 3 38"
set r_engineer_smg "team r 2 3 38"
set r_engineer_rifle "team r 2 23 38"
set r_fieldops_smg "team r 3 3 38"
set r_covops_sten "team r 4 10 48"
set r_covops_fg42 "team r 4 33 48"
set r_covops_rifle "team r 4 32 48"


//---[ DOCS TEAM COMMAND ]---//
// "team [team] [class] [primary weapon] [secondary weapon (optional)]"
// where:
// [team]
// - r = axis
// - b = allies
// [class]
// - 0 = soldier
// - 1 = medic
// - 2 = engineer
// - 3 = field ops
// - 4 = covert ops
// The IDs are the mod's weapon enum, so they diverge above ID 28: etmain has WP_TRIPMINE (29) and WP_LOCKPICK (36),
// legacy dropped both and appends its own weapons from 48, nitmod dropped WP_MAPMORTAR (17) instead.
// [primary weapon]
// etmain / legacy / nitmod = Weapon (team)
// -  3 /  3 /  3 = MP40 (axis)
// -  8 /  8 /  8 = Thompson (allies)
// - 31 / 30 / 29 = Mobile MG42 (axis)
// - 31 / 49 / 29 = Mobile MG42/Browning (allies)
// -  5 /  5 /  5 = Panzer (axis)
// -  5 / 53 /  5 = Panzer/Bazooka (allies)
// -  6 /  6 /  6 = Flamethrower (both)
// - 35 / 51 / 33 = Mortar (axis)
// - 35 / 34 / 33 = Mortar (allies)
// - 23 / 23 / 22 = Rifle (Kar98) (engineer axis)
// - 24 / 24 / 23 = Rifle (Carabine) (engineer allies)
// - 10 / 10 / 10 = Sten (allies)
// - 10 / 54 / 10 = Sten/MP34 (axis)
// - 33 / 32 / 31 = FG42 (both)
// - 25 / 25 / 24 = Garand (covert ops allies)
// - 32 / 31 / 30 = K43 (covert ops axis)
// [secondary weapon]
// etmain / legacy / nitmod = Weapon (team)
// -  7 /  7 /  7 = colt (allies)
// -  2 /  2 /  2 = lugar (axis)
// - 37 / 35 / 34 = akimbo colts (allies)
// - 38 / 36 / 35 = akimbo lugars (axis)
// - 47 / 45 / 44 = silenced akimbo colts (allies)
// - 48 / 46 / 45 = silenced akimbo lugars (axis)
// -  3 /  3 /  3 = MP40 (soldier axis)
// -  8 /  8 /  8 = Thompson (soldier allies)
// A weapon the mod does not allow for that team/class is silently replaced by the class default,
// so a wrong ID looks like "the bind picks the wrong gun", not like an error.
// Sources (verified 2026-09-17):
// - etmain weapon_t enum: https://github.com/id-Software/Enemy-Territory/blob/40342a9e3690cb5b627a433d4d5cbf30e3c57698/src/game/bg_public.h#L790
// - legacy weapon_t enum: src/game/bg_public.h ("weapon_t"), which weapon each team/class may pick:
//   src/game/bg_classes.c ("bg_playerClasses", classPrimaryWeapons/classSecondaryWeapons)
// - nitmod ships no source: IDs read from the bg_itemlist array in cgame.mp.x86_64.so inside nitmod_2.3.5.pk3
//   (gitem_t.giTag, the int at struct offset 0x48, stride 0x58, giType == IT_WEAPON)
// - jaymod (which file is unclear): https://github.com/budjb/jaymod/tree/master



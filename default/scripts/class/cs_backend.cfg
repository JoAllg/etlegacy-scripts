//--- [ BACKEND ] ---//
// This is the core of the class script (classcript.cfg). It contains the commands for the class selection and the team selection.
// Normally you should not have the need to change anything here.

// Class reset: Reset binds and toggles to their default values. The class keys need a team again, whose first press starts each class cycle anew
// - It does not reset the current team or team settings (ta_Axis, ta_Allies aliases)
set classReset "vstr resetToggles; vstr cs_default; vstr resetTeamBinds; echo ^2*^7CLASSES CLEANED^2*; vstr playCancel"

// Config aliases
set teamSpectator "vstr joinHookSpectator; vstr setSpawnSelectorSpectator; vstr resetTeamBinds; vstr playSelect; echo ^2*^7spectator^2*"
set teamAllies "vstr spawnSelectorTeam; vstr classKeysAllies; echo ^2*^7allies^2*"
set teamAxis "vstr spawnSelectorTeam; vstr classKeysAxis; echo ^2*^7axis^2*"
set noTeam "echo ^2*^7You ^2need^7 to pick a team.^2*; vstr playError"

// TEAM HOOKS
// - are only executed once per joining a team but not when switching between classes
// - armed start values: profiles/<profile>/state.cfg, so F3 does not re-arm them mid-round
set joinHookSpectator "vstr ta_Spectator; vstr setTeamSpectator; reset preJoinHookb; reset preJoinHookr; reset postJoinHookb; reset postJoinHookr"
// Pre-join hooks
// - Team assignments & settings & Team join command (if setTeamAllies or setTeamAxis are used)
// - Prevents:
//   - unecessary "vid_restart"s when accidently pressing the team key
//   - accidently switching the team when pressing the team key (if setTeamAllies or setTeamAxis are used)
// Post-join hooks
// - Fireteam vote is only called once per team switch in order to prevent accidently voting when changing classes

// CLASS HOOKS
// - are executed every time a class is selected
// - are executed before team hooks (can be changed if needed)
set classHook "vstr serverCheck; vstr resetToggles; vstr cs_default; vstr setSpawnSelectorClass; vstr playSelect;"

// Class keys
// - The first press of a class key resets that class's cycle, so it starts at the first weapon variant. It then points the key to
//   <team>_<class>Again, so further presses continue the cycle; choosing another class points all keys back to the first press
set classKeysAllies "set so vstr b_so; set me vstr b_me; set en vstr b_en; set fo vstr b_fo; set co vstr b_co"
set classKeysAxis "set so vstr r_so; set me vstr r_me; set en vstr r_en; set fo vstr r_fo; set co vstr r_co"
set resetTeamBinds "set co vstr noTeam; set so vstr noTeam; set fo vstr noTeam; set en vstr noTeam; set me vstr noTeam"

// Allied Class Selection
// Soldier
set b_so "reset cycleAlliesSoldier; vstr classKeysAllies; set so vstr b_soAgain; vstr b_soAgain"
set b_soAgain "set chatFunction vstr cFunSoldier; vstr classHook; vstr preJoinHookb; vstr cycleAlliesSoldier; vstr postJoinHookb"
set b_so1 "vstr cs_soldier_mg42; vstr b_soldier_mg42; set cycleAlliesSoldier vstr b_so2; vstr echo-b_so1; vstr say-b_so1"
set b_so2 "vstr cs_soldier_fthrower; vstr b_soldier_fthrower; set cycleAlliesSoldier vstr b_so3; vstr echo-b_so2; vstr say-b_so2"
set b_so3 "vstr cs_soldier_panzer; vstr b_soldier_panzer; set cycleAlliesSoldier vstr b_so4; vstr echo-b_so3; vstr say-b_so3"
set b_so4 "vstr cs_soldier_mortar; vstr b_soldier_mortar; set cycleAlliesSoldier vstr b_so1; vstr echo-b_so4; vstr say-b_so4"
// Medic
set b_me "reset cycleAlliesMedic; vstr classKeysAllies; set me vstr b_meAgain; vstr b_meAgain"
set b_meAgain "set chatFunction vstr cFunMedic; vstr classHook; vstr preJoinHookb; vstr cycleAlliesMedic; vstr postJoinHookb"
set b_me1 "vstr cs_medic_smg; vstr b_medic_smg; set cycleAlliesMedic vstr b_me2; vstr echo-b_me1; vstr say-b_me1"
set b_me2 "vstr cs_medic_sten; vstr b_medic_sten; set cycleAlliesMedic vstr b_me1; vstr echo-b_me2; vstr say-b_me2"
// Engineer
set b_en "reset cycleAlliesEngineer; vstr classKeysAllies; set en vstr b_enAgain; vstr b_enAgain"
set b_enAgain "set chatFunction vstr cFunEngineer; vstr classHook; vstr preJoinHookb; vstr cycleAlliesEngineer; vstr postJoinHookb"
set b_en1 "vstr cs_engineer_smg; vstr b_engineer_smg; set cycleAlliesEngineer vstr b_en2; vstr echo-b_en1; vstr say-b_en1"
set b_en2 "vstr cs_engineer_rifle; vstr b_engineer_rifle; set cycleAlliesEngineer vstr b_en1; vstr echo-b_en2; vstr say-b_en2"
// Field Ops
set b_fo "reset cycleAlliesFieldOps; vstr classKeysAllies; set fo vstr b_foAgain; vstr b_foAgain"
set b_foAgain "set chatFunction vstr cFunFieldOps; vstr classHook; vstr preJoinHookb; vstr cycleAlliesFieldOps; vstr postJoinHookb"
set b_fo1 "vstr cs_fieldops_smg; vstr b_fieldops_smg; set cycleAlliesFieldOps vstr b_fo2; vstr echo-b_fo1; vstr say-b_fo1"
set b_fo2 "vstr cs_fieldops_sten; vstr b_fieldops_sten; set cycleAlliesFieldOps vstr b_fo1; vstr echo-b_fo2; vstr say-b_fo2"
// Covert Ops
set b_co "reset cycleAlliesCovertOps; vstr classKeysAllies; set co vstr b_coAgain; vstr b_coAgain"
set b_coAgain "set chatFunction vstr cFunCovertOps; vstr classHook; vstr preJoinHookb; vstr cycleAlliesCovertOps; vstr postJoinHookb"
set b_co1 "vstr cs_covops_sten; vstr b_covops_sten; set cycleAlliesCovertOps vstr b_co2; vstr echo-b_co1; vstr say-b_co1"
set b_co2 "vstr cs_covops_fg42; vstr b_covops_fg42; set cycleAlliesCovertOps vstr b_co3; vstr echo-b_co2; vstr say-b_co2"
set b_co3 "vstr cs_covops_rifle; vstr b_covops_rifle; set cycleAlliesCovertOps vstr b_co1; vstr echo-b_co3; vstr say-b_co3"

// Axis Class Selection
// Soldier
set r_so "reset cycleAxisSoldier; vstr classKeysAxis; set so vstr r_soAgain; vstr r_soAgain"
set r_soAgain "set chatFunction vstr cFunSoldier; vstr classHook; vstr preJoinHookr; vstr cycleAxisSoldier; vstr postJoinHookr"
set r_so1 "vstr cs_soldier_mg42; vstr r_soldier_mg42; set cycleAxisSoldier vstr r_so2; vstr echo-r_so1; vstr say-r_so1"
set r_so2 "vstr cs_soldier_fthrower; vstr r_soldier_fthrower; set cycleAxisSoldier vstr r_so3; vstr echo-r_so2; vstr say-r_so2"
set r_so3 "vstr cs_soldier_panzer; vstr r_soldier_panzer; set cycleAxisSoldier vstr r_so4; vstr echo-r_so3; vstr say-r_so3"
set r_so4 "vstr cs_soldier_mortar; vstr r_soldier_mortar; set cycleAxisSoldier vstr r_so1; vstr echo-r_so4; vstr say-r_so4"
// Medic
set r_me "reset cycleAxisMedic; vstr classKeysAxis; set me vstr r_meAgain; vstr r_meAgain"
set r_meAgain "set chatFunction vstr cFunMedic; vstr classHook; vstr preJoinHookr; vstr cycleAxisMedic; vstr postJoinHookr"
set r_me1 "vstr cs_medic_smg; vstr r_medic_smg; set cycleAxisMedic vstr r_me2; vstr echo-r_me1; vstr say-r_me1"
set r_me2 "vstr cs_medic_sten; vstr r_medic_sten; set cycleAxisMedic vstr r_me1; vstr echo-r_me2; vstr say-r_me2"
// Engineer
set r_en "reset cycleAxisEngineer; vstr classKeysAxis; set en vstr r_enAgain; vstr r_enAgain"
set r_enAgain "set chatFunction vstr cFunEngineer; vstr classHook; vstr preJoinHookr; vstr cycleAxisEngineer; vstr postJoinHookr"
set r_en1 "vstr cs_engineer_smg; vstr r_engineer_smg; set cycleAxisEngineer vstr r_en2; vstr echo-r_en1; vstr say-r_en1"
set r_en2 "vstr cs_engineer_rifle; vstr r_engineer_rifle; set cycleAxisEngineer vstr r_en1; vstr echo-r_en2; vstr say-r_en2"
// Field Ops
set r_fo "reset cycleAxisFieldOps; vstr classKeysAxis; set fo vstr r_foAgain; vstr r_foAgain"
set r_foAgain "set chatFunction vstr cFunFieldOps; vstr classHook; vstr preJoinHookr; vstr cycleAxisFieldOps; vstr postJoinHookr"
set r_fo1 "vstr cs_fieldops_smg; vstr r_fieldops_smg; set cycleAxisFieldOps vstr r_fo2; vstr echo-r_fo1; vstr say-r_fo1"
set r_fo2 "vstr cs_fieldops_sten; vstr r_fieldops_sten; set cycleAxisFieldOps vstr r_fo1; vstr echo-r_fo2; vstr say-r_fo2"
// Covert Ops
set r_co "reset cycleAxisCovertOps; vstr classKeysAxis; set co vstr r_coAgain; vstr r_coAgain"
set r_coAgain "set chatFunction vstr cFunCovertOps; vstr classHook; vstr preJoinHookr; vstr cycleAxisCovertOps; vstr postJoinHookr"
set r_co1 "vstr cs_covops_sten; vstr r_covops_sten; set cycleAxisCovertOps vstr r_co2; vstr echo-r_co1; vstr say-r_co1"
set r_co2 "vstr cs_covops_fg42; vstr r_covops_fg42; set cycleAxisCovertOps vstr r_co3; vstr echo-r_co2; vstr say-r_co2"
set r_co3 "vstr cs_covops_rifle; vstr r_covops_rifle; set cycleAxisCovertOps vstr r_co1; vstr echo-r_co3; vstr say-r_co3"

echo "^5      *** CLASS BACKEND LOADED!"

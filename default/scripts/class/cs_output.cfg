// Echo and vsay feedback of the class selection               //
/////////////////////////////////////////////////////////////////

// - echo-<step>: console feedback of a class key press
// - say-<step>: tells the team the class and weapon (class report). A chat line, not a vsay: legacy adds "Next class: <class>" to the
//   Iam<Class> vsays of a player whose class changes (src/cgame/cg_servercmds.c), which would double the line; other mods do not

// CLASS REPORT TOGGLE
// - Tells the team the chosen class and weapon 3 s after the last class key press, so stepping through the weapons sends one line
//   (classReport, run by the class keys in class/cs_backend.cfg). BACKSPACE sends it at once, the spawnpoint 1 s later (scripts/spawnscript.cfg)
// - A team key drops the pending line (classSay), the next class key names it again
// - Uses the timer (scripts/common.cfg), which all scripts share: cooking a grenade or planting dynamite within the 3 s drops the line
// - Off by default (start values: profiles/<profile>/state.cfg)
bind KP_SLASH "vstr classReportToggle"
set classReportStart "set timerDone vstr classSay; vstr timer2900"
set classReportON "set classReport vstr classReportStart; set classReportToggle vstr classReportOFF; echo ^8CLASS REPORT ^2ON; vstr playSelect"
set classReportOFF "set classReport vstr null; set classReportToggle vstr classReportON; echo ^8CLASS REPORT ^1OFF; vstr playCancel"


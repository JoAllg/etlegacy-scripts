// CROUCH TOGGLE
// - Enabled via Sniper Toggle
set bindLeftaltCrouchswitch "bind LEFTALT vstr crouchswitch"
set crouchswitch "vstr duck"
set duck "+movedown; set crouchswitch vstr stand; echo ^8CROUCH ^2ON; vstr playSelect"
set stand "-movedown; set crouchswitch vstr duck; echo ^8CROUCH ^1OFF; vstr playCancel"




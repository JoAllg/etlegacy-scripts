//--- [ MOVEMENT ] ---//

// Fov scripts for long distance aiming
// - Reduces fov,crosshair size and m_pitch to improve aiming at long distances.
// - Depend on cvars saved in aliases in the following format
//   >> set crosshairSizeLow "cg_crosshairSize 28"
// - Make sure to update the aliases accordingly when your default values change. 
// - Some aliases allow different values depending on the mod (fov, altweapon).
// - Mod specific values (fovLow, alt-fire binds) are overwritten by mods/<mod>/mod_general.cfg.

// CROUCH with fov change (hold key)
// - Would be great if it would disable prone but that does not work so far.
set bindLeftaltCrouch "bind LEFTALT +vstr crouchON crouchOFF"
vstr bindLeftaltCrouch
set crouchON "+movedown; vstr fovLow; vstr pitchLow; vstr crosshairSizeLow" 
set crouchOFF "-movedown; vstr fovNormal; vstr pitchNormal; vstr crosshairSizeNormal;"
// Other possible fov changes: MOUSE2, to be used while shooting. Or when leaning

// PRONE TOGGLE with fov change (zoom in)
bind LEFTCTRL "vstr proneToggle"
set proneToggle "vstr proneON"
set proneON "-forward; -back; -moveleft; -moveright; +prone; -prone; vstr fovLow; vstr crosshairSizeLow; set proneToggle vstr proneOFF; set proneStand vstr resetProne"
set proneOFF "-forward; -back; -moveleft; -moveright; +prone; -prone; vstr resetProne; wait 200"
// - wait 200 (0.8 s at 125 FPS) blocks the key commands after standing up: the game refuses to go prone again for 750 ms
//   (src/game/bg_pmove.c PM_CheckProne), a press in that time would only flip the script
// The game ends prone on its own (jump, death, ...: docs/limitations.md) and +prone is a toggle itself, so the script would stay inverted.
// - resetProne: back to "standing", run where the life ends (kill key) and by F4 (resetTemporary, scripts/scripts.cfg).
//   Not on a class change: the class keys are used while alive and prone
// - proneStand: resetProne only while the script believes to be prone, for the jump key, so a jump leaves the crouch FOV alone.
//   A jump ends prone only 750 ms after going prone and with headroom; earlier the script is wrong until the next jump
set resetProne "vstr fovNormal; vstr crosshairSizeNormal; set proneToggle vstr proneON; set proneStand vstr null"
set proneStand "vstr null"


// EASY WEAPONSWITCH CYCLE
// Use MOUSE2 to switch to alternative weapon (second SMG or to Pistol) easily.
// - Which one depends on preference and if second SMG is available on the server
// - Helpful to use before Magazine is empty or to switch to akimbo pistols to finish the enemy off.
// - 1. MOUSE2 first weapon (start mode), 2. MOUSE2 second weapon, 3. MOUSE2 altweapon/reload (weaponswitch off)
// Also executes "activate"
// - Helpful to easily push close enemy away and disrupt their aim
bind F5 "vstr cycleWeaponSwitch"
// cycleWeaponSwitch start value: profiles/<profile>/state.cfg (survives F3)
// bindMouse2Mode: the chosen MOUSE2 bind; cs_default (scripts/classcript.cfg) applies it on every class selection, so the choice survives a class change
// The steps name a position, not a weapon: the state (state.cfg) then holds only the position, and a server cfg can
// choose the weapons without touching it (server cfgs run again on F3, which must keep the F5 choice)
set weaponSwitchFirst "set bindMouse2Mode vstr bindMouse2Switch; vstr bindMouse2Mode; set switchAlt vstr switchFirst; set cycleWeaponSwitch vstr weaponSwitchSecond; vstr echoSwitchFirst; vstr playSelect"
set weaponSwitchSecond "set bindMouse2Mode vstr bindMouse2Switch; vstr bindMouse2Mode; set switchAlt vstr switchSecond; set cycleWeaponSwitch vstr weaponSwitchWeapalt; vstr echoSwitchSecond; vstr playSelect"
set weaponSwitchWeapalt "set bindMouse2Mode vstr bindMouse2Weapalt; vstr bindMouse2Mode; set cycleWeaponSwitch vstr weaponSwitchFirst; echo ^8MOUSE2: ^1weapalt; vstr playCancel"
// Weapons of the first and second step; per server: serverconfigs/default.cfg and <id>.cfg
set weaponSwitchOrderPistol "set switchFirst vstr switchPistol; set switchSecond vstr switchSMG; set echoSwitchFirst echo ^8MOUSE2: ^2Pistols; set echoSwitchSecond echo ^8MOUSE2: ^2SMG"
set weaponSwitchOrderSMG "set switchFirst vstr switchSMG; set switchSecond vstr switchPistol; set echoSwitchFirst echo ^8MOUSE2: ^2SMG; set echoSwitchSecond echo ^8MOUSE2: ^2Pistols"
vstr weaponSwitchOrderPistol  // without tools/serverconfig.py no server cfg runs
// EASY WEAPONSWITCH
//bind MOUSE2 "vstr weaponSwitch"
set bindMouse2Switch "bind MOUSE2 vstr weaponSwitch;"
// bindMouse2Mode, weaponSwitch + switchAlt start values: profiles/<profile>/state.cfg (survive F3)

set switchSMG "+activate; vstr weapon3; -activate"  // Does not switch weaponSwitch value as that is done via weaponbinds
set switchPistol "+activate; vstr weapon2; -activate" // Does not switch weaponSwitch value as that is done via weaponbinds

// MOVEMENT SCRIPT
// Prevents movement beeing blocked when opposite movement directions are pressed at the same time.
// - I.e. because you have not released the previous button yet.
// - Instead you change directions immediately.
// Sprint while moving backwards as well
bind w              "+vstr forwardon forwardoff"
bind a              "+vstr movelefton moveleftoff"
bind s              "+vstr backon backoff"
bind d              "+vstr moverighton moverightoff"
set forwardon      "-back; +forward; set forwarding +forward"
set forwardoff     "-forward; vstr backing; set forwarding vstr null"
set backon         "-forward; +back; set backing +back" // +sprint; 
set backoff        "-back; vstr forwarding; set backing vstr null" // -sprint; 
set movelefton     "-moveright; +moveleft; set lefting +moveleft"
set moveleftoff    "-moveleft; vstr righting; set lefting vstr null"
set moverighton    "-moveleft; +moveright; set righting +moveright"
set moverightoff   "-moveright; vstr lefting; set righting vstr null"


// AUTOSPRINT WHILE SHOOTING
// - Pitch could be lowered while shooting to reduce shaking
// MOUSE1 start bind: profiles/<profile>/state.cfg (the weapon binds rebind it)
set bindMouse1Attack "bind MOUSE1 +attack"
set bindMouse1Sprint "bind MOUSE1 +vstr autosprintON autosprintOFF"
set autosprintON "+attack; +sprint;" //vstr pitchLow
set autosprintOFF "-attack; -sprint; vstr sprinting" // vstr pitchNormal

// SPRINT
// - A scripted -sprint has no key number, so the engine releases the button for every key (src/client/cl_input.c IN_KeyUp)
// - sprinting remembers a held LEFTSHIFT, so the scripts that end with -sprint (autosprint, jump) resume it
bind LEFTSHIFT "+vstr sprintON sprintOFF"
set sprintON "+sprint; set sprinting +sprint"
set sprintOFF "-sprint; set sprinting vstr null"

// AUTOSPRINT FOR JUMP
// Activates sprint while/before jumping for higher jumps
// - TODO: Problem: sometimes buggy
// SPACE start bind: profiles/<profile>/state.cfg (cs_default rebinds it)
// bind SPACE "+moveup"
set bindSpaceJump "bind SPACE +moveup"
set bindSpaceSprintJump "bind SPACE vstr jump"
set jump "+sprint; wait 10; +moveup; wait 3; -sprint; -moveup; vstr sprinting; vstr proneStand"  // waits are necessary for sprinting have effect on jump length and the second wait for the jump to work at all



// Top page (devmode/_menu.cfg) that opens the cheats (cheats.cfg), the location editor (locations.cfg, to check and fix location files, docs/locations.md) or the bot class switch (bots.cfg, omni-bot), each on the number keys.
// On a server, where cheats don't work, MODE opens the bot class switch alone (devmode/bots.cfg).
// - loc is legacy only and cheat protected: host the map with devmap (/devmap <map>)
// - loc add <name> / loc rename <name> need a name, so locations.cfg only shows them for the console

//--- [ DEV MODE ] ---//
// - Press MODE to show the commands in the popup area and put them on the number keys; 1-3 open a page, CAPSLOCK goes back: from a page to the top page, from a bot class page to bots.cfg
// - The keys keep the layer open; MODE again, ESC or F4 close it
// - MODE = AltGr (German layout); other keyboards may send RIGHTALT (docs/keybinds.md)
bind MODE "vstr devMode"
// - What MODE opens: the dev mode, unless serverconfigs/current_bots.cfg (tools/serverconfig.py) points devModeKind elsewhere: on a server
//   to botModeOpen while bots play in the own team, else to botModeNone. Without the tool or the file it stays the dev mode
set devMode "vstr resetLayers; set devModeKind vstr devModeOpen; execq profile/serverconfigs/current_bots.cfg; vstr devModeKind"  // resetLayers: an open voice chat, spawn or server menu would keep its binds
set devModeOpen "set locEditorToggle vstr locEditorON; set botPageHead vstr devModeBotsHead; set botPageBack vstr devModeBotsBack; set botPageDone vstr devModeBotsDone; execq profile/scripts/devmode/_menu.cfg; vstr playSelect; set devMode vstr devModeOFF"
set botModeOpen "set botPageHead vstr botModeHead; set botPageBack vstr null; set botPageDone vstr botModeDone; execq profile/scripts/devmode/bots.cfg; vstr playSelect; set devMode vstr devModeOFF"
// Bot class switch (devmode/bots.cfg): in the dev mode CAPSLOCK goes back to the top page and a choice back to bots.cfg; on a server it has no CAPSLOCK and a choice closes it (resetLayers also resets MODE)
set devModeBotsHead "echo ^8DEV MODE 3. BOT CLASS SWITCH ^2CAPSLOCK back^8: ^7switch a bot from class ^1(omni-bot only)"
set devModeBotsBack "bind CAPSLOCK execq profile/scripts/devmode/_menu.cfg"
set devModeBotsDone "vstr playSelect; execq profile/scripts/devmode/bots.cfg"
set botModeDone "vstr playSelect; vstr resetLayers"
set botModeNone "echo ^8BOTS: ^1no bots in your team; vstr playError"
set botModeHead "echo ^8BOTS: ^7switch a bot from class"  // the tool sets it with the number of bots (current_bots.cfg)
set devModeOFF "vstr resetLayers; vstr playCancel"

// Location editor toggle: every map load closes the editor (cgame restarts), so opening the dev mode starts the toggle at ON again
set locEditorON "loc open; set locEditorToggle vstr locEditorOFF; echo ^8LOCATION EDITOR ^2ON; vstr playSelect"
set locEditorOFF "loc close; set locEditorToggle vstr locEditorON; echo ^8LOCATION EDITOR ^1OFF; vstr playCancel"

// Spawn spots: cg_drawSpawnpoints (legacy only) shows them in warmup or with cheats
// Toggle start: profiles/<profile>/state.cfg
set drawSpawnpointsON "vstr cg_drawSpawnpointsNormal; set drawSpawnpointsToggle vstr drawSpawnpointsOFF; echo ^8SPAWNPOINTS ^2ON; vstr playSelect"
set drawSpawnpointsOFF "cg_drawSpawnpoints 0; set drawSpawnpointsToggle vstr drawSpawnpointsON; echo ^8SPAWNPOINTS ^1OFF; vstr playCancel"

echo "^5    *** DEV MODE LOADED!"

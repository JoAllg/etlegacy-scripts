//--- [ TEAM & CLASS SELECTION ] ---//
// Select a team once, after that you can press the class selection keys
// - For compatibility with "class" command, the user joins a team first before the correct class is selected. Can cause you to spawn as a different class you join a team for the first time.
// - Some classes allow to select 'Sten': only for servers with customization, i.e. polsky server
// - Could be enhanced by using a key combination (emulating the voice chat). e.g. pressing v 1 4 5. Could work by binding the correct keys on the fly, return to default binds by execing a cfg file. Echo the available keys?

// Team selection
bind KP_END "vstr teamAllies" // Team Allies
bind KP_DOWNARROW "vstr teamSpectator" // Spectator
bind KP_PGDN "vstr teamAxis" // Team Axis

// Class selection
bind KP_HOME "vstr so" // Soldier (Panzer, MG42, Mortar or Flamethrower)
bind KP_UPARROW "vstr me" // Medic (SMG, Sten)
bind KP_PGUP "vstr en" // Engineer (SMG, Rifle + Grens)
bind KP_LEFTARROW "vstr fo" // Field Ops (SMG, Sten)
bind KP_5 "vstr co" // Covert Ops (Sten, FG42 or Rifle + Scope)

// Class reset: Reset binds and toggles to their default values. Also resets the class selectors cycles
// - It does not reset the current team or team settings (ta_Axis, ta_Allies aliases)
bind KP_RIGHTARROW "vstr classReset"

// Fireteam choice 
set fireteamChoice "vote no"  // (set to empty "" if you want to choose ingame

// Spectator command
set setTeamSpectator "team spectator" // To be overwritten by mod specific cfg


//--- [ CLASS BINDINGS ] ---//
// Overview of the binds per class: tools/keymap/keymap.html (generated from these scripts, class view per class key)
// TODO: weapalt on normal (mouse) key would still be good to be able to through knifes
// vll when changing to weaponbank 1 ?

// Class assignments & settings
// Here you can assign custom scripts/binds and settings for each class
// - The scripts are in class/cs_classcripts.cfg
// - These commands could also exec a class specific cfg file
set cs_soldier_panzer ""
set cs_soldier_mg42 ""
set cs_soldier_mortar "set bindGMode vstr bindGMaptoggle; vstr bindGMode"
set cs_soldier_fthrower ""
set cs_medic_smg "vstr bindMouse4Medpack; vstr bindMouse5Weapon5; vstr bindLessWeapon7"
set cs_medic_sten "vstr bindMouse4Medpack; vstr bindMouse5Weapon5; vstr bindLessWeapon7"
set cs_engineer_smg "vstr bindMouse4Dynamite; vstr bindMouse5Pliers; vstr bindLessWeapon7"
set cs_engineer_rifle "vstr bindMouse4Dynamite; vstr bindMouse5Pliers; vstr bindLessWeapon7"
set cs_engineer_sten "vstr bindMouse4Dynamite; vstr bindMouse5Pliers; vstr bindLessWeapon7"
set cs_fieldops_smg "vstr bindMouse4Ammopack; vstr bindMouse5Arty; vstr bindLessAirstrike"
set cs_fieldops_sten "vstr bindMouse4Ammopack; vstr bindMouse5Arty; vstr bindLessAirstrike"
set cs_covops_sten "vstr bindMouse4Satchel; vstr bindLessWeapon5; vstr bindMouse5StealUniform"
set cs_covops_fg42 "vstr bindMouse4Satchel; vstr bindLessWeapon5; vstr bindMouse5StealUniform; vstr bindMouse3Sniper"
set cs_covops_rifle "vstr bindMouse4Satchel; vstr bindLessWeapon5; vstr bindMouse5StealUniform; vstr bindMouse3Sniper"
// Default assignments for all classes
// - bindMouse2Mode: MOUSE2 mode of the F5 cycle (scripts/movement.cfg)
// - bindGMode: G bind of the class (map toggle for the mortar soldier), a pointer so that ta_Team can put it back
// - MOUSE3-5 and < are class keys: unbound here, so a class without a script for them keeps none of the previous class
set cs_default "vstr bindMouse2Mode; vstr bindMwheeldownWeapalt; vstr bindMwheelupActivate; set bindGMode vstr bindGMap; vstr bindGMode; vstr bindSpaceSprintJump; unbind MOUSE3; unbind MOUSE4; unbind MOUSE5; unbind <"  // Used to (re)set binds to their default values
// Reset side effects of classscripts and other scripts. I.e. everything that should reset between class changes.
set resetToggles "vstr resetSniper; vstr resetMap"  // Used to reset other toogles that should be reset between class changes.

bind l "openlimbomenu; vstr cs_default; vstr resetToggles" // reset class-script binds when changing class via limbo menu (which is discouraged)

// Team assignments & settings
// Here you can assign custom scripts/binds and settings for each team
// - Sets brigthness for better visibility of player models depending on the enemy team
// - gamma does not affect visibility, it is only used to adapt the brightness level for different r_mapOverBrightBits values
// - r_overBrightBits "1" should be set for better visibility of player models by default. Or mabye to 0 if mapOverBrightBits 3 ?
// - The overbright cvars are latched and need vid_restart: brightness<Team> applies them only when the other team's (or the start) values
//   are active. It then disables itself and arms the other team's alias (start values, both armed: profiles/<profile>/state.cfg)
set ta_Axis "vstr brightnessAxis; r_gamma 2"
set ta_Allies "vstr brightnessAllies; r_gamma 1.75"
set setBrightnessAxis "r_mapOverBrightBits 0; r_overBrightBits 1; set brightnessAxis vstr null; set brightnessAllies vstr setBrightnessAllies; vid_restart"
set setBrightnessAllies "r_mapOverBrightBits 3; r_overBrightBits 0; set brightnessAllies vstr null; set brightnessAxis vstr setBrightnessAxis; vid_restart"
set ta_Spectator "vstr bindMouse2Weapalt; vstr bindGMap; vstr bindSpaceJump"  // reset r_gamma; reset r_mapOverBrightBits; vid_restart
// Undoes ta_Spectator, run by autoexec_axis/allies.cfg: the game runs autoexec_spectator.cfg before the team's one on every map load and
// vid_restart (also the one of brightness<Team> right after a class key), which would leave a player with the spectator binds
// - The class binds are not reset by ta_Spectator for that reason: the spectator key does it (teamSpectator, class/cs_backend.cfg)
set ta_Team "vstr bindMouse2Mode; vstr bindGMode; vstr bindSpaceSprintJump"



//-------------------------------------------
exec profile/scripts/class/cs_backend.cfg
exec profile/scripts/class/cs_classcommands.cfg
exec profile/scripts/class/cs_classcripts.cfg
exec profile/scripts/class/cs_output.cfg
//-------------------------------------------
echo "^5    *** CLASSSCRIPT LOADED!"

// DEV MODE: top page of the dev mode, exec'd when opened (devMode, scripts/devmode.cfg) and by CAPSLOCK on its pages

// Echos
vstr popupsMenu
echo "^8DEV MODE:"
echo "^31. ^7Cheats"
echo "^32. ^7Location editor"
echo "^33. ^7Bot class switch"

// Binds
vstr unbindNumbers
bind 1 "execq profile/scripts/devmode/cheats.cfg"
bind 2 "execq profile/scripts/devmode/locations.cfg"
bind 3 "execq profile/scripts/devmode/bots.cfg"

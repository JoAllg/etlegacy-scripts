// Bot class switch, page of the class a bot has now: exec'd by the bot page (bots.cfg on a server, page3.cfg in the dev mode)
// omni-bot (goal_voicechat.gm) reads a team chat line of exactly 7 characters "<from> <to>": one bot of class <from> takes class <to> at its next spawn; color codes would count, so the text stays plain

// Echos
vstr popupsMenu
echo "^8BOT FROM SOLDIER TO ^2CAPSLOCK back^8: switches at its next spawn"
echo "^32. ^7Medic"
echo "^33. ^7Engineer"
echo "^34. ^7Field Ops"
echo "^35. ^7Covert Ops"

// Binds
vstr unbindNumbers
bind 2 "say_teamnl sol med; vstr botPageDone"
bind 3 "say_teamnl sol eng; vstr botPageDone"
bind 4 "say_teamnl sol fop; vstr botPageDone"
bind 5 "say_teamnl sol cov; vstr botPageDone"
bind CAPSLOCK "vstr botPageBack"

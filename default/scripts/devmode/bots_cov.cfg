// Bot class switch, page of the class a bot has now: exec'd by the bot page (bots.cfg on a server, page3.cfg in the dev mode)
// omni-bot (goal_voicechat.gm) reads a team chat line of exactly 7 characters "<from> <to>": one bot of class <from> takes class <to> at its next spawn; color codes would count, so the text stays plain

// Echos
vstr popupsMenu
echo "^8BOT FROM COVERT OPS TO ^2CAPSLOCK back^8: switches at its next spawn"
echo "^31. ^7Soldier"
echo "^32. ^7Medic"
echo "^33. ^7Engineer"
echo "^34. ^7Field Ops"

// Binds
vstr unbindNumbers
bind 1 "say_teamnl cov sol; vstr botPageDone"
bind 2 "say_teamnl cov med; vstr botPageDone"
bind 3 "say_teamnl cov eng; vstr botPageDone"
bind 4 "say_teamnl cov fop; vstr botPageDone"
bind CAPSLOCK "vstr botPageBack"

// DEV MODE 2. LOCATION EDITOR: location editor page of the dev mode, exec'd by 2 on its top page (devmode/_menu.cfg)

// Echos
vstr popupsMenu
echo "^8DEV MODE 2. LOCATION EDITOR ^2CAPSLOCK back^8: ^1needs cheats, host with ^7/devmap <map>"
echo "^31. ^7loc open/close: location points on/off"
echo "^32. ^7viewpos: own position (eye height)"
echo "^33. ^7loc move: nearest point to own position ^1(team only)"
echo "^34. ^7loc remove: delete the nearest point ^1(team only)"
echo "^35. ^7loc dump: list the points in the console"
echo "^36. ^7loc save: write <map>_loc_local.dat"
echo "^37. ^7loc reload: reread the location files"
echo "^38. ^7Spawnpoints on/off"
echo "^8CONSOLE: ^7/loc add <name>^8, ^7/loc rename <name> ^8(nearest point) ^1(team only)"

// Binds
vstr unbindNumbers
bind 1 "vstr locEditorToggle"
bind 2 "viewpos"
bind 3 "loc move"
bind 4 "loc remove"
bind 5 "loc dump; echo ^8LOC DUMP ^7console only, no file written"
bind 6 "loc save; echo ^1! ^8LOC SAVE ^7wrote <fs_homepath>/<mod>/maps/<map>_loc_local.dat; echo ^1! ^8LOC SAVE ^7it wins over <map>_loc_override.dat: check it, merge it into the override, delete it; vstr playError"
bind 7 "loc reload"
bind 8 "vstr drawSpawnpointsToggle"
bind CAPSLOCK "execq profile/scripts/devmode/_menu.cfg"

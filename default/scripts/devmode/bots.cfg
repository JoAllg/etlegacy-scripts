// BOTS: what MODE opens on a server with bots in the own team (botModeOpen, scripts/devmode.cfg); picks the class a bot has now, its page (bots_<class>.cfg) the class to switch to

set botPageBack "execq profile/scripts/devmode/bots.cfg"  // CAPSLOCK on a class page goes back here
set botPageDone "vstr playSelect; vstr resetLayers"  // after a choice: closed (resetLayers also resets MODE)

// Echos
vstr popupsMenu
vstr botModeHead  // title with the number of bots, tools/serverconfig.py
echo "^31. ^7Soldier"
echo "^32. ^7Medic"
echo "^33. ^7Engineer"
echo "^34. ^7Field Ops"
echo "^35. ^7Covert Ops"

// Binds
vstr unbindNumbers
bind 1 "execq profile/scripts/devmode/bots_sol.cfg"
bind 2 "execq profile/scripts/devmode/bots_med.cfg"
bind 3 "execq profile/scripts/devmode/bots_eng.cfg"
bind 4 "execq profile/scripts/devmode/bots_fop.cfg"
bind 5 "execq profile/scripts/devmode/bots_cov.cfg"

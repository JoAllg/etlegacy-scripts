// BOTS: bot class switch, exec'd by botModeOpen (MODE on a server with bots in the own team) and by 3 on the dev mode's top page (scripts/devmode.cfg);
// picks the class a bot has now, its page (bots_<class>.cfg) the class to switch to.
// What opened it sets the title (botPageHead), CAPSLOCK here (botPageBack) and what a choice does (botPageDone)

// Echos
vstr popupsMenu
vstr botPageHead
echo "^31. ^7Soldier"
echo "^32. ^7Medic"
echo "^33. ^7Engineer"
echo "^34. ^7Field Ops"
echo "^35. ^7Covert Ops"

// Binds
vstr unbindNumbers
bind 1 "execq profile/scripts/devmode/bots_sol.cfg"
bind 2 "execq profile/scripts/devmode/bots_med.cfg"
bind 3 "execq profile/scripts/devmode/bots_eng.cfg"
bind 4 "execq profile/scripts/devmode/bots_fop.cfg"
bind 5 "execq profile/scripts/devmode/bots_cov.cfg"
vstr botPageBack

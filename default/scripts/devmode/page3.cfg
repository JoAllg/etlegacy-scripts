// DEV MODE 3/3: bot class switch of the dev mode (local game), exec'd by TAB on page 2; picks the class a bot has now, its page (bots_<class>.cfg) the class to switch to

set botPageBack "execq profile/scripts/devmode/page3.cfg"  // CAPSLOCK on a class page goes back here
set botPageDone "vstr playSelect; vstr botPageBack"  // after a choice: back here, the dev mode stays open

// Echos
vstr popupsMenu
echo "^8DEV MODE 3/3 ^2TAB next page^8: ^7switch a bot from class ^1(omni-bot only)"
echo "^31. ^7Soldier"
echo "^32. ^7Medic"
echo "^33. ^7Engineer"
echo "^34. ^7Field Ops"
echo "^35. ^7Covert Ops"

// Binds
vstr unbindNumbers
bind TAB "execq profile/scripts/devmode/page1.cfg"
bind 1 "execq profile/scripts/devmode/bots_sol.cfg"
bind 2 "execq profile/scripts/devmode/bots_med.cfg"
bind 3 "execq profile/scripts/devmode/bots_eng.cfg"
bind 4 "execq profile/scripts/devmode/bots_fop.cfg"
bind 5 "execq profile/scripts/devmode/bots_cov.cfg"

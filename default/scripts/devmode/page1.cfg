// DEV MODE 1/2: cheat page of the dev mode, exec'd when opened (devMode, scripts/devmode.cfg) and by TAB on page 2

// Echos
vstr popupsMenu
echo "^8DEV MODE 1/2 ^2TAB next page^8: ^1needs cheats, host with ^7/devmap <map>"
echo "^31. ^7noclip: fly through walls"
echo "^32. ^7god: invulnerable"
echo "^33. ^7notarget: bots ignore you"
echo "^34. ^7nofatigue: unlimited stamina"
echo "^35. ^7give all: all weapons and ammo"

// Binds
vstr unbindNumbers
bind TAB "execq profile/scripts/devmode/page2.cfg"
bind 1 "noclip"
bind 2 "god"
bind 3 "notarget"
bind 4 "nofatigue"
bind 5 "give all"

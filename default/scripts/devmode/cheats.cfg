// DEV MODE 1. CHEATS: cheat page of the dev mode, exec'd by 1 on its top page (devmode/_menu.cfg)

// Echos
vstr popupsMenu
echo "^8DEV MODE 1. CHEATS ^2CAPSLOCK back^8: ^1needs cheats, host with ^7/devmap <map>"
echo "^31. ^7noclip: fly through walls"
echo "^32. ^7god: invulnerable"
echo "^33. ^7notarget: bots ignore you"
echo "^34. ^7nofatigue: unlimited stamina"
echo "^35. ^7give all: all weapons and ammo"

// Binds
vstr unbindNumbers
bind 1 "noclip"
bind 2 "god"
bind 3 "notarget"
bind 4 "nofatigue"
bind 5 "give all"
bind CAPSLOCK "execq profile/scripts/devmode/_menu.cfg"

// Bot class switch, page of the class a bot has now: exec'd by the bot class switch (bots.cfg)
// omni-bot (goal_voicechat.gm) reads a team chat line of exactly 7 characters "<from> <to>": one bot of class <from> takes class <to> at its next spawn; color codes would count, so the text stays plain

// Echos
vstr popupsMenu
echo "^8BOT FROM ENGINEER TO ^2CAPSLOCK back^8: switches at its next spawn"
echo "^31. ^7Soldier"
echo "^32. ^7Medic"
echo "^34. ^7Field Ops"
echo "^35. ^7Covert Ops"

// Binds
vstr unbindNumbers
bind 1 "say_teamnl eng sol; vstr botPageDone"
bind 2 "say_teamnl eng med; vstr botPageDone"
bind 4 "say_teamnl eng fop; vstr botPageDone"
bind 5 "say_teamnl eng cov; vstr botPageDone"
bind CAPSLOCK "execq profile/scripts/devmode/bots.cfg"

// Start values of state: toggle/cycle pointers, keys that scripts rebind, cvars that scripts change.
// - Exec'd by mods/<mod>/autoexec.cfg only: at game start and after a mod switch. F3 re-execs the definitions
//   (profiles/<profile>/definitions.cfg via reloadDefinitions), which never contain these values, so they survive it
// - F1 forces a full reset (exec autoexec.cfg)
// - Per feature: state that should always reset (sniper mode, fps/crosshair size/hud/sound/name cycles) stays in the chain
// - "reset <alias>" returns to the value of the alias's first set in this game session, for most pointers the one here:
//   after editing such a start value, restart the game (F1 keeps the old reset value)

//--- [ WEAPON SWITCH ] ---//
// - MOUSE2 mode (F5 cycle, scripts/movement.cfg); the MOUSE2/MWHEELDOWN start binds come from modState (mods/<mod>/mod_general.cfg)
// - The weapons behind first/second are definitions (weaponSwitchOrder*, per server in serverconfigs/), only the step is state
set bindMouse2Mode "vstr bindMouse2Switch"  // start mode weapon switch, applied by cs_default on every class selection
set cycleWeaponSwitch "vstr weaponSwitchSecond"  // next F5 step, so the first press changes the mode
set weaponSwitch "vstr switchAlt"  // Next weapon to switch to
set switchAlt "vstr switchFirst"  // Alternative weapon to switch to (overwritten by the F5 cycle)
vstr setBankSelect  // forms of the pistol and SMG key (binds_custom.cfg): select with fallback until one of the two is in hand

//--- [ KEYS THAT SCRIPTS REBIND ] ---//
// - Class scripts (cs_*), weapon binds and the menu layers rebind these, so their start bind must not be in the chain
vstr bindTabScores  // binds_custom.cfg
bind MWHEELUP "zoomin"
vstr bindMouse1Sprint  // scripts/movement.cfg
vstr bindSpaceSprintJump  // scripts/movement.cfg
set bindGMode "vstr bindGMap"  // G bind of the class, set by the class scripts (classcript.cfg), put back by ta_Team
vstr bindGMode  // class/cs_classcripts.cfg
vstr bindWeapons  // Number row (binds_custom.cfg)

//--- [ TEAM & CLASS ] ---//
// - spawnSelector: spectator; a team choice sets the class guard, a class choice the spawn menu (scripts/spawnscript.cfg)
vstr setSpawnSelectorSpectator
vstr resetTeamBinds  // class keys ask for a team until a team key is pressed (class/cs_backend.cfg)
set chatFunction "vstr noTeam"
// Join hooks, armed (class/cs_backend.cfg runs them once per team join)
set preJoinHookb "vstr ta_Allies; vstr setTeamAllies; wait 50; set preJoinHookb vstr null; reset preJoinHookr"
set preJoinHookr "vstr ta_Axis; vstr setTeamAxis; wait 50; set preJoinHookr vstr null; reset preJoinHookb"
set postJoinHookb "vstr fireteamChoice; set postJoinHookb vstr null; reset postJoinHookr"
set postJoinHookr "vstr fireteamChoice; set postJoinHookr vstr null; reset postJoinHookb"
// Class cycles: next weapon variant per class (class/cs_backend.cfg)
set cycleAlliesSoldier "vstr b_so1"
set cycleAlliesMedic "vstr b_me1"
set cycleAlliesEngineer "vstr b_en1"
set cycleAlliesFieldOps "vstr b_fo1"
set cycleAlliesCovertOps "vstr b_co1"
set cycleAxisSoldier "vstr r_so1"
set cycleAxisMedic "vstr r_me1"
set cycleAxisEngineer "vstr r_en1"
set cycleAxisFieldOps "vstr r_fo1"
set cycleAxisCovertOps "vstr r_co1"
// Team brightness (classcript.cfg ta_Axis/ta_Allies); the gamma cycle (scripts/display.cfg) uses r_gamma independently and keeps its pointer in the chain
seta r_gamma "2"
seta r_mapOverBrightBits "1"
seta r_overBrightBits "1"
// Neither team's overbright values are active, so both teams apply theirs (vid_restart) on the first join
set brightnessAxis "vstr setBrightnessAxis"
set brightnessAllies "vstr setBrightnessAllies"

//--- [ CLASS VSAYS ] ---//
// - KP_MINUS toggle (class/cs_classcripts.cfg), off by default
vstr setClassVsaysOff
set classVsaysToggle "vstr classVsaysON"

//--- [ WEAPON TIMER ] ---//
// - No grenade or dynamite owns the timer (class/cs_classcripts.cfg resetWeaponTimer)
set weaponTimerStop "vstr null"

//--- [ CLASS REPORT ] ---//
// - KP_SLASH toggle (class/cs_output.cfg), off by default
set classReport "vstr null"
set classReportToggle "vstr classReportON"

//--- [ SPAWN REPORT ] ---//
// - KP_STAR toggle (scripts/spawnscript.cfg), off by default
set spawnReport "vstr null"
set spawnReportToggle "vstr spawnReportON"

//--- [ CROSSHAIR COLOR ] ---//
// - Set per map by the autoexecs, which F3 must not undo
vstr crosshairColorNormal  // cvars.cfg

//--- [ WINDOW MODE & NETWORK ] ---//
// - INS window mode toggle and DEL network cycle (scripts/display.cfg); window cvars are latched and apply at the next vid_restart
vstr setWindowFullscreen
set windowToggle "vstr windowBorderless"
vstr setNetNormal
set cycleNet "vstr netUnstable"

//--- [ ECHO MENU POPUPS ] ---//
// - Nothing to restore until a menu page ran popupsMenu (scripts/scripts.cfg)
set popupsClose "vstr null"

//--- [ MOD SPECIFIC ] ---//
// - Alt-fire key binds of this mod, defined in mods/<mod>/mod_general.cfg
vstr modState

echo "^5  *** STATE VALUES LOADED!"

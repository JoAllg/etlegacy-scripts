// Server settings (docs/serverconfigs.md): tools/serverconfig.py writes current.cfg, which execs this file and then
// <id>.cfg of the server the game is on (servers.tsv), once per server change and again after F3 and F1.
// - This file is the only thing that undoes a server cfg: every name a server cfg sets (cvar, alias, bind) gets its
//   normal value here, else it keeps the server's value on all other servers (the tool warns about such names)
// - Runs after the definitions, user.cfg and state.cfg, so values here and in a server cfg override all of them.
//   Not what the event that applies them sets afterwards: a class key's class script, the rest of a map or team autoexec
// - Absolute values only (never a toggle or cycle step): both files run again on every server change
// - A value set here overrides user.cfg on every server: restore through the value alias where one exists and name
//   the cvar for the tool's check, e.g. "vstr fovNormal  // cg_fov"

vstr weaponSwitchOrderPistol  // MOUSE2 weapon switch: pistols first, F5 then SMG (scripts/movement.cfg)

// Class steps a server cfg appends or redefines (docs/serverconfigs.md "Class steps")
// - reset: back to the value of scripts/class/cs_backend.cfg, the first set of the game session (soldier steps, cycle ends)
reset b_so1; reset b_so2; reset b_so3; reset b_so4; reset b_so5; reset b_me2; reset b_en3; reset b_fo2; reset b_co4
reset r_so1; reset r_so2; reset r_so3; reset r_so4; reset r_so5; reset r_me2; reset r_en3; reset r_fo2; reset r_co4
// - Steps past the cycle end exist in server cfgs only, so their first set is the server's: back to the first step of the class
set b_so6 "vstr b_so1"
set b_en4 "vstr b_en1"
set b_fo3 "vstr b_fo1"
set b_co5 "vstr b_co1"
set r_so6 "vstr r_so1"
set r_en4 "vstr r_en1"
set r_fo3 "vstr r_fo1"
set r_co5 "vstr r_co1"

echo "^5>>> SERVER DEFAULTS LOADED!"

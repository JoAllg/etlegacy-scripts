// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
exec profile/scripts/spawn/generic_spawnpoints.cfg  // generic list first, so the previous map's spawnpoints are gone
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
set spawnp0r    "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect;"
set spawnp1r    "setspawnpt 6; vstr resetSpawnSelector; set spawnsay vstr spawnsay1; vstr playSelect;"
set spawnp2r    "setspawnpt 2; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect;"
set spawnp3r    "setspawnpt 3; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect;"

set spawnp0b    "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect;"
set spawnp1b    "setspawnpt 3; vstr resetSpawnSelector; set spawnsay vstr spawnsay3; vstr playSelect;"
set spawnp2b    "setspawnpt 4; vstr resetSpawnSelector; set spawnsay vstr spawnsay4; vstr playSelect;"
set spawnp3b    "setspawnpt 7; vstr resetSpawnSelector; set spawnsay vstr spawnsay4; vstr playSelect;"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r; vstr echosp2r; vstr echosp3r"
set echosp0r    "echo ^31. ^7Default Spawn"
set echosp1r    "echo ^32. ^iRadio Room"
set echosp2r    "echo ^33. ^iAxis Side - Top Bunker"
set echosp3r    "echo ^34. ^iAxis Side - Lower Bunker"

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b; vstr echosp1b; vstr echosp2b; vstr echosp3b"
set echosp0b    "echo ^31. ^7Default Spawn"
set echosp1b    "echo ^32. ^dForward Bunker"
set echosp2b    "echo ^33. ^dAllied Side - -2023 2462 90"
set echosp3b    "echo ^34. ^dAllied Side - -2032 1690 85"
// not selectable while the rooms above are active: Allied Side - Beach

// Announce spawnpoints
set spawnsay0   "vstr playFilter; say_teamnl ^5will spawn at ^0Default Spawn"
set spawnsay1   "vstr playFilter; say_teamnl ^5will spawn at ^wRadio Room"
set spawnsay2   "vstr playFilter; say_teamnl ^5will spawn at ^wAxis Side"
set spawnsay3   "vstr playFilter; say_teamnl ^5will spawn at ^wForward Bunker"
set spawnsay4   "vstr playFilter; say_teamnl ^5will spawn at ^wAllied Side"

echo ^5>>> AUTOEXEC_MAP LOADED!

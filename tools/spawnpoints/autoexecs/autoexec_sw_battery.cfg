// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
exec profile/scripts/spawn/generic_spawnpoints.cfg  // generic list first, so the previous map's spawnpoints are gone
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
set spawnp0r    "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect;"
set spawnp1r    "setspawnpt 1; vstr resetSpawnSelector; set spawnsay vstr spawnsay1; vstr playSelect;"
set spawnp2r    "setspawnpt 4; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect;"
set spawnp3r    "setspawnpt 5; vstr resetSpawnSelector; set spawnsay vstr spawnsay3; vstr playSelect;"
set spawnp4r    "setspawnpt 6; vstr resetSpawnSelector; set spawnsay vstr spawnsay4; vstr playSelect;"

set spawnp0b    "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect;"
set spawnp1b    "setspawnpt 2; vstr resetSpawnSelector; set spawnsay vstr spawnsay5; vstr playSelect;"
set spawnp2b    "setspawnpt 3; vstr resetSpawnSelector; set spawnsay vstr spawnsay6; vstr playSelect;"
set spawnp3b    "setspawnpt 4; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect;"
set spawnp4b    "setspawnpt 7; vstr resetSpawnSelector; set spawnsay vstr spawnsay7; vstr playSelect;"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r; vstr echosp2r; vstr echosp3r; vstr echosp4r"
set echosp0r    "echo ^31. ^7Default Spawn"
set echosp1r    "echo ^32. ^iAxis Main Bunker"
set echosp2r    "echo ^33. ^iEast Bunker"
set echosp3r    "echo ^34. ^iWest Bunker"
set echosp4r    "echo ^35. ^iAxis Spawn"
// not selectable while the rooms above are active: West Bunker - Forward Bunker

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b; vstr echosp1b; vstr echosp2b; vstr echosp3b; vstr echosp4b"
set echosp0b    "echo ^31. ^7Default Spawn"
set echosp1b    "echo ^32. ^dAllied East Beach"
set echosp2b    "echo ^33. ^dAllied West Beach"
set echosp3b    "echo ^34. ^dEast Bunker"
set echosp4b    "echo ^35. ^dAllied Spawn"
// not selectable while the rooms above are active: West Bunker - Forward Bunker

// Announce spawnpoints
set spawnsay0   "vstr playFilter; say_teamnl ^5will spawn at ^0Default Spawn"
set spawnsay1   "vstr playFilter; say_teamnl ^5will spawn at ^wAxis Main Bunker"
set spawnsay2   "vstr playFilter; say_teamnl ^5will spawn at ^wEast Bunker"
set spawnsay3   "vstr playFilter; say_teamnl ^5will spawn at ^wWest Bunker"
set spawnsay4   "vstr playFilter; say_teamnl ^5will spawn at ^wAxis Spawn"
set spawnsay5   "vstr playFilter; say_teamnl ^5will spawn at ^wAllied East Beach"
set spawnsay6   "vstr playFilter; say_teamnl ^5will spawn at ^wAllied West Beach"
set spawnsay7   "vstr playFilter; say_teamnl ^5will spawn at ^wAllied Spawn"

echo ^5>>> AUTOEXEC_MAP LOADED!

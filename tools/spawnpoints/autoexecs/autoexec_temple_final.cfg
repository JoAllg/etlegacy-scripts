// Settings
exec autoexec_mod.cfg  // this mod's autoexec.cfg, only after a mod switch (fs_game change doesn't re-exec it)
exec profile/scripts/spawn/generic_spawnpoints.cfg  // generic list first, so the previous map's spawnpoints are gone
set spawnSelectorMap "vstr spawnSelector3"  // own spawn menu; set only in autoexecs, so re-execing the cfgs keeps it

// Spawnpoints
set spawnp0r    "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect;"
set spawnp1r    "setspawnpt 2; vstr resetSpawnSelector; set spawnsay vstr spawnsay1; vstr playSelect;"
set spawnp2r    "setspawnpt 5; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect;"
set spawnp3r    "setspawnpt 4; vstr resetSpawnSelector; set spawnsay vstr spawnsay3; vstr playSelect;"
set spawnp4r    "setspawnpt 6; vstr resetSpawnSelector; set spawnsay vstr spawnsay3; vstr playSelect;"

set spawnp0b    "setspawnpt 0; vstr resetSpawnSelector; set spawnsay vstr spawnsay0; vstr playSelect;"
set spawnp1b    "setspawnpt 1; vstr resetSpawnSelector; set spawnsay vstr spawnsay4; vstr playSelect;"
set spawnp2b    "setspawnpt 2; vstr resetSpawnSelector; set spawnsay vstr spawnsay1; vstr playSelect;"
set spawnp3b    "setspawnpt 3; vstr resetSpawnSelector; set spawnsay vstr spawnsay5; vstr playSelect;"
set spawnp4b    "setspawnpt 4; vstr resetSpawnSelector; set spawnsay vstr spawnsay6; vstr playSelect;"
set spawnp5b    "setspawnpt 5; vstr resetSpawnSelector; set spawnsay vstr spawnsay2; vstr playSelect;"
set spawnp6b    "setspawnpt 7; vstr resetSpawnSelector; set spawnsay vstr spawnsay7; vstr playSelect;"

// Echo spawnpoints
set echospr      "echo ^8SPAWNPOINTS:; vstr echosp0r; vstr echosp1r; vstr echosp2r; vstr echosp3r; vstr echosp4r"
set echosp0r    "echo ^31. ^7Default Spawn"
set echosp1r    "echo ^32. ^iAxis Spawn"
set echosp2r    "echo ^33. ^iFort"
set echosp3r    "echo ^34. ^iTemple - Temple Pit Room"
set echosp4r    "echo ^35. ^iTemple - Temple"
// not selectable while the rooms above are active: Temple - Temple; Axis Spawn - Axis Spawn; Fort - Fort

set echospb      "echo ^8SPAWNPOINTS:; vstr echosp0b; vstr echosp1b; vstr echosp2b; vstr echosp3b; vstr echosp4b; vstr echosp5b; vstr echosp6b"
set echosp0b    "echo ^31. ^7Default Spawn"
set echosp1b    "echo ^32. ^dAllied Side"
set echosp2b    "echo ^33. ^dAxis Spawn"
set echosp3b    "echo ^34. ^dCanyon Hut"
set echosp4b    "echo ^35. ^dTemple Entrance"
set echosp5b    "echo ^36. ^dFort"
set echosp6b    "echo ^37. ^dChruch Ruins"
// not selectable while the rooms above are active: Allied Side - -2333 6688 1032; Fort - Fort; Allied Side - -3197 5914 1024

// Announce spawnpoints
set spawnsay0   "vstr playFilter; say_teamnl ^5will spawn at ^0Default Spawn"
set spawnsay1   "vstr playFilter; say_teamnl ^5will spawn at ^wAxis Spawn"
set spawnsay2   "vstr playFilter; say_teamnl ^5will spawn at ^wFort"
set spawnsay3   "vstr playFilter; say_teamnl ^5will spawn at ^wTemple"
set spawnsay4   "vstr playFilter; say_teamnl ^5will spawn at ^wAllied Side"
set spawnsay5   "vstr playFilter; say_teamnl ^5will spawn at ^wCanyon Hut"
set spawnsay6   "vstr playFilter; say_teamnl ^5will spawn at ^wTemple Entrance"
set spawnsay7   "vstr playFilter; say_teamnl ^5will spawn at ^wChruch Ruins"

echo ^5>>> AUTOEXEC_MAP LOADED!

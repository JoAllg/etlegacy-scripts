// Personal settings, not in version control: copy to profiles/user.cfg and edit.
// - Exec'd after the definitions by mods/<mod>/autoexec.cfg and by F3 (reloadDefinitions), so values here override
//   the general and mod files. This is supposed to help you overwrite cvars, you will probably still need to overwrite values like bind keys where they are defined anyway...
// - profiles/<profile>/state.cfg runs after it at game start: its start values of state (toggles, r_gamma, ...) win on
//   purpose until the next restart/F1; the aliases below are what it applies
// - Color codes: docs/colors.md, special characters: docs/special_chars.md

//--- [ NAME ] ---//
set nameDefault "name ETPlayer"
vstr nameDefault

set name2 "name ETPlayer2"
set name3 "name ETPlayer3"

//--- [ NAME CYCLE ] ---//
// - cycles through the names
// - Each entry sets the next one, so the last must point back at nameMain
bind PGDN vstr cycleName
set cycleName vstr nameMain
set nameMain "vstr nameDefault; set cycleName vstr nameAlt1; vstr playSelect; echo ^8NAME SET TO ^2Default;"
set nameAlt1 "vstr name2; set cycleName vstr nameAlt2; vstr playSelect; echo ^8NAME SET TO ^2ETPlayer2;"
set nameAlt2 "vstr name3; set cycleName vstr nameMain; vstr playSelect; echo ^8NAME SET TO ^2ETPlayer3;"

//--- [ FPS ] ---//
// - Defaults: profiles/<profile>/cvars.cfg; the FPS cycle (END, scripts/display.cfg) changes both until the next F3
// - Sniper FPS (maxFpsLow) stays in cvars.cfg: mods/<mod>/mod_general.cfg sets it per mod
seta com_maxfps "125"
set maxFpsNormal "com_maxfps 125"  // weapon switches and sniper off return to it

//--- [ MOUSE ] ---//
// - Defaults: profiles/<profile>/cvars.cfg (ET: Legacy defaults); scripts switch m_pitch between the pitch aliases
seta sensitivity "5"
set sensitivityNormal "sensitivity 5"
seta m_pitch "0.022"
set pitchNormal "m_pitch 0.022"
set pitchLow "m_pitch 0.014"  // crouch aim (lower fov)
set pitchHigher "m_pitch 0.025"  // syringe/pliers (MOUSE5)
set pitchSniper "m_pitch 0.055"  // sniper mode
seta m_yaw "0.022"
seta cg_scopedSensitivityScaler "0.6"  // scoped sensitivity relative to the zoom

//--- [ VIEW ] ---//
// - Defaults: profiles/<profile>/cvars.cfg; crouch/prone switch to fovLow (set per mod: minimum 75 legacy, 90 nitmod)
seta cg_fov "90"
set fovNormal "cg_fov 90"
set fovMax "cg_fov 120"  // stealing a uniform
seta r_displayrefresh "0"  // monitor refresh rate in Hz, 0 = driver default; latched (vid_restart)

//--- [ DISPLAY & NETWORK ] ---//
// - Defaults: profiles/<profile>/scripts/display.cfg; profiles/<profile>/state.cfg applies them at game start
// - Fullscreen resolution of the window mode toggle (INS); borderless uses the desktop resolution
set fullscreenResolution "r_customwidth 1280; r_customheight 720"
// - Rates of the network cycle (DEL) in normal and unstable mode; the server caps snaps at sv_fps and rate at sv_maxRate
// - com_maxfps should be a multiple of cl_maxpackets (profiles/<profile>/README.md)
set netNormalRates "snaps 20; rate 25000; cl_maxpackets 125"

//--- [ OMNI-BOT ] ---//
// - Bots for local hosting (default/server/server.cfg)
// - Absolute path: a relative one is resolved from the directory ET was started in, not ~/.etlegacy
// - deploy.sh fills in HOMEPATH of settings.conf when it creates user.cfg
seta omnibot_path "/home/<user>/.etlegacy/legacy/omni-bot"

echo "^5  *** USER SETTINGS LOADED!"